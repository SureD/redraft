let native = BlockTextView(usingTextLayoutManager: true)\n    native.isEditable = true\n    native.textStorage?.setAttributedString(\n      RichTextBridge.attributedString(from: model.selectedBlock!.text))\n    native.setMarkedText(\n      \"pin\", selectedRange: NSRange(location: 3, length: 0),\n      replacementRange: NSRange(location: 0, length: 2))\n    coordinator.commit(native)\n    try expect(\n      model.selectedBlock?.plainText == \"旧稿\", \"Input method composition stays in the native buffer\")\n    model.updateBlockText(blockID, text: NSAttributedString(string: \"外部更新\"))\n    native.unmarkText()\n    coordinator.commit(native)\n    try expect(\n      model.selectedBlock?.plainText == \"外部更新\" && native.string == \"外部更新\",\n      \"A stale composition cannot overwrite a newer document and must restore the authoritative content\"\n    )\n    native.textStorage?.append(NSAttributedString(string: \"一\"))\n    coordinator.commit(native)\n    native.textStorage?.append(NSAttributedString(string: \"二\"))\n    coordinator.commit(native)\n    try expect(\n      model.selectedBlock?.plainText == \"外部更新一二\",\n      \"Rapid commits advance their base before the next UI render\")\n  }\n\n  @MainActor\n  private static func mixedFormattingPreservesRuns() throws {\n    let source = NSMutableAttributedString(\n      string: \"甲乙丙丁\", attributes: [.font: NSFont.systemFont(ofSize: 17)])\n    source.addAttribute(\n      .font, value: NSFont.boldSystemFont(ofSize: 21), range: NSRange(location: 0, length: 2))\n    let model = try model(text: source)\n    let selection = EditorSelectionStyle(text: source, range: model.state.selectedRange)\n    try expect(\n      selection.state(for: .bold) == .mixed && selection.commonSize == nil,\n      \"Mixed selections must report mixed styles\")\n    model.formatSelection(.size(24))\n    let resized = RichTextBridge.attributedString(from: model.selectedBlock!.text)\n    let first = resized.attribute(.font, at: 0, effectiveRange: nil) as! NSFont\n    let last = resized.attribute(.font, at: 3, effectiveRange: nil) as! NSFont\n    try expect(first.pointSize == 24 && last.pointSize == 24, \"Size applies to every selected run\")\n    try expect(\n      NSFontManager.shared.traits(of: first).contains(.boldFontMask)\n        && !NSFontManager.shared.traits(of: last).contains(.boldFontMask),\n      \"Changing size must preserve each run's emphasis\")\n    model.formatSelection(.font(\"Menlo\"))\n    let mono = RichTextBridge.attributedString(from: model.selectedBlock!.text)\n    try expect(\n      NSFontManager.shared.traits(of: mono.attribute(.font, at: 0, effectiveRange: nil) as! NSFont)\n        .contains(.boldFontMask), \"Changing family must preserve bold emphasis\")\n    model.formatSelection(.bold)\n    try expect(\n      EditorSelectionStyle(\n        text: RichTextBridge.attributedString(from: model.selectedBlock!.text),\n        range: model.state.selectedRange\n      ).state(\n        for: .bold) == .on, \"Toggling a mixed selection should enable the style everywhere\")\n    model.formatSelection(.bold)\n    try expect(\n      EditorSelectionStyle(\n        text: RichTextBridge.attributedString(from: model.selectedBlock!.text),\n        range: model.state.selectedRange\n      ).state(\n        for: .bold) == .off, \"Toggling a uniform selection should remove the style\")\n  }\n\n  @MainActor\n  private static func paragraphFormattingPreservesIndependentStyles() throws {\n    let source = NSMutableAttributedString(\n      string: \"One\\nTwo\", attributes: [.font: NSFont.systemFont(ofSize: 17)])\n    let first = NSMutableParagraphStyle()\n    first.paragraphSpacing = 8\n    let second = NSMutableParagraphStyle()\n    second.paragraphSpacing = 22\n    source.addAttribute(.paragraphStyle, value: first, range: NSRange(location: 0, length: 4))\n    source.addAttribute(.paragraphStyle, value: second, range: NSRange(location: 4, length: 3))\n    let model = try model(text: source)\n    model.formatSelection(.alignment(.center))\n    let text = RichTextBridge.attributedString(from: model.selectedBlock!.text)\n    let a = text.attribute(.paragraphStyle, at: 0, effectiveRange: nil) as! NSParagraphStyle\n    let b = text.attribute(.paragraphStyle, at: 4, effectiveRange: nil) as! NSParagraphStyle\n    try expect(\n      a.alignment == .center && b.alignment == .center && a.paragraphSpacing == 8\n        && b.paragraphSpacing == 22, \"Alignment must not overwrite unrelated paragraph styles\")\n    model.formatSelection(.list(false))\n    model.formatSelection(.list(true))\n    try expect(\n      EditorSelectionStyle(\n        text: RichTextBridge.attributedString(from: model.selectedBlock!.text),\n        range: model.state.selectedRange\n      ).state(\n        for: .list(true)) == .on, \"Numbered list switches from bullets without clearing the list\")\n  }\n\n  @MainActor\n  private static func clearingAtCaretDoesNotEraseDocumentFormatting() throws {\n    let source = NSAttributedString(\n      string: \"保留加粗\", attributes: [.font: NSFont.boldSystemFont(ofSize: 20)])\n    let model = try model(text: source)\n    model.state.selectedRange = NSRange(location: 1, length: 0)\n    model.formatSelection(.clear)\n    let first =\n      RichTextBridge.attributedString(from: model.selectedBlock!.text).attribute(\n        .font, at: 0, effectiveRange: nil) as! NSFont\n    try expect(\n      NSFontManager.shared.traits(of: first).contains(.boldFontMask),\n      \"Clear formatting at an insertion point must not erase the whole paragraph\")\n  }\n\n  @MainActor\n  private static func tableBoundariesRejectStaleCallbacks() throws {\n    let model = try model(text: NSAttributedString(string: \"\"))\n    let table = DocumentBlock(table: TableContent(rows: [[\"a\", \"b\"], [\"c\", \"d\"]]))\n    model.insertBlock(table)\n    let deletedRow = TableCell(rowID: table.table!.rowIDs[0], columnID: table.table!.columnIDs[1])\n    let deletedColumn = TableCell(\n      rowID: table.table!.rowIDs[1], columnID: table.table!.columnIDs[0])\n    let retained = TableCell(rowID: table.table!.rowIDs[1], columnID: table.table!.columnIDs[1])\n    model.deleteTableRow(table.id, at: 0)\n    model.updateTableCell(table.id, cell: deletedRow, text: \"stale\")\n    model.deleteTableColumn(table.id, at: 0)\n    model.updateTableCell(table.id, cell: deletedColumn, text: \"stale\")\n    try expect(\n      model.selectedBlock?.table?.rows == [[\"d\"]],\n      \"Stale text callbacks cannot access removed cells\")\n    model.insertTableRow(table.id, at: 0)\n    model.insertTableColumn(table.id, at: 0)\n    model.updateTableCell(table.id, cell: retained, text: \"live\")\n    try expect(\n      model.selectedBlock?.table?.rows[1][1] == \"live\",\n      \"Cell edits retain their identity when rows and columns move\")\n    for _ in 0..\u003c45 { model.insertTableRow(table.id, at: 99) }\n    for _ in 0..\u003c12 { model.insertTableColumn(table.id, at: 99) }\n    try expect(\n      model.selectedBlock?.table?.rows.count == 40 && model.selectedBlock?.table?.columnCount == 8,\n      \"Table insertion honors the UI's row and column limits\")\n  }\n\n  @MainActor\n  private static func nativeFormattingUndoAndComposition() throws {\n    let source = NSAttributedString(\n      string: \"输入法和撤销\", attributes: [.font: NSFont.systemFont(ofSize: 17)])\n    let native = BlockTextView(usingTextLayoutManager: true)\n    native.isEditable = true\n    native.allowsUndo = true\n    native.textStorage?.setAttributedString(source)\n    let selected = NSRange(location: 0, length: source.length)\n    native.setSelectedRange(selected)\n    let changed = NSMutableAttributedString(attributedString: source)\n    changed.addAttribute(.underlineStyle, value: NSUnderlineStyle.single.rawValue, range: selected)\n    let undo = native.undoManager!\n    undo.groupsByEvent = false\n    undo.beginUndoGrouping()\n    native.applyFormatting(changed, selection: selected, typing: EditorTypography.bodyAttributes)\n    undo.endUndoGrouping()\n    try expect(\n      undo.canUndo && native.attributedString().isEqual(to: changed),\n      \"Native formatting must register an undoable edit\")\n    undo.undo()\n    try expect(\n      native.attributedString().isEqual(to: source),\n      \"Undo restores the exact original attributed content\")\n    undo.redo()\n    try expect(native.attributedString().isEqual(to: changed), \"Redo restores formatting\")\n    undo.beginUndoGrouping()\n    native.setMarkedText(\n      \"pin\", selectedRange: NSRange(location: 3, length: 0), replacementRange: selected)\n    let composition = NSAttributedString(attributedString: native.attributedString())\n    native.applyFormatting(source, selection: selected, typing: EditorTypography.bodyAttributes)\n    try expect(\n      native.hasMarkedText() && native.attributedString().isEqual(to: composition),\n      \"Formatting must not replace an in-progress input method composition\")\n    native.unmarkText()\n    undo.endUndoGrouping()\n  }\n\n  @MainActor\n  private static func tableKeyboardNavigationRespectsTextBoundaries() throws {\n    let cell = TableCell(rowID: UUID(), columnID: UUID())\n    var focus = TableFocus()\n    var navigation: (Int, Bool)?\n    let parent = TableCellField(\n      text: .constant(\"abc\"), cell: cell,\n      focus: Binding(get: { focus }, set: { focus = $0 }),\n      isHeader: false, editable: true, columnCount: 3,\n      onNavigate: { direction, append in\n        navigation = (direction, append)\n        return true\n      })\n    let coordinator = TableCellField.Coordinator(parent)\n    let field = NSTextField()\n    let text = NSTextView(usingTextLayoutManager: true)\n    text.string = \"abc\"\n    text.setSelectedRange(NSRange(location: 1, length: 0))\n    try expect(\n      !coordinator.control(field, textView: text, doCommandBy: #selector(NSResponder.moveUp(_:)))\n        && navigation == nil, \"Arrow keys inside text must remain native cursor movement\")\n    text.setSelectedRange(NSRange(location: 0, length: 0))\n    try expect(\n      coordinator.control(field, textView: text, doCommandBy: #selector(NSResponder.moveUp(_:)))\n        && navigation?.0 == -3 && navigation?.1 == false,\n      \"Up at the start of a cell moves one row without adding rows\")\n    text.setSelectedRange(NSRange(location: 3, length: 0))\n    try expect(\n      coordinator.control(field, textView: text, doCommandBy: #selector(NSResponder.moveDown(_:)))\n        && navigation?.0 == 3 && navigation?.1 == false, \"Down at the end of a cell moves one row\")\n    try expect(\n      coordinator.control(field, textView: text, doCommandBy: #selector(NSResponder.insertTab(_:)))\n        && navigation?.0 == 1 && navigation?.1 == true, \"Only forward Tab can append a final row\")\n    coordinator.controlTextDidBeginEditing(\n      Notification(name: NSControl.textDidBeginEditingNotification, object: field))\n    coordinator.controlTextDidEndEditing(\n      Notification(name: NSControl.textDidEndEditingNotification, object: field))\n    try expect(\n      focus.cell == cell && !focus.isEditing,\n      \"Leaving a field preserves the selected cell for table menus\")\n  }\n\n  @MainActor\n  private static func selectedBlockShortcutsRespectTextFocus() throws {\n    let model = try model(text: NSAttributedString(string: \"正文\"))\n    let table = DocumentBlock(table: TableContent(rows: [[\"保留输入\"]]))\n    model.insertBlock(table)\n    try expect(\n      !model.handleSelectedBlockKey(51, textInputFocused: true)\n        && model.selectedBlock?.id == table.id, \"Delete while typing must never delete a block\")\n    try expect(\n      model.handleSelectedBlockKey(53, textInputFocused: false) && model.selectedBlock == nil,\n      \"Escape clears whole-block selection\")\n    model.selectBlock(table.id)\n    try expect(\n      model.handleSelectedBlockKey(36, textInputFocused: false)\n        && model.selectedBlock?.kind == .text && model.selectedBlock?.text.string.isEmpty == true,\n      \"Enter after a selected block creates an editable paragraph\")\n    model.selectBlock(table.id)\n    try expect(\n      model.handleSelectedBlockKey(117, textInputFocused: false)\n        && !model.currentArticle!.blocks.contains(where: { $0.id == table.id }),\n      \"Forward Delete removes only the selected non-text block\")\n  }\n\n  @MainActor\n  private static func imagePastePreservesRichText() throws {\n    let pasteboard = NSPasteboard(name: .init(\"redraft.image-tests.\\(UUID())\"))\n    defer { pasteboard.releaseGlobally() }\n    pasteboard.setData(try pngData(), forType: .png)\n    try expect(\n      ImageTransfer.imageOnlyPayload(from: pasteboard) != nil,\n      \"An image-only clipboard exposes an image payload\")\n    pasteboard.setString(\"ordinary text\", forType: .string)\n    try expect(\n      ImageTransfer.imageOnlyPayload(from: pasteboard) == nil,\n      \"Text mixed with an image must use native rich-text paste\")\n    pasteboard.clearContents()\n    pasteboard.setData(try pngData(), forType: .png)\n    pasteboard.setData(Data(\"rtf\".utf8), forType: .rtf)\n    try expect(\n      ImageTransfer.imageOnlyPayload(from: pasteboard) == nil,\n      \"Formatted clipboard content must not be intercepted\")\n  }\n\n  @MainActor\n  private static func imageImportsKeepTheirOriginalTarget() async throws {\n    let data = try pngData()\n    let model = try model(text: NSAttributedString(string: \"first\"))\n    let originalArticleID = model.currentArticle!.id\n    let anchorID = model.selectedBlock!.id\n    let target = model.imageImportTarget(after: anchorID)!\n    let second = DocumentBlock(text: RichTextContent(string: \"second\"))\n    model.insertBlock(second)\n    model.importImageData(data, target: target)\n    try expect(\n      model.currentArticle!.blocks[1].kind == .image\n        && model.currentArticle!.blocks[2].id == second.id,\n      \"Image completion uses the original anchor, even after selection changes\")\n    let count = model.currentArticle!.blocks.count\n    model.importImageData(Data(repeating: 0, count: ImageTransfer.maximumBytes + 1), target: target)\n    try expect(\n      model.currentArticle!.blocks.count == count && model.state.notice == \"图片不能超过 20 MB\",\n      \"All image entry points share the size limit\")\n    model.importImageData(Data(\"not an image\".utf8), target: target)\n    try expect(\n      model.currentArticle!.blocks.count == count && model.state.notice == \"无法读取这张图片\",\n      \"Invalid image bytes do not enter the document\")\n\n    let provider = NSItemProvider(item: data as NSData, typeIdentifier: UTType.png.identifier)\n    try expect(\n      model.receiveImageDrop([provider], after: anchorID), \"Image providers are accepted for drop\")\n    model.newArticle()\n    model.importImageData(data, target: target)\n    try await Task.sleep(for: .milliseconds(200))\n    try expect(\n      model.currentArticle!.blocks.allSatisfy { $0.kind == .text }\n        && model.articles.first(where: { $0.id == originalArticleID })!.blocks.count == count,\n      \"An asynchronous drop cannot cross an article switch\")\n    model.selectArticle(originalArticleID)\n    model.deleteBlock(anchorID)\n    let remaining = model.currentArticle!.blocks.count\n    model.importImageData(data, target: target)\n    try expect(\n      model.currentArticle!.blocks.count == remaining,\n      \"A deleted insertion anchor cancels a pending image import\")\n  }\n\n  @MainActor\n  private static func pngData() throws -> Data {\n    let bitmap = NSBitmapImageRep(\n      bitmapDataPlanes: nil, pixelsWide: 2, pixelsHigh: 2, bitsPerSample: 8, samplesPerPixel: 4,\n      hasAlpha: true, isPlanar: false, colorSpaceName: .deviceRGB, bytesPerRow: 0, bitsPerPixel: 0)!\n    return bitmap.representation(using: .png, properties: [:])!\n  }\n\n  private static func expect(_ condition: @autoclosure () -> Bool, _ message: String) throws {\n    if !condition() { throw Failure(message: message) }\n  }\n\n  private struct Failure: Error { let message: String }\n}\n", "Tests/NativeUISnapshots.swift": "import AppKit\nimport SwiftUI\n\n/// Renders the real native views in a disposable test window; never reads the user's desktop.\n@main\nstruct NativeUISnapshots {\n  @MainActor\n  static func main() throws {\n    let application = NSApplication.shared\n    application.setActivationPolicy(.prohibited)\n    let output = URL(\n      fileURLWithPath: CommandLine.arguments.dropFirst().first ?? \".build/ui-snapshots\")\n    try FileManager.default.createDirectory(at: output, withIntermediateDirectories: true)\n    let model = try TestSupport.demoModel()\n    let host = NSHostingView(\n      rootView: WorkspaceView(model: model)\n        .environment(\\.documentImageResolver, DemoImageResolver()))\n    host.sizingOptions = []\n    host.autoresizingMask = [.width, .height]\n    let window = NSWindow(\n      contentRect: NSRect(x: -8000, y: -8000, width: 1220, height: 820),\n      styleMask: [.titled, .closable, .resizable], backing: .buffered, defer: false)\n    window.isReleasedWhenClosed = false\n    window.contentView = host\n    window.orderFront(nil)\n\n    func settle() {\n      for _ in 0..\u003c12 {\n        host.layoutSubtreeIfNeeded()\n        RunLoop.current.run(until: Date().addingTimeInterval(0.03))\n      }\n    }\n\n    func capture(_ name: String, width: CGFloat = 1220, dark: Bool = false) throws {\n      application.appearance = NSAppearance(named: dark ? .darkAqua : .aqua)\n      window.appearance = application.appearance\n      window.setContentSize(NSSize(width: width, height: 820))\n      host.setFrameSize(NSSize(width: width, height: 820))\n      settle()\n      guard let bitmap = host.bitmapImageRepForCachingDisplay(in: host.bounds) else {\n        fatalError(\"Cannot allocate snapshot for \\(name)\")\n      }\n      host.cacheDisplay(in: host.bounds, to: bitmap)\n      guard let data = bitmap.representation(using: .png, properties: [:]) else {\n        fatalError(\"Cannot encode snapshot for \\(name)\")\n      }\n      try data.write(to: output.appendingPathComponent(\"\\(name).png\"))\n      print(\"Rendered \\(name): \\(Int(host.bounds.width)) × \\(Int(host.bounds.height))\")\n    }\n\n    try capture(\"writing-light\")\n    let textViews = descendants(of: host).compactMap { $0 as? BlockTextView }\n    precondition(!textViews.isEmpty, \"Writing must use native TextKit text views\")\n    precondition(\n      textViews.allSatisfy { $0.textLayoutManager != nil }, \"TextKit 2 must remain active\")\n    precondition(textViews.allSatisfy { $0.bounds.width > 100 && $0.bounds.height >= 30 })\n    let materials = descendants(of: host).compactMap { $0 as? NSVisualEffectView }\n    precondition(!materials.isEmpty, \"Chrome must contain native materials\")\n    precondition(materials.allSatisfy { $0.state == .followsWindowActiveState })\n\n    model.selectBlock(model.currentArticle?.blocks.first(where: { $0.kind == .table })?.id)\n    try capture(\"writing-table-light\")\n\n    model.state.inspectorVisible = true\n    model.selectBlock(model.currentArticle?.blocks.first?.id)\n    try capture(\"writing-inspector-light\")\n    try capture(\"writing-dark\", dark: true)\n\n    if let diary = model.articles.first(where: { $0.title == \"写日记的第一百天\" }) {\n      model.selectArticle(diary.id)\n      model.state.inspectorVisible = false\n      try capture(\"diary-light\")\n    }\n\n    guard let pending = model.articles.first(where: { $0.phase == .ready }) else {\n      fatalError(\"Expected a review fixture\")\n    }\n    model.selectArticle(pending.id)\n    model.enterReview()\n    try capture(\"review-light\")\n    model.state.inspectorVisible = false\n    model.state.sidebarVisible = false\n    model.state.diffLayout = .sideBySide\n    try capture(\"review-compact\", width: 780)\n\n    model.state.sidebarVisible = true\n    model.state.inspectorVisible = true\n    model.setMode(.history)\n    try capture(\"history-dark\", dark: true)\n    model.showExamples()\n    try capture(\"examples-light\")\n\n    model.newArticle()\n    model.state.sidebarVisible = false\n    model.state.inspectorVisible = false\n    try capture(\"new-article-compact\", width: 780)\n    window.close()\n    print(\"Native rendering checks passed\")\n  }\n\n  @MainActor\n  private static func descendants(of view: NSView) -> [NSView] {\n    view.subviews.flatMap { [$0] + descendants(of: $0) }\n  }\n}\n", "App/Editor/WritingKeyboardNavigation.swift": "import AppKit\nimport RedraftCore\nimport SwiftUI\n\n/// Block shortcuts only run after the user leaves a native text input.\nstruct WritingKeyboardNavigation: NSViewRepresentable {\n  let model: WorkspaceViewModel\n\n  func makeCoordinator() -> Coordinator { Coordinator(model: model) }\n\n  func makeNSView(context: Context) -> NSView {\n    let view = NSView()\n    context.coordinator.install(in: view)\n    return view\n  }\n\n  func updateNSView(_ nsView: NSView, context: Context) { context.coordinator.model = model }\n\n  static func dismantleNSView(_ nsView: NSView, coordinator: Coordinator) {\n    coordinator.removeMonitor()\n  }\n\n  @MainActor\n  final class Coordinator {\n    var model: WorkspaceViewModel\n    private weak var view: NSView?\n    private var monitor: Any?\n\n    init(model: WorkspaceViewModel) { self.model = model }\n\n    func install(in view: NSView) {\n      self.view = view\n      monitor = NSEvent.addLocalMonitorForEvents(matching: .keyDown) { [weak self] event in\n        let handled = MainActor.assumeIsolated {\n          guard let self, let window = self.view?.window, window.isKeyWindow,\n            event.window === window, window.attachedSheet == nil,\n            event.modifierFlags.intersection([.command, .control, .option, .shift]).isEmpty\n          else { return false }\n          let editing = window.firstResponder is NSTextView || window.firstResponder is NSTextField\n          return self.model.handleSelectedBlockKey(event.keyCode, textInputFocused: editing)\n        }\n        return handled ? nil : event\n      }\n    }\n\n    func removeMonitor() {\n      if let monitor { NSEvent.removeMonitor(monitor) }\n      monitor = nil\n    }\n  }\n}\n\nextension WorkspaceViewModel {\n  func handleSelectedBlockKey(_ keyCode: UInt16, textInputFocused: Bool) -> Bool {\n    guard !textInputFocused, !isEditorLocked, state.sheet == nil,\n      let block = selectedBlock, block.kind != .text\n    else { return false }\n    switch keyCode {\n    case 51, 117:\n      deleteBlock(block.id)\n    case 53:\n      selectBlock(nil)\n    case 36, 76:\n      insertBlock(DocumentBlock())\n    default:\n      return false\n    }\n    return true\n  }\n}\n", "App/Platform/RichTextBridge.swift": "import AppKit\nimport RedraftCore\n\nextension NSAttributedString.Key {\n  /// Paragraph semantics survive native editing without inferring meaning from font size.\n  static let redraftHeadingLevel = NSAttributedString.Key(\"dev.redraft.headingLevel\")\n}\n\n/// AppKit is a rendering/input representation. Only Core values cross the document boundary.\n@MainActor\nenum RichTextBridge {\n  static func attributedString(from content: RichTextContent) -> NSAttributedString {\n    let result = NSMutableAttributedString(\n      string: content.string,\n      attributes: attributes(style: content.defaultStyle, paragraph: content.paragraphStyle))\n    for run in content.runs\n    where run.range.location >= 0 && run.range.length >= 0\n      && run.range.location \u003c= result.length\n      && run.range.length \u003c= result.length - run.range.location\n    {\n      result.setAttributes(\n        attributes(style: run.style, paragraph: run.paragraphStyle), range: run.range)\n    }\n    return result\n  }\n\n  static func content(from value: NSAttributedString) -> RichTextContent {\n    var runs: [RichTextRun] = []\n    value.enumerateAttributes(in: NSRange(location: 0, length: value.length)) {\n      attributes, range, _ in\n      runs.append(\n        RichTextRun(\n          range: range, style: textStyle(from: attributes),\n          paragraphStyle: paragraphStyle(from: attributes)))\n    }\n    return RichTextContent(\n      string: value.string, runs: runs,\n      defaultStyle: runs.first?.style ?? TextStyle(),\n      paragraphStyle: runs.first?.paragraphStyle ?? ParagraphStyle()\n    ).normalized()\n  }\n\n  static func attributes(style: TextStyle, paragraph: ParagraphStyle) -> [NSAttributedString.Key:\n    Any]\n  {\n    let size = style.fontSize ?? defaultSize(for: paragraph.kind)\n    let base =\n      style.fontFamily.flatMap { NSFont(name: $0, size: size) }\n      ?? NSFont.systemFont(ofSize: size)\n    var traits: NSFontTraitMask = []\n    if style.bold { traits.insert(.boldFontMask) }\n    if style.italic { traits.insert(.italicFontMask) }\n    let font = NSFontManager.shared.convert(base, toHaveTrait: traits)\n    let nativeParagraph = NSMutableParagraphStyle()\n    nativeParagraph.alignment = nativeAlignment(paragraph.alignment)\n    nativeParagraph.headIndent = paragraph.headIndent\n    nativeParagraph.firstLineHeadIndent = paragraph.firstLineHeadIndent\n    nativeParagraph.tailIndent = paragraph.tailIndent\n    nativeParagraph.lineSpacing = paragraph.lineSpacing\n    nativeParagraph.lineHeightMultiple = paragraph.lineHeightMultiple\n    nativeParagraph.paragraphSpacing = paragraph.paragraphSpacing\n    nativeParagraph.paragraphSpacingBefore = paragraph.paragraphSpacingBefore\n    if let list = paragraph.list {\n      let nativeList = NSTextList(\n        markerFormat: list.marker == .decimal ? .decimal : .disc, options: 0)\n      nativeList.startingItemNumber = list.startingItemNumber\n      nativeParagraph.textLists = [nativeList]\n    }\n    var result: [NSAttributedString.Key: Any] = [\n      .font: font, .foregroundColor: color(style.foreground), .paragraphStyle: nativeParagraph,\n      .redraftHeadingLevel: headingLevel(paragraph.kind),\n    ]\n    if style.underline { result[.underlineStyle] = NSUnderlineStyle.single.rawValue }\n    if style.strikethrough { result[.strikethroughStyle] = NSUnderlineStyle.single.rawValue }\n    if let background = style.background { result[.backgroundColor] = color(background) }\n    return result\n  }\n\n  static func textStyle(from attributes: [NSAttributedString.Key: Any]) -> TextStyle {\n    let paragraph = paragraphStyle(from: attributes)\n    let font = attributes[.font] as? NSFont ?? .systemFont(ofSize: defaultSize(for: paragraph.kind))\n    let traits = NSFontManager.shared.traits(of: font)\n    let systemFamily = NSFont.systemFont(ofSize: font.pointSize).familyName\n    return TextStyle(\n      fontFamily: font.familyName == systemFamily ? nil : font.familyName,\n      fontSize: font.pointSize == defaultSize(for: paragraph.kind) ? nil : font.pointSize,\n      bold: traits.contains(.boldFontMask), italic: traits.contains(.italicFontMask),\n      underline: (attributes[.underlineStyle] as? Int ?? 0) != 0,\n      strikethrough: (attributes[.strikethroughStyle] as? Int ?? 0) != 0,\n      foreground: semanticColor(attributes[.foregroundColor] as? NSColor ?? PaperTheme.textColor),\n      background: (attributes[.backgroundColor] as? NSColor).map(semanticColor))\n  }\n\n  static func paragraphStyle(from attributes: [NSAttributedString.Key: Any]) -> ParagraphStyle {\n    let native = attributes[.paragraphStyle] as? NSParagraphStyle ?? NSParagraphStyle()\n    let level = attributes[.redraftHeadingLevel] as? Int ?? 0\n    let list = native.textLists.first.map {\n      ListStyle(\n        marker: $0.markerFormat == .decimal ? .decimal : .bullet,\n        startingItemNumber: $0.startingItemNumber)\n    }\n    return ParagraphStyle(\n      kind: level > 0 ? .heading(level: level) : .body,\n      alignment: semanticAlignment(native.alignment), headIndent: native.headIndent,\n      firstLineHeadIndent: native.firstLineHeadIndent, tailIndent: native.tailIndent,\n      lineSpacing: native.lineSpacing, paragraphSpacing: native.paragraphSpacing,\n      paragraphSpacingBefore: native.paragraphSpacingBefore,\n      lineHeightMultiple: native.lineHeightMultiple,\n      list: list)\n  }\n\n  static func headingLevel(_ kind: ParagraphKind) -> Int {\n    if case .heading(let level) = kind { return level }\n    return 0\n  }\n\n  static func defaultSize(for kind: ParagraphKind) -> Double {\n    switch kind {\n    case .body: 17\n    case .heading(let level): [28.0, 23.0, 19.0][min(2, max(0, level - 1))]\n    }\n  }\n\n  private static func color(_ value: TextColor) -> NSColor {\n    switch value {\n    case .primary: PaperTheme.textColor\n    case .secondary: .secondaryLabelColor\n    case .accent: .controlAccentColor\n    case .highlight: .systemYellow\n    case .rgba(let red, let green, let blue, let alpha):\n      NSColor(srgbRed: red, green: green, blue: blue, alpha: alpha)\n    }\n  }\n\n  private static func semanticColor(_ value: NSColor) -> TextColor {\n    if value.isEqual(PaperTheme.textColor) || value.isEqual(NSColor.labelColor) { return .primary }\n    if value.isEqual(NSColor.secondaryLabelColor) { return .secondary }\n    if value.isEqual(NSColor.controlAccentColor) { return .accent }\n    if value.isEqual(NSColor.systemYellow) { return .highlight }\n    guard let rgb = value.usingColorSpace(.sRGB) else { return .primary }\n    return .rgba(rgb.redComponent, rgb.greenComponent, rgb.blueComponent, rgb.alphaComponent)\n  }\n\n  private static func nativeAlignment(_ value: TextAlignment) -> NSTextAlignment {\n    switch value {\n    case .natural: .natural\n    case .left: .left\n    case .center: .center\n    case .right: .right\n    case .justified: .justified\n    }\n  }\n\n  private static func semanticAlignment(_ value: NSTextAlignment) -> TextAlignment {\n    switch value {\n    case .left: .left\n    case .center: .center\n    case .right: .right\n    case .justified: .justified\n    default: .natural\n    }\n  }\n}\n", "App/Platform/EditorSession.swift": "import AppKit\nimport Combine\nimport RedraftCore\n\n/// One window's transient native input session; never an owner of document content.\n@MainActor\nfinal class EditorSession: ObservableObject {\n  private weak var current: BlockTextView?\n  private var selectedBlockID: UUID?\n  private var selectedRange: NSRange?\n  private var style: EditorSelectionStyle?\n\n  func activate(_ editor: BlockTextView) {\n    current = editor\n    refresh(from: editor)\n  }\n\n  func refresh(from editor: BlockTextView) {\n    guard current === editor else { return }\n    let next = EditorSelectionStyle(\n      text: editor.attributedString(), range: editor.selectedRange(),\n      typing: editor.typingAttributes)\n    guard\n      selectedBlockID != editor.blockID || selectedRange != editor.selectedRange()\n        || style?.isEqual(to: next) != true\n    else { return }\n    objectWillChange.send()\n    selectedBlockID = editor.blockID\n    selectedRange = editor.selectedRange()\n    style = next\n  }\n\n  func selectionStyle(blockID: UUID, range: NSRange) -> EditorSelectionStyle? {\n    guard selectedBlockID == blockID, selectedRange == range else { return nil }\n    return style\n  }\n\n  func detach(_ editor: BlockTextView) {\n    if current === editor { clear() }\n  }\n\n  func clear() {\n    guard current != nil || style != nil else { return }\n    objectWillChange.send()\n    current = nil\n    selectedBlockID = nil\n    selectedRange = nil\n    style = nil\n  }\n\n  fileprivate func nativeEditor(for blockID: UUID) -> BlockTextView? {\n    guard let current, current.blockID == blockID, current.window != nil else { return nil }\n    return current\n  }\n}\n\nextension EditorSession {\n  func format(\n    _ command: EditorFormat, block: DocumentBlock, range selectedRange: NSRange,\n    onCommit: (NSAttributedString) -> Void\n  ) {\n    let native = nativeEditor(for: block.id)\n    guard native?.hasMarkedText() != true else { return }\n    let source = native?.attributedString() ?? RichTextBridge.attributedString(from: block.text)\n    let originalRange = native?.selectedRange() ?? selectedRange\n    let location = min(originalRange.location, source.length)\n    var range = NSRange(\n      location: location, length: min(originalRange.length, source.length - location))\n    let result = NSMutableAttributedString(attributedString: source)\n    var typing = native?.typingAttributes ?? EditorTypography.bodyAttributes\n    let attributes =\n      range.length == 0 && native != nil\n      ? typing\n      : source.length > 0\n        ? source.attributes(at: min(location, source.length - 1), effectiveRange: nil) : typing\n    let font = attributes[.font] as? NSFont ?? .systemFont(ofSize: 17)\n    let selectionStyle = EditorSelectionStyle(text: source, range: range, typing: typing)\n\n    func set(_ key: NSAttributedString.Key, _ value: Any?) {\n      if let value {\n        if range.length > 0 { result.addAttribute(key, value: value, range: range) }\n        typing[key] = value\n      } else {\n        if range.length > 0 { result.removeAttribute(key, range: range) }\n        typing.removeValue(forKey: key)\n      }\n    }\n\n    func paragraph(_ change: (NSMutableParagraphStyle) -> Void) {\n      range = (source.string as NSString).paragraphRange(for: range)\n      if range.length > 0 {\n        source.enumerateAttribute(.paragraphStyle, in: range) { value, run, _ in\n          let style =\n            (value as? NSParagraphStyle)?.mutableCopy() as? NSMutableParagraphStyle\n            ?? NSMutableParagraphStyle()\n          change(style)\n          result.addAttribute(.paragraphStyle, value: style, range: run)\n        }\n      }\n      let style =\n        (typing[.paragraphStyle] as? NSParagraphStyle)?.mutableCopy() as? NSMutableParagraphStyle\n        ?? NSMutableParagraphStyle()\n      change(style)\n      typing[.paragraphStyle] = style\n    }\n\n    func transformFonts(_ change: (NSFont) -> NSFont) {\n      if range.length > 0 {\n        source.enumerateAttribute(.font, in: range) { value, run, _ in\n          result.addAttribute(\n            .font, value: change(value as? NSFont ?? .systemFont(ofSize: 17)), range: run)\n        }\n      }\n      typing[.font] = change(font)\n    }\n\n    switch command {\n    case .bold, .italic:\n      let trait: NSFontTraitMask =\n        if case .bold = command { .boldFontMask } else { .italicFontMask }\n      let removing = selectionStyle.state(for: command) == .on\n      transformFonts { current in\n        removing\n          ? NSFontManager.shared.convert(current, toNotHaveTrait: trait)\n          : NSFontManager.shared.convert(current, toHaveTrait: trait)\n      }\n    case .underline:\n      set(\n        .underlineStyle,\n        selectionStyle.state(for: command) == .on ? nil : NSUnderlineStyle.single.rawValue)\n    case .strikethrough:\n      set(\n        .strikethroughStyle,\n        selectionStyle.state(for: command) == .on ? nil : NSUnderlineStyle.single.rawValue\n      )\n    case .font(let name):\n      transformFonts { current in\n        let base =\n          name == \"系统\"\n          ? NSFont.systemFont(ofSize: current.pointSize)\n          : NSFont(name: name, size: current.pointSize)\n            ?? NSFont.systemFont(ofSize: current.pointSize)\n        return NSFontManager.shared.convert(\n          base,\n          toHaveTrait: NSFontManager.shared.traits(of: current).intersection([\n            .boldFontMask, .italicFontMask,\n          ]))\n      }\n    case .size(let size): transformFonts { NSFontManager.shared.convert($0, toSize: size) }\n    case .color(let color): set(.foregroundColor, color)\n    case .highlight(let color): set(.backgroundColor, color)\n    case .alignment(let alignment): paragraph { $0.alignment = alignment }\n    case .spacing(let spacing): paragraph { $0.lineHeightMultiple = spacing }\n    case .indent(let direction):\n      paragraph { style in\n        style.headIndent = min(144, max(0, style.headIndent + CGFloat(direction * 24)))\n        style.firstLineHeadIndent = style.headIndent\n      }\n    case .heading(let level):\n      paragraph { $0.paragraphSpacing = level == 0 ? 7 : 10 }\n      set(.redraftHeadingLevel, min(3, max(0, level)))\n      let sizes: [CGFloat] = [17, 28, 23, 19]\n      set(\n        .font,\n        NSFont.systemFont(\n          ofSize: sizes[min(3, max(0, level))], weight: level == 0 ? .regular : .semibold))\n    case .list(let numbered):\n      let removing = selectionStyle.state(for: command) == .on\n      paragraph { style in\n        style.textLists =\n          removing ? [] : [NSTextList(markerFormat: numbered ? .decimal : .disc, options: 0)]\n        style.headIndent = style.textLists.isEmpty ? 0 : 24\n        style.firstLineHeadIndent = 0\n      }\n    case .quote:\n      paragraph { style in\n        style.headIndent = 24\n        style.firstLineHeadIndent = 24\n      }\n      set(.foregroundColor, NSColor.secondaryLabelColor)\n    case .clear:\n      if range.length > 0 {\n        source.enumerateAttributes(in: range) { value, run, _ in\n          var clean = EditorTypography.bodyAttributes\n          clean[.paragraphStyle] = value[.paragraphStyle]\n          clean[.redraftHeadingLevel] = value[.redraftHeadingLevel]\n          result.setAttributes(clean, range: run)\n        }\n      }\n      let paragraphStyle = typing[.paragraphStyle]\n      let heading = typing[.redraftHeadingLevel]\n      typing = EditorTypography.bodyAttributes\n      typing[.paragraphStyle] = paragraphStyle\n      typing[.redraftHeadingLevel] = heading\n    }\n\n    if let native {\n      native.window?.makeFirstResponder(native)\n      native.applyFormatting(\n        result,\n        selection: NSRange(\n          location: location, length: min(originalRange.length, result.length - location)),\n        typing: typing)\n      refresh(from: native)\n    } else {\n      onCommit(result)\n    }\n  }\n}\n", "App/Models/WorkspaceState.swift": "import Foundation\n\nenum WorkspaceSection: String, CaseIterable { case articles, examples }\nenum WorkspaceMode: String, CaseIterable { case writing, review, history }\nenum InspectorTab: String, CaseIterable { case marks, provenance }\nenum DiffLayout: String, CaseIterable { case inline, sideBySide }\nenum ArticlePhase: String { case idle, running, ready }\nenum ExampleFilter: String, CaseIterable {\n  case all, accept, keep, rewrite\n  var title: String {\n    switch self {\n    case .all: \"全部取舍\"\n    case .accept: \"采用\"\n    case .keep: \"保留原文\"\n    case .rewrite: \"自己改写\"\n    }\n  }\n}\nenum WorkspaceSheet: String, Identifiable {\n  case customMark, rewrite, shortcuts, statistics, about, insertTable, imageDescription\n  var id: String { rawValue }\n}\n\n/// Window-local state only. Documents, revisions and review tasks belong to ArticleSession.\nstruct WorkspaceState {\n  var selectedArticleID: UUID? = nil\n  var section: WorkspaceSection = .articles\n  var mode: WorkspaceMode = .writing\n  var sidebarVisible: Bool = true\n  var inspectorVisible: Bool = false\n  var inspectorTab: InspectorTab = .marks\n  var articleQuery: String = \"\"\n  var exampleQuery: String = \"\"\n  var exampleFilter: ExampleFilter = .all\n  var selectedBlockID: UUID? = nil\n  var selectedRange: NSRange = NSRange(location: 0, length: 0)\n  var selectedChangeID: UUID? = nil\n  var historyFromID: UUID? = nil\n  var historyToID: UUID? = nil\n  var onlyChanges: Bool = false\n  var diffLayout: DiffLayout = .inline\n  var sheet: WorkspaceSheet? = nil\n  var notice: String? = nil\n  var dismissedReviewError: String? = nil\n  var customInstruction: String = \"\"\n  var rewriteText: String = \"\"\n  var rewriteReason: String = \"\"\n  var imageDescription: String = \"\"\n  var tableRows: Int = 3\n  var tableColumns: Int = 3\n}\n", "App/Models/WorkspaceStore.swift": "import Combine\nimport Foundation\nimport RedraftCore\n\n/// Owns the article collection, not copies of the sessions' current documents.\n/// Multiple windows can share this store while keeping independent WorkspaceState values.\n@MainActor\nfinal class WorkspaceStore: ObservableObject {\n  @Published private(set) var sessions: [ArticleSession] = []\n  @Published private(set) var examples: [RewriteExample] = []\n  /// Unlike objectWillChange, this signal always sees the committed collection/session values.\n  let changes = PassthroughSubject\u003cVoid, Never>()\n  private var observations: [UUID: UUID] = [:]\n\n  init() {}\n\n  convenience init(seed: WorkspaceSeed) throws {\n    self.init()\n    var ids = Set\u003cUUID>()\n    for item in seed.articles {\n      guard ids.insert(item.document.id).inserted else {\n        throw WorkspaceStoreError.duplicateArticle\n      }\n      let session = try ArticleSession(\n        document: item.document, versions: item.versions,\n        review: item.review.map(ReviewState.ready) ?? .idle)\n      attach(session)\n      sessions.append(session)\n    }\n    examples = seed.examples.filter { ids.contains($0.articleID) }\n  }\n\n  func session(for id: UUID?) -> ArticleSession? {\n    sessions.first { $0.document.id == id }\n  }\n\n  func insert(_ document: Article) throws {\n    guard session(for: document.id) == nil else { throw WorkspaceStoreError.duplicateArticle }\n    let session = try ArticleSession(document: document)\n    attach(session)\n    sessions.insert(session, at: 0)\n    changes.send()\n  }\n\n  func delete(_ id: UUID) {\n    guard let session = session(for: id) else { return }\n    if let token = observations.removeValue(forKey: id) { session.removeObserver(token) }\n    session.cancelReview()\n    sessions.removeAll { $0.document.id == id }\n    examples.removeAll { $0.articleID == id }\n    changes.send()\n  }\n\n  func finishPreviewReview(articleID: UUID) throws {\n    guard let session = session(for: articleID) else { return }\n    examples.append(contentsOf: try session.finishPreviewReview())\n    changes.send()\n  }\n\n  private func attach(_ session: ArticleSession) {\n    observations[session.document.id] = session.observe { [weak self] in\n      self?.objectWillChange.send()\n      self?.changes.send()\n    }\n  }\n}\n\nenum WorkspaceStoreError: Error { case duplicateArticle }\n", "App/Models/ArticleViewState.swift": "import Foundation\nimport RedraftCore\n\n/// A read-only projection, computed from a session; never a second writable document.\nstruct ArticleViewState: Identifiable {\n  let document: Article\n  let versions: [ArticleVersion]\n  let review: ReviewState\n\n  var id: UUID { document.id }\n  var title: String { document.title }\n  var updatedAt: Date { document.updatedAt }\n  var blocks: [DocumentBlock] { document.blocks }\n  var marks: [UUID: String] { document.marks }\n  var changes: [ReviewChange] { review.changes }\n  var characterCount: Int { blocks.reduce(0) { $0 + $1.plainText.count } }\n  var preview: String { blocks.first(where: { $0.kind == .text })?.plainText ?? \"空白文章\" }\n  var phase: ArticlePhase {\n    switch review {\n    case .idle, .failed: .idle\n    case .running: .running\n    case .ready: .ready\n    }\n  }\n\n  @MainActor\n  init(session: ArticleSession) {\n    document = session.document\n    versions = session.versions\n    review = session.review\n  }\n}\n\nextension ReviewDecision {\n  var title: String {\n    switch self {\n    case .accept: \"采用\"\n    case .keep: \"保留原文\"\n    case .rewrite: \"自己改写\"\n    }\n  }\n}\n", "App/Models/WorkspaceContentSource.swift": "import Foundation\nimport RedraftCore\n\n/// Composition-time data. The application chooses an empty, demo or restored source explicitly.\n@MainActor\nprotocol WorkspaceContentSource {\n  func load() -> WorkspaceSeed\n}\n\nstruct WorkspaceSeed {\n  var articles: [ArticleSeed] = []\n  var examples: [RewriteExample] = []\n}\n\nstruct ArticleSeed {\n  var document: Article\n  var versions: [ArticleVersion] = []\n  var review: ReviewBatch? = nil\n}\n\nstruct EmptyWorkspaceContentSource: WorkspaceContentSource {\n  func load() -> WorkspaceSeed { WorkspaceSeed() }\n}\n", "App/ViewModels/WorkspaceViewModel.swift": "import Combine\nimport Foundation\nimport RedraftCore\n\n@MainActor\nfinal class WorkspaceViewModel: ObservableObject {\n  @Published var state: WorkspaceState\n  let editorSession = EditorSession()\n  private let store: WorkspaceStore\n  private let reviewProvider: any ReviewProviding\n  private var subscriptions: Set\u003cAnyCancellable> = []\n\n  init(store: WorkspaceStore, reviewProvider: any ReviewProviding) {\n    self.store = store\n    self.reviewProvider = reviewProvider\n    var state = WorkspaceState()\n    state.selectedArticleID = store.sessions.first?.document.id\n    self.state = state\n    store.changes.sink { [weak self] _ in\n      self?.reconcileState()\n      self?.objectWillChange.send()\n    }.store(in: &subscriptions)\n    editorSession.objectWillChange.sink { [weak self] _ in\n      self?.objectWillChange.send()\n    }.store(in: &subscriptions)\n    resetHistorySelection()\n  }\n\n  convenience init(source: any WorkspaceContentSource, reviewProvider: any ReviewProviding) throws {\n    try self.init(store: WorkspaceStore(seed: source.load()), reviewProvider: reviewProvider)\n  }\n\n  var articles: [ArticleViewState] { store.sessions.map(ArticleViewState.init(session:)) }\n  var examples: [RewriteExample] { store.examples }\n  private var currentSession: ArticleSession? { store.session(for: state.selectedArticleID) }\n  var currentArticle: ArticleViewState? { currentSession.map(ArticleViewState.init(session:)) }\n\n  var notice: String? {\n    if let notice = state.notice { return notice }\n    if case .failed(let message) = currentSession?.review,\n      state.dismissedReviewError != message\n    {\n      return \"改稿失败：\\(message)\"\n    }\n    return nil\n  }\n\n  var selectedBlock: DocumentBlock? {\n    currentArticle?.blocks.first { $0.id == state.selectedBlockID }\n  }\n\n  var currentChange: ReviewChange? {\n    currentArticle?.changes.first { $0.id == state.selectedChangeID }\n  }\n\n  var filteredArticles: [ArticleViewState] {\n    let query = state.articleQuery.trimmingCharacters(in: .whitespacesAndNewlines)\n    return articles.filter {\n      query.isEmpty || $0.title.localizedCaseInsensitiveContains(query)\n        || $0.blocks.contains { $0.plainText.localizedCaseInsensitiveContains(query) }\n    }\n  }\n\n  var filteredExamples: [RewriteExample] {\n    let query = state.exampleQuery.trimmingCharacters(in: .whitespacesAndNewlines)\n    return examples.filter { example in\n      let matchesDecision =\n        state.exampleFilter == .all\n        || state.exampleFilter.rawValue == example.decision.rawValue\n      let title = articles.first { $0.id == example.articleID }?.title ?? \"\"\n      return matchesDecision\n        && (query.isEmpty\n          || [example.before, example.after, example.reason, example.displayTag, title].contains {\n            $0.localizedCaseInsensitiveContains(query)\n          })\n    }\n  }\n\n  var isEditorLocked: Bool {\n    state.section != .articles || state.mode != .writing || currentArticle?.phase != .idle\n  }\n  var markedCount: Int { currentArticle?.marks.count ?? 0 }\n  var unresolvedCount: Int { currentArticle?.changes.filter { $0.decision == nil }.count ?? 0 }\n  var historyFrom: ArticleVersion? {\n    currentArticle?.versions.first { $0.id == state.historyFromID }\n  }\n  var historyTo: ArticleVersion? {\n    currentArticle?.versions.first { $0.id == state.historyToID }\n  }\n\n  func selectArticle(_ id: UUID) {\n    guard articles.contains(where: { $0.id == id }) else { return }\n    state.selectedArticleID = id\n    state.section = .articles\n    state.mode = .writing\n    clearSelection()\n    resetHistorySelection()\n  }\n\n  func newArticle() {\n    let article = Article(title: \"未命名文章\", blocks: [DocumentBlock(text: RichTextContent())])\n    do {\n      try store.insert(article)\n      state.articleQuery = \"\"\n      selectArticle(article.id)\n    } catch { report(error) }\n  }\n\n  func deleteArticle(_ id: UUID) {\n    store.delete(id)\n    if state.selectedArticleID == id {\n      state.selectedArticleID = articles.first?.id\n      state.mode = .writing\n      clearSelection()\n      resetHistorySelection()\n    }\n  }\n\n  func renameArticle(_ title: String) {\n    guard !isEditorLocked else { return }\n    mutateSelectedArticle { $0.title = title }\n  }\n\n  func setMode(_ mode: WorkspaceMode) {\n    guard currentArticle != nil else { return }\n    if mode == .review {\n      enterReview()\n      return\n    }\n    state.mode = mode\n    state.section = .articles\n    state.sheet = nil\n    if mode == .history { resetHistorySelectionIfNeeded() }\n  }\n\n  func showExamples() {\n    state.section = .examples\n    state.sheet = nil\n    state.notice = nil\n  }\n\n  func selectBlock(_ id: UUID?) {\n    guard id == nil || currentArticle?.blocks.contains(where: { $0.id == id }) == true else {\n      return\n    }\n    if state.selectedBlockID != id {\n      state.selectedBlockID = id\n      state.selectedRange = NSRange(location: 0, length: 0)\n    }\n  }\n\n  func updateSelection(blockID: UUID, range: NSRange) {\n    guard let block = currentArticle?.blocks.first(where: { $0.id == blockID }),\n      block.kind == .text,\n      isValid(range, in: block.text.string)\n    else { return }\n    state.selectedBlockID = blockID\n    state.selectedRange = range\n  }\n\n  @discardableResult\n  func updateBlockText(\n    _ id: UUID, text: NSAttributedString, expectedContent: RichTextContent? = nil,\n    articleID: UUID? = nil\n  ) -> Bool {\n    guard !isEditorLocked, let session = currentSession,\n      articleID == nil || articleID == session.document.id,\n      var block = currentArticle?.blocks.first(where: { $0.id == id }), block.kind == .text\n    else { return false }\n    if let expectedContent, block.text.normalized() != expectedContent.normalized() {\n      showNotice(\"这段内容已在其他位置更新，请基于最新内容继续编辑\")\n      return false\n    }\n    block.text = RichTextBridge.content(from: text)\n    do {\n      try session.updateDocument { article in\n        guard let index = article.blocks.firstIndex(where: { $0.id == id }) else { return }\n        article.blocks[index] = block\n      }\n    } catch {\n      report(error)\n      return false\n    }\n    if state.selectedBlockID == id && !isValid(state.selectedRange, in: text.string) {\n      state.selectedRange = NSRange(location: text.length, length: 0)\n    }\n    return true\n  }\n\n  func mutateSelectedArticle(_ mutate: (inout Article) -> Void) {\n    guard !isEditorLocked, let session = currentSession else { return }\n    do { try session.updateDocument(mutate) } catch { report(error) }\n  }\n\n  func updateBlock(_ block: DocumentBlock) {\n    mutateSelectedArticle { article in\n      guard let index = article.blocks.firstIndex(where: { $0.id == block.id }) else { return }\n      article.blocks[index] = block\n    }\n  }\n\n  func insertBlock(_ block: DocumentBlock) {\n    guard !isEditorLocked else { return }\n    let selection = state.selectedBlockID\n    mutateSelectedArticle { article in\n      let index =\n        article.blocks.firstIndex(where: { $0.id == selection }).map { $0 + 1 }\n        ?? article.blocks.endIndex\n      article.blocks.insert(block, at: index)\n    }\n    selectBlock(block.id)\n  }\n\n  func deleteBlock(_ id: UUID) {\n    guard !isEditorLocked, currentArticle?.blocks.contains(where: { $0.id == id }) == true else {\n      return\n    }\n    mutateSelectedArticle {\n      $0.blocks.removeAll { $0.id == id }\n      $0.marks.removeValue(forKey: id)\n      if $0.blocks.isEmpty { $0.blocks = [DocumentBlock(text: RichTextContent())] }\n    }\n    if state.selectedBlockID == id { selectBlock(nil) }\n  }\n\n  func markBlock(_ id: UUID, instruction: String) {\n    let value = instruction.trimmingCharacters(in: .whitespacesAndNewlines)\n    guard !value.isEmpty, currentArticle?.blocks.contains(where: { $0.id == id }) == true else {\n      return\n    }\n    mutateSelectedArticle { $0.marks[id] = value }\n  }\n\n  func unmarkBlock(_ id: UUID) {\n    mutateSelectedArticle { $0.marks.removeValue(forKey: id) }\n  }\n\n  func markSelection(instruction: String) {\n    guard let id = state.selectedBlockID else {\n      showNotice(\"先选择一个段落、图片或表格\")\n      return\n    }\n    markBlock(id, instruction: instruction)\n  }\n\n  func clearMarks() {\n    mutateSelectedArticle { $0.marks.removeAll() }\n  }\n\n  func beginReview() {\n    guard state.section == .articles, state.mode == .writing, state.sheet == nil else { return }\n    guard let session = currentSession, currentArticle?.phase == .idle,\n      !session.document.marks.isEmpty\n    else {\n      showNotice(\"先标记想修改的内容\")\n      return\n    }\n    state.selectedChangeID = nil\n    state.notice = nil\n    state.dismissedReviewError = nil\n    do { try session.beginReview(using: reviewProvider) } catch { report(error) }\n  }\n\n  func cancelReview() {\n    guard let session = currentSession, currentArticle?.phase == .running else { return }\n    session.cancelReview()\n    state.notice = \"已取消，标记保持原样\"\n  }\n\n  func enterReview() {\n    guard let article = currentArticle, article.phase == .ready, !article.changes.isEmpty else {\n      showNotice(\"先送审标记的内容，再开始审阅\")\n      return\n    }\n    state.section = .articles\n    state.mode = .review\n    state.sheet = nil\n    if let change = article.changes.first(where: { $0.decision == nil }) ?? article.changes.first {\n      selectChange(change.id)\n    }\n    state.inspectorVisible = true\n  }\n\n  func selectChange(_ id: UUID) {\n    guard state.section == .articles, state.mode == .review, state.sheet == nil,\n      currentArticle?.phase == .ready\n    else { return }\n    guard let change = currentArticle?.changes.first(where: { $0.id == id }) else { return }\n    state.selectedChangeID = id\n    state.selectedBlockID = change.blockID\n    state.selectedRange = NSRange(location: 0, length: 0)\n  }\n\n  func decide(_ decision: ReviewDecision) {\n    guard let id = state.selectedChangeID else { return }\n    decide(decision, changeID: id)\n  }\n\n  func decide(_ decision: ReviewDecision, changeID: UUID) {\n    guard canEditReview, currentArticle?.changes.contains(where: { $0.id == changeID }) == true\n    else { return }\n    selectChange(changeID)\n    if decision == .rewrite {\n      startRewrite()\n      return\n    }\n    do { try currentSession?.decide(decision, changeID: changeID) } catch { report(error) }\n  }\n\n  func startRewrite() {\n    guard state.section == .articles, state.mode == .review, state.sheet == nil,\n      currentArticle?.phase == .ready, let change = currentChange, change.kind == .text\n    else { return }\n    state.rewriteText = change.rewrittenText.isEmpty ? change.after : change.rewrittenText\n    state.rewriteReason = change.reason\n    state.sheet = .rewrite\n  }\n\n  func updateChangeReason(_ text: String, changeID: UUID) {\n    guard canEditReview else { return }\n    do { try currentSession?.updateReason(text, changeID: changeID) } catch { report(error) }\n  }\n\n  func cancelRewrite() { dismissSheet() }\n\n  func submitRewrite() {\n    guard state.sheet == .rewrite, state.section == .articles, state.mode == .review,\n      currentArticle?.phase == .ready, let change = currentChange, change.kind == .text,\n      !state.rewriteText.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty\n    else { return }\n    do {\n      try currentSession?.rewrite(\n        changeID: change.id, text: state.rewriteText, reason: state.rewriteReason)\n      dismissSheet()\n    } catch { report(error) }\n  }\n\n  func completeReview() {\n    guard canEditReview, let article = currentArticle, !article.changes.isEmpty else { return }\n    guard unresolvedCount == 0 else {\n      showNotice(\"还有 \\(unresolvedCount) 处修改等待取舍\")\n      return\n    }\n    do {\n      try store.finishPreviewReview(articleID: article.id)\n      state.mode = .writing\n      state.selectedChangeID = nil\n      state.sheet = nil\n      showNotice(\"已完成本轮预览，正文保持原样\")\n    } catch { report(error) }\n  }\n\n  func selectExample(_ id: UUID) {\n    guard let example = examples.first(where: { $0.id == id }),\n      articles.contains(where: { $0.id == example.articleID })\n    else { return }\n    selectArticle(example.articleID)\n    let identifiedSource = currentArticle?.blocks.first { $0.id == example.blockID }\n    let source =\n      identifiedSource\n      ?? currentArticle?.blocks.first { block in\n        (!example.before.isEmpty && block.plainText.contains(example.before))\n          || (!example.after.isEmpty && block.plainText.contains(example.after))\n      }\n    selectBlock(source?.id)\n    state.inspectorTab = .provenance\n    state.inspectorVisible = true\n  }\n\n  func showProvenance() {\n    state.inspectorTab = .provenance\n    state.inspectorVisible = true\n  }\n\n  func savePreviewVersion() {\n    guard state.section == .articles, state.sheet == nil,\n      let session = currentSession, currentArticle?.phase == .idle\n    else { return }\n    _ = session.saveVersion(title: \"手动快照 \\(session.versions.count + 1)\")\n    resetHistorySelection()\n    showNotice(\"已添加本次预览快照\")\n  }\n\n  func saveVersion() { savePreviewVersion() }\n\n  func swapHistoryVersions() {\n    let from = state.historyFromID\n    state.historyFromID = state.historyToID\n    state.historyToID = from\n  }\n\n  func showSheet(_ sheet: WorkspaceSheet) {\n    switch sheet {\n    case .customMark:\n      guard !isEditorLocked else { return }\n      guard selectedBlock != nil else {\n        showNotice(\"先选择一个段落、图片或表格\")\n        return\n      }\n      state.customInstruction = \"\"\n    case .rewrite:\n      startRewrite()\n      return\n    case .insertTable:\n      guard !isEditorLocked else { return }\n    case .imageDescription:\n      guard !isEditorLocked, let image = selectedBlock?.image else { return }\n      state.imageDescription = image.altText\n    case .statistics:\n      guard currentArticle != nil else { return }\n    case .shortcuts, .about:\n      break\n    }\n    state.sheet = sheet\n  }\n\n  func dismissSheet() { state.sheet = nil }\n\n  func submitCustomMark() {\n    guard state.sheet == .customMark, !isEditorLocked, selectedBlock != nil,\n      !state.customInstruction.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty\n    else {\n      return\n    }\n    markSelection(instruction: state.customInstruction)\n    dismissSheet()\n  }\n\n  func showNotice(_ message: String) { state.notice = message }\n  func dismissNotice() {\n    state.notice = nil\n    if case .failed(let message) = currentSession?.review { state.dismissedReviewError = message }\n  }\n\n  private func clearSelection() {\n    editorSession.clear()\n    state.selectedBlockID = nil\n    state.selectedRange = NSRange(location: 0, length: 0)\n    state.selectedChangeID = nil\n    state.sheet = nil\n    state.notice = nil\n    state.dismissedReviewError = nil\n    state.customInstruction = \"\"\n    state.rewriteText = \"\"\n    state.rewriteReason = \"\"\n    state.imageDescription = \"\"\n  }\n\n  private func resetHistorySelection() {\n    state.historyFromID = currentArticle?.versions.first?.id\n    state.historyToID = currentArticle?.versions.last?.id\n  }\n\n  private func resetHistorySelectionIfNeeded() {\n    let ids = Set(currentArticle?.versions.map(\\.id) ?? [])\n    if state.historyFromID.map({ !ids.contains($0) }) ?? true {\n      state.historyFromID = currentArticle?.versions.first?.id\n    }\n    if state.historyToID.map({ !ids.contains($0) }) ?? true {\n      state.historyToID = currentArticle?.versions.last?.id\n    }\n  }\n\n  /// Shared documents can change in another window while this window keeps its own selection.\n  private func reconcileState() {\n    guard let article = currentArticle else {\n      state.selectedArticleID = articles.first?.id\n      state.mode = .writing\n      clearSelection()\n      resetHistorySelection()\n      return\n    }\n    if let id = state.selectedBlockID {\n      if let block = article.blocks.first(where: { $0.id == id }) {\n        if block.kind == .text, !isValid(state.selectedRange, in: block.text.string) {\n          state.selectedRange = NSRange(location: block.text.string.utf16.count, length: 0)\n        }\n      } else {\n        editorSession.clear()\n        state.selectedBlockID = nil\n        state.selectedRange = NSRange(location: 0, length: 0)\n        if state.sheet == .customMark || state.sheet == .imageDescription {\n          dismissSheet()\n          state.customInstruction = \"\"\n          state.imageDescription = \"\"\n        }\n      }\n    }\n    if article.phase != .ready {\n      if state.mode == .review { state.mode = .writing }\n      if state.selectedChangeID != nil { state.selectedChangeID = nil }\n      if state.sheet == .rewrite {\n        dismissSheet()\n        state.rewriteText = \"\"\n        state.rewriteReason = \"\"\n      }\n    } else if let id = state.selectedChangeID,\n      !article.changes.contains(where: { $0.id == id })\n    {\n      state.selectedChangeID = nil\n      if state.sheet == .rewrite { dismissSheet() }\n    }\n    resetHistorySelectionIfNeeded()\n  }\n\n  private var canEditReview: Bool {\n    state.section == .articles && state.mode == .review && state.sheet == nil\n      && currentArticle?.phase == .ready\n  }\n\n  private func report(_ error: Error) {\n    showNotice(\"无法完成操作：\\(error.localizedDescription)\")\n  }\n\n  private func isValid(_ range: NSRange, in text: String) -> Bool {\n    guard range.location >= 0, range.length >= 0, range.location \u003c= text.utf16.count,\n      range.length \u003c= text.utf16.count - range.location, let indices = Range(range, in: text)\n    else { return false }\n    return indices.lowerBound.samePosition(in: text) != nil\n      && indices.upperBound.samePosition(in: text) != nil\n  }\n}\n", "Tests/WorkspaceStateTests.swift": "import AppKit\nimport Combine\nimport RedraftCore\n\n/// Run with the App model and view-model sources, outside the application target.\n@main\nstruct WorkspaceStateTests {\n  @MainActor\n  static func main() async throws {\n    try articleSelectionAndDeletion()\n    try unicodeSelectionAndMarking()\n    try reviewDecisions()\n    try examplesAndSnapshots()\n    try sheetActionsStayScoped()\n    try await mixedContentDecisionsStayIndependent()\n    try await cancellationIsArticleScoped()\n    try await unknownTextDoesNotInventSuggestions()\n    try injectedSourcesAndSharedOwnership()\n    try await sharedReviewLifecycle()\n    try sharedReferencesStayValid()\n    try await injectedReviewResultsAndFailures()\n    print(\"Workspace UI state: 12 scenarios passed\")\n  }\n\n  @MainActor\n  private static func articleSelectionAndDeletion() throws {\n    let model = try TestSupport.demoModel()\n    let original = model.currentArticle!\n    model.selectBlock(original.blocks[0].id)\n    model.showSheet(.customMark)\n    model.state.customInstruction = \"旧文章的标记\"\n    model.selectArticle(model.articles[1].id)\n    try expect(\n      model.state.selectedBlockID == nil && model.state.sheet == nil,\n      \"Changing articles must clear selection and presented edits\")\n    try expect(model.state.customInstruction.isEmpty, \"Sheet drafts must not leak across articles\")\n    model.updateBlockText(original.blocks[0].id, text: NSAttributedString(string: \"错误修改\"))\n    try expect(\n      model.articles[0].blocks[0].text == original.blocks[0].text,\n      \"A stale editor callback must not mutate another article\")\n    model.newArticle()\n    let created = model.currentArticle!.id\n    model.renameArticle(\"新的文章\")\n    try expect(model.currentArticle?.title == \"新的文章\", \"New articles must accept edits\")\n    model.deleteArticle(created)\n    try expect(\n      model.currentArticle != nil && model.currentArticle?.id != created,\n      \"Deleting the selected article must leave a valid selection\")\n  }\n\n  @MainActor\n  private static func unicodeSelectionAndMarking() throws {\n    let block = DocumentBlock(text: RichTextContent(string: \"写👩🏽‍💻稿\"))\n    let article = Article(title: \"边界\", blocks: [block])\n    let model = try TestSupport.model(articles: [article])\n    let valid = NSRange(location: 1, length: \"👩🏽‍💻\".utf16.count)\n    model.updateSelection(blockID: block.id, range: valid)\n    model.updateSelection(blockID: block.id, range: NSRange(location: 2, length: 1))\n    try expect(model.state.selectedRange == valid, \"Selections cannot split composed characters\")\n    model.markSelection(instruction: \"更具体\")\n    try expect(model.currentArticle?.marks[block.id] == \"更具体\", \"Marking uses the selected block\")\n    model.unmarkBlock(block.id)\n    try expect(model.markedCount == 0, \"Unmarking must update the same source of truth\")\n    model.markSelection(instruction: \"更简洁\")\n    model.deleteBlock(block.id)\n    try expect(\n      model.markedCount == 0 && model.state.selectedBlockID == nil,\n      \"Deleting a block must remove its marks and selection\")\n    try expect(\n      model.currentArticle?.blocks.count == 1,\n      \"Deleting the last block must preserve an editable blank paragraph\")\n  }\n\n  @MainActor\n  private static func reviewDecisions() throws {\n    let model = try TestSupport.demoModel()\n    model.selectArticle(model.articles.first(where: { $0.phase == .ready })!.id)\n    let source = model.currentArticle!.blocks\n    model.enterReview()\n    model.completeReview()\n    try expect(\n      model.state.mode == .review && model.currentArticle?.phase == .ready,\n      \"Unresolved review decisions must prevent completion\")\n    let changes = model.currentArticle!.changes\n    model.decide(.accept, changeID: changes[0].id)\n    model.decide(.keep, changeID: changes[1].id)\n    model.decide(.rewrite, changeID: changes[2].id)\n    try expect(\n      model.state.sheet == .rewrite && model.state.rewriteText == changes[2].after,\n      \"Rewrite must open with the current suggestion\")\n    model.state.rewriteText = \"这是我自己的表达。\"\n    model.state.rewriteReason = \"更符合我的语气\"\n    model.submitRewrite()\n    try expect(model.unresolvedCount == 0, \"All three review choices must resolve a change\")\n    model.completeReview()\n    try expect(\n      model.state.mode == .writing && model.currentArticle?.phase == .idle,\n      \"Completing review must unlock writing\")\n    try expect(\n      model.currentArticle?.blocks == source,\n      \"UI preview must not pretend to run the unimplemented document merge\")\n    try expect(\n      model.examples.contains { $0.after == \"这是我自己的表达。\" && $0.decision == .rewrite },\n      \"The chosen expression must appear in examples\")\n  }\n\n  @MainActor\n  private static func examplesAndSnapshots() throws {\n    let model = try TestSupport.demoModel()\n    let diary = model.articles.first { $0.title == \"写日记的第一百天\" }!\n    let originalDiary = diary.versions[0].blocks\n    let styledDiary = diary.versions[1].blocks\n    try expect(\n      originalDiary.map(\\.plainText) == styledDiary.map(\\.plainText)\n        && originalDiary != styledDiary,\n      \"The diary must demonstrate formatting-only history without inventing text changes\")\n    let versionCount = model.currentArticle!.versions.count\n    model.setMode(.history)\n    model.savePreviewVersion()\n    try expect(\n      model.currentArticle!.versions.count == versionCount + 1,\n      \"Manual snapshots must work from history as well as writing\")\n    model.state.exampleFilter = .rewrite\n    model.state.exampleQuery = \"受潮\"\n    try expect(\n      model.filteredExamples.count == 1 && model.filteredExamples[0].decision == .rewrite,\n      \"Example search and decision filter must combine\")\n    let example = model.filteredExamples[0]\n    model.selectExample(example.id)\n    try expect(\n      model.state.selectedArticleID == example.articleID && model.state.mode == .writing,\n      \"An example must navigate back to its source article\")\n    try expect(\n      model.selectedBlock?.plainText.contains(example.after) == true\n        && model.state.inspectorTab == .provenance && model.state.inspectorVisible,\n      \"An example must select its matching source block and open provenance\")\n  }\n\n  @MainActor\n  private static func sheetActionsStayScoped() throws {\n    let model = try TestSupport.demoModel()\n    model.showSheet(.customMark)\n    try expect(model.state.sheet == nil, \"A custom mark needs a selected content block\")\n    model.selectBlock(model.currentArticle!.blocks[0].id)\n    model.showSheet(.customMark)\n    model.state.customInstruction = \"更具体\"\n    model.dismissSheet()\n    let count = model.markedCount\n    model.submitCustomMark()\n    try expect(model.markedCount == count, \"A dismissed sheet cannot submit a stale custom mark\")\n\n    model.selectArticle(model.articles.first { $0.phase == .ready }!.id)\n    model.enterReview()\n    let first = model.currentChange!\n    let other = model.currentArticle!.changes[1]\n    try expect(\n      model.state.selectedBlockID == first.blockID,\n      \"Entering review must keep the current change and source block in sync\")\n    model.decide(.rewrite)\n    model.state.rewriteText = \" \\n \"\n    model.submitRewrite()\n    try expect(\n      model.state.sheet == .rewrite && model.currentChange?.decision == nil,\n      \"Blank rewrites cannot resolve a change or dismiss the editor\")\n    model.selectChange(other.id)\n    model.decide(.accept, changeID: other.id)\n    try expect(\n      model.state.selectedChangeID == first.id\n        && model.currentArticle?.changes.first { $0.id == other.id }?.decision == nil,\n      \"An open sheet must not retarget its pending rewrite behind the modal\")\n    model.dismissSheet()\n    model.state.rewriteText = \"迟到的提交\"\n    model.submitRewrite()\n    try expect(model.currentChange?.decision == nil, \"Dismissed rewrite submissions are ignored\")\n    model.showSheet(.insertTable)\n    try expect(model.state.sheet == nil, \"Locked review content cannot open an insert sheet\")\n  }\n\n  @MainActor\n  private static func mixedContentDecisionsStayIndependent() async throws {\n    let model = try TestSupport.demoModel()\n    let article = model.currentArticle!\n    let changes = try await DemoReviewProvider(delay: .zero).changes(\n      for: ReviewRequest(article: article.document))\n    let table = article.blocks.first { $0.kind == .table }!\n    let tableChanges = changes.filter { $0.blockID == table.id }\n    for change in tableChanges {\n      if let before = change.beforeBlock?.table, let after = change.afterBlock?.table {\n        try expect(\n          after.rowIDs.count == after.rows.count && after.columnIDs.count == after.columnCount,\n          \"Table preview structures must preserve a valid identity for every cell\")\n        if change.kind == .text {\n          try expect(\n            before.rowIDs == after.rowIDs && before.columnIDs == after.columnIDs,\n            \"Cell text changes must preserve row and column identity\")\n        }\n      }\n    }\n    try expect(\n      tableChanges.filter { $0.kind == .text }.count == 2\n        && tableChanges.filter { $0.kind == .tableColumn }.count == 1\n        && tableChanges.filter { $0.kind == .tableRow }.count == 1,\n      \"Cell text, column removal, and row insertion need independent review decisions\")\n    let image = article.blocks.first { $0.kind == .image }!\n    try expect(\n      changes.filter { $0.blockID == image.id }.count == 2,\n      \"Replacing a picture and rewriting its caption are separate choices\")\n    let reviewModel = try WorkspaceViewModel(\n      source: TestSupport.Source(\n        seed: WorkspaceSeed(articles: [\n          ArticleSeed(\n            document: article.document,\n            review: ReviewBatch(\n              articleID: article.id, baseRevisionID: article.document.revisionID, changes: changes))\n        ])), reviewProvider: NoReviewProvider())\n    reviewModel.enterReview()\n    let column = tableChanges.first { $0.kind == .tableColumn }!\n    let row = tableChanges.first { $0.kind == .tableRow }!\n    reviewModel.decide(.rewrite, changeID: column.id)\n    try expect(reviewModel.state.sheet == nil, \"Structural changes do not offer text rewriting\")\n    reviewModel.decide(.keep, changeID: column.id)\n    reviewModel.decide(.accept, changeID: row.id)\n    try expect(\n      reviewModel.currentArticle?.changes.first { $0.id == column.id }?.decision == .keep\n        && reviewModel.currentArticle?.changes.first { $0.id == row.id }?.decision == .accept,\n      \"Keeping a column must not undo the choice to accept a new row\")\n    for change in reviewModel.currentArticle!.changes where change.decision == nil {\n      reviewModel.decide(.accept, changeID: change.id)\n    }\n    reviewModel.completeReview()\n    let imageExample = reviewModel.examples.first { $0.blockID == image.id }!\n    reviewModel.selectExample(imageExample.id)\n    try expect(\n      reviewModel.state.selectedBlockID == image.id,\n      \"Image examples must navigate by stable block identity, even without matching text\")\n  }\n\n  @MainActor\n  private static func cancellationIsArticleScoped() async throws {\n    let model = try TestSupport.demoModel()\n    let first = model.articles[0].id\n    let second = model.articles[1].id\n    model.beginReview()\n    model.selectArticle(second)\n    model.beginReview()\n    model.cancelReview()\n    try await Task.sleep(for: .milliseconds(1300))\n    try expect(\n      model.articles.first { $0.id == first }?.phase == .ready,\n      \"Switching articles must preserve the first article's request\")\n    try expect(\n      model.articles.first { $0.id == second }?.phase == .idle,\n      \"Cancelling must affect only the selected article\")\n    try expect(\n      model.state.notice == \"已取消，标记保持原样\",\n      \"A background completion must not replace another article's notice\")\n    model.beginReview()\n    model.deleteArticle(second)\n    try await Task.sleep(for: .milliseconds(1300))\n    try expect(\n      !model.articles.contains { $0.id == second },\n      \"A deleted article must not reappear when its pending request ends\")\n  }\n\n  @MainActor\n  private static func unknownTextDoesNotInventSuggestions() async throws {\n    let model = try TestSupport.demoModel()\n    model.newArticle()\n    let block = model.currentArticle!.blocks[0]\n    model.updateBlockText(block.id, text: NSAttributedString(string: \"这是一段新的文字。\"))\n    model.markBlock(block.id, instruction: \"更简洁\")\n    model.beginReview()\n    try await Task.sleep(for: .milliseconds(1300))\n    try expect(\n      model.currentArticle?.phase == .idle && model.currentArticle?.changes.isEmpty == true,\n      \"Unknown text must not receive fabricated service results\")\n    try expect(model.markedCount == 1, \"Unmatched previews must preserve the user's marks\")\n  }\n\n  @MainActor\n  private static func injectedSourcesAndSharedOwnership() throws {\n    let empty = try WorkspaceViewModel(\n      source: EmptyWorkspaceContentSource(), reviewProvider: NoReviewProvider())\n    try expect(\n      empty.articles.isEmpty && empty.currentArticle == nil,\n      \"An empty source must never silently load demo articles\")\n    empty.newArticle()\n    try expect(\n      empty.articles.count == 1 && empty.currentArticle?.blocks.first?.plainText == \"\",\n      \"Creating a document must use the Core model, not sample content\")\n\n    let original = Article(\n      title: \"共享文档\", blocks: [DocumentBlock(text: RichTextContent(string: \"初稿\"))])\n    let store = try WorkspaceStore(seed: WorkspaceSeed(articles: [ArticleSeed(document: original)]))\n    let first = WorkspaceViewModel(store: store, reviewProvider: NoReviewProvider())\n    let second = WorkspaceViewModel(store: store, reviewProvider: NoReviewProvider())\n    var secondNotifications = 0\n    let subscription = second.objectWillChange.sink { secondNotifications += 1 }\n    defer { subscription.cancel() }\n    first.state.inspectorVisible = true\n    first.savePreviewVersion()\n    let snapshot = first.historyTo!\n    let initialRevision = original.revisionID\n    first.renameArticle(\"修改后的标题\")\n    first.updateBlockText(original.blocks[0].id, text: NSAttributedString(string: \"新的正文\"))\n    try expect(\n      second.currentArticle?.title == \"修改后的标题\"\n        && second.currentArticle?.blocks.first?.plainText == \"新的正文\",\n      \"Two view models must project the same canonical document\")\n    try expect(\n      second.currentArticle?.document.revisionID != initialRevision && secondNotifications > 0,\n      \"Session edits must publish a new revision to every subscribed window\")\n    try expect(\n      second.state.inspectorVisible == false,\n      \"Sharing documents must not share window-local UI state\")\n    try expect(\n      snapshot.blocks.first?.plainText == \"初稿\"\n        && second.currentArticle?.versions.last?.blocks.first?.plainText == \"初稿\",\n      \"Saved snapshots are immutable historical values, not another writable current document\")\n    var detached = second.currentArticle!.document\n    detached.title = \"不能写穿投影\"\n    try expect(\n      first.currentArticle?.title == \"修改后的标题\",\n      \"Mutating a detached snapshot must not bypass the session\")\n    first.deleteArticle(original.id)\n    try expect(\n      second.articles.isEmpty && second.currentArticle == nil,\n      \"Deleting a shared article must invalidate every derived view\")\n  }\n\n  @MainActor\n  private static func sharedReviewLifecycle() async throws {\n    let source = DemoWorkspaceContentSource().load()\n    let store = try WorkspaceStore(seed: source)\n    let first = WorkspaceViewModel(\n      store: store, reviewProvider: DemoReviewProvider(delay: .seconds(10)))\n    let second = WorkspaceViewModel(store: store, reviewProvider: NoReviewProvider())\n    first.beginReview()\n    try expect(\n      second.currentArticle?.phase == .running && second.isEditorLocked,\n      \"Review workflow state must belong to the shared article session\")\n    second.cancelReview()\n    try expect(\n      first.currentArticle?.phase == .idle && !first.isEditorLocked,\n      \"A second consumer must cancel the same request, not a separate view-model task\")\n    try await Task.sleep(for: .milliseconds(10))\n    try expect(\n      first.currentArticle?.changes.isEmpty == true,\n      \"Cancelled work must not republish suggestions\")\n  }\n\n  @MainActor\n  private static func sharedReferencesStayValid() throws {\n    let paragraph = DocumentBlock(text: RichTextContent(string: \"原来的较长正文\"))\n    let image = DocumentBlock(image: ImageContent(altText: \"原来的描述\"))\n    let article = Article(title: \"引用校正\", blocks: [paragraph, image])\n    let store = try WorkspaceStore(seed: WorkspaceSeed(articles: [ArticleSeed(document: article)]))\n    let first = WorkspaceViewModel(store: store, reviewProvider: NoReviewProvider())\n    let second = WorkspaceViewModel(store: store, reviewProvider: NoReviewProvider())\n    second.selectBlock(image.id)\n    second.showSheet(.imageDescription)\n    first.deleteBlock(image.id)\n    try expect(\n      second.state.selectedBlockID == nil && second.state.sheet == nil,\n      \"Removing a shared block must close editors targeting that block\")\n    second.updateSelection(blockID: paragraph.id, range: NSRange(location: 2, length: 4))\n    first.updateBlockText(paragraph.id, text: NSAttributedString(string: \"短\"))\n    try expect(\n      second.state.selectedRange == NSRange(location: 1, length: 0),\n      \"External text changes must repair a now-invalid local selection\")\n    second.showSheet(.customMark)\n    first.deleteArticle(article.id)\n    try expect(\n      second.state.selectedArticleID == nil && second.state.selectedBlockID == nil\n        && second.state.sheet == nil && second.state.mode == .writing,\n      \"Removing an article must reconcile se
