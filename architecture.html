<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Redraft · 架构</title>
<style>
:root {
  color-scheme: light;
  --page: #f5f5f7; --surface: #fff; --subtle: #f5f5f7; --ink: #1d1d1f;
  --secondary: #6e6e73; --line: #e5e5e9; --blue: #0071e3; --blue-tint: #eaf3ff;
  --green: #26834a; --amber: #9b690f; --purple: #7650b6; --soft-shadow: 0 4px 18px #00000004;
  --graph-line: #b1b8c4; --group: #f7f8fa; --code: #f8f9fb;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark; --page: #161617; --surface: #212123; --subtle: #29292c;
    --ink: #f5f5f7; --secondary: #a1a1a6; --line: #363639; --blue: #60a9ff;
    --blue-tint: #20344f; --green: #6bc58b; --amber: #e1b15a; --purple: #bd9cef;
    --graph-line: #656a75; --group: #252527; --code: #1c1c1e; --soft-shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif; font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; }
button { cursor: pointer; }
button, input, select { -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
button { color: inherit; }
button:disabled { cursor: default; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
button { border: 0; }
.app { max-width: 1680px; margin: auto; padding: 36px 36px 24px; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
.brand { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; color: var(--secondary); margin-bottom: 9px; }
.brand-mark { width: 21px; height: 21px; border-radius: 6px; display: inline-grid; place-items: center; background: var(--ink); color: var(--surface); font-family: Georgia, serif; font-size: 17px; font-style: italic; }
h1 { font-size: 30px; letter-spacing: -.7px; line-height: 1.2; font-weight: 650; }
.snapshot { color: var(--secondary); font-size: 12px; text-align: right; padding-top: 5px; }
.snapshot div + div { margin-top: 3px; }
.branch { display: inline-block; max-width: 400px; overflow-wrap: anywhere; color: var(--ink); }
.stale { margin: 0 0 18px; padding: 12px 16px; border-radius: 12px; background: color-mix(in srgb, var(--amber) 11%, var(--surface)); color: var(--ink); font-size: 13px; }
.stale strong { color: var(--amber); margin-right: 10px; }
.topbar { margin-top: 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 16px; }
.segmented { display: inline-flex; align-items: center; gap: 3px; padding: 3px; border-radius: 9px; background: color-mix(in srgb, var(--secondary) 11%, transparent); }
.segmented button { padding: 5px 17px; border-radius: 7px; background: transparent; color: var(--secondary); font-size: 13px; white-space: nowrap; }
.segmented button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px #00000012; }
.graph-control { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.search { width: 210px; height: 33px; padding: 5px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.search::placeholder { color: var(--secondary); }
select { height: 33px; padding: 4px 28px 4px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 12px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 306px; align-items: start; gap: 18px; }
.workspace { min-width: 0; }
.layout.no-selection { grid-template-columns: minmax(0, 1fr); }
.graph-panel, .inspector, .module-panel { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; box-shadow: var(--soft-shadow); overflow: hidden; }
.graph-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.package { display: flex; align-items: center; gap: 10px; font-size: 12px; }
.package strong { font-weight: 600; }
.package .arrow { color: var(--blue); }
.package small { color: var(--secondary); font-size: 11px; }
.edge-switch { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--secondary); cursor: pointer; }
.edge-switch input { width: 28px; height: 16px; accent-color: var(--blue); }
.graph-scroll { overflow-x: auto; overscroll-behavior-x: contain; }
.board { min-width: 580px; height: 590px; position: relative; isolation: isolate; }
.group { position: absolute; top: 24px; bottom: 23px; border-radius: 13px; background: var(--group); z-index: -2; }
.group-app { left: 2%; width: 21%; }
.group-core { left: 26%; width: 47%; }
.group-adapters { left: 76%; width: 22%; }
.group-label { position: absolute; top: 15px; left: 15px; color: var(--secondary); font-size: 11px; letter-spacing: .5px; font-weight: 600; }
.links { position: absolute; width: 100%; height: 100%; top: 0; left: 0; overflow: visible; pointer-events: none; z-index: -1; }
.link { fill: none; stroke: var(--graph-line); stroke-width: 1.5; }
.link.planned { stroke-dasharray: 5 5; }
.link.related { stroke: var(--blue); stroke-width: 1.8; }
.link.muted { opacity: .65; }
.node { position: absolute; width: 17.6%; min-height: 76px; padding: 13px 12px 12px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; box-shadow: 0 2px 5px #00000003; transition: border-color .15s, box-shadow .15s, opacity .15s; }
.node:hover { border-color: var(--blue); }
.node[aria-pressed="true"] { border-color: var(--blue); box-shadow: 0 0 0 2px color-mix(in srgb, var(--blue) 14%, transparent); background: color-mix(in srgb, var(--blue) 4%, var(--surface)); }
.node.muted { opacity: 1; }
.node .node-title { display: block; font-weight: 600; font-size: 13px; line-height: 1.3; }
.node .node-subtitle { display: block; color: var(--secondary); font-size: 11px; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--secondary); white-space: nowrap; }
.node .status { margin-top: 10px; }
.status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }
.status.scaffold { color: var(--blue); }
.status.partial { color: var(--amber); }
.status.interface { color: var(--purple); }
.status.implemented { color: var(--green); }
.status.planned::before { background: transparent; border: 1px solid currentColor; }
.empty-graph { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; color: var(--secondary); }
.graph-footer { display: flex; justify-content: space-between; flex-wrap: wrap; align-items: center; gap: 12px; min-height: 46px; border-top: 1px solid var(--line); padding: 11px 20px; color: var(--secondary); font-size: 11px; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; }
.legend span { display: flex; align-items: center; gap: 6px; }
.line-sample { display: inline-block; width: 22px; border-top: 1.5px solid var(--graph-line); }
.line-sample.dashed { border-top-style: dashed; }
.inspector { position: sticky; top: 20px; }
.inspector-head { padding: 22px 21px 20px; border-bottom: 1px solid var(--line); }
.inspector .eyebrow { color: var(--secondary); font-size: 11px; margin-bottom: 8px; }
.inspector h2 { font-size: 21px; letter-spacing: -.3px; font-weight: 600; margin-bottom: 8px; }
.inspector p { color: var(--secondary); font-size: 12px; line-height: 1.75; margin-top: 12px; }
.inspector-body { padding: 0 21px 20px; }
.detail-section { margin-top: 20px; }
.detail-section h3 { font-size: 12px; font-weight: 600; margin-bottom: 9px; }
.detail-list { margin: 0; padding: 0 0 0 15px; color: var(--secondary); font-size: 12px; }
.detail-list li + li { margin-top: 7px; }
.file-button { padding: 7px 0; display: block; width: 100%; text-align: left; overflow-wrap: anywhere; font-size: 11px; line-height: 1.55; color: var(--blue); background: transparent; }
.file-button:hover { text-decoration: underline; }
.symbols { display: flex; gap: 5px; flex-wrap: wrap; }
.symbols code { font-size: 11px; color: var(--secondary); background: var(--subtle); padding: 3px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.relation { padding: 7px 0; width: 100%; background: transparent; text-align: left; font-size: 12px; display: flex; flex-direction: column; gap: 2px; }
.relation span { color: var(--blue); }
.relation small { font-size: 11px; color: var(--secondary); }
.source-evidence { width: 100%; padding: 9px 10px; background: var(--subtle); border-radius: 7px; text-align: left; margin-top: 6px; }
.source-evidence b { display: block; font-size: 11px; font-weight: 500; color: var(--blue); overflow-wrap: anywhere; }
.source-evidence span { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-top: 4px; color: var(--secondary); font-size: 11px; line-height: 1.5; overflow-wrap: anywhere; }
.bottom { display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap; color: var(--secondary); margin-top: 17px; font-size: 11px; }
.maintenance { max-width: 760px; }
.maintenance summary { cursor: pointer; width: fit-content; }
.maintenance p { margin-top: 8px; line-height: 1.7; }
.maintenance code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; color: var(--ink); overflow-wrap: anywhere; }
.fingerprint { font-variant-numeric: tabular-nums; }
.scroll-hint { display: none; }
dialog { width: min(900px, calc(100vw - 40px)); max-height: 84vh; border: 1px solid var(--line); border-radius: 16px; padding: 0; background: var(--surface); color: var(--ink); box-shadow: 0 20px 80px #00000030; }
dialog::backdrop { background: #0000003d; backdrop-filter: blur(5px); }
.source-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px 22px; border-bottom: 1px solid var(--line); }
.source-head h2 { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; font-weight: 500; overflow-wrap: anywhere; }
.close { background: var(--subtle); border-radius: 50%; flex: 0 0 29px; height: 29px; font-size: 20px; line-height: 1; }
.source-lines { max-height: 66vh; overflow: auto; margin: 0; padding: 18px 15px 18px 55px; font: 12px/1.8 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code); tab-size: 2; }
.source-lines li { padding-left: 9px; white-space: pre-wrap; overflow-wrap: anywhere; }
.source-lines li::marker { color: var(--secondary); font-size: 10px; }
.source-lines li.highlight { background: var(--blue-tint); border-radius: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
@media (min-width: 1550px) { .board { height: 640px; } .node { min-height: 82px; padding: 15px; } .node .node-title { font-size: 14px; } .node .node-subtitle { font-size: 11px; } }
@media (max-width: 1180px) { .app { padding: 26px 22px; } .layout { grid-template-columns: minmax(0, 1fr) 278px; gap: 14px; } .inspector-head { padding: 20px 18px; } .inspector-body { padding: 0 18px 18px; } }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } .inspector { position: static; } .inspector-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; } .board { min-width: 560px; } }
@media (max-width: 600px) { .app { padding: 22px 14px; } h1 { font-size: 27px; } .top { flex-direction: column; gap: 14px; } .snapshot { text-align: left; padding: 0; } .topbar { align-items: stretch; } .graph-control { width: 100%; } .search { flex: 1; width: 130px; min-width: 0; } .graph-header { padding: 13px 15px; } .package small { display: none; } .board { height: 660px; min-width: 640px; } .scroll-hint { display: inline; } .node { min-height: 80px; } .graph-footer { padding: 11px 15px; } .inspector-body { display: block; } dialog { width: calc(100vw - 20px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; } }

.module-panel { padding: 8px 24px 24px; }
.module-group { margin-top: 20px; }
.module-group h2 { font-size: 12px; color: var(--secondary); font-weight: 600; margin: 0 0 8px 12px; }
.module-row, .implementation-row { display: grid; grid-template-columns: minmax(130px, 1fr) minmax(0, 2.1fr); align-items: start; gap: 20px; width: 100%; text-align: left; padding: 16px 12px; border-radius: 9px; background: transparent; }
.module-row + .module-row, .implementation-row + .implementation-row { border-top: 1px solid var(--line); }
.module-row:hover, .implementation-row:hover { background: var(--subtle); }
.module-row[aria-pressed="true"], .implementation-row[aria-pressed="true"] { background: var(--blue-tint); }
.module-name { display: block; font-size: 14px; font-weight: 600; }
.module-symbol { display: block; font-size: 11px; color: var(--secondary); margin-top: 5px; overflow-wrap: anywhere; }
.module-definition { font-size: 13px; color: var(--secondary); line-height: 1.8; }
.implementation-row .status { margin-top: 6px; }
.implementation-note { font-size: 13px; color: var(--secondary); line-height: 1.8; }
.source-disclosure { margin-top: 22px; }
.source-disclosure summary { color: var(--secondary); font-size: 12px; cursor: pointer; }
.list-empty { color: var(--secondary); padding: 40px 12px; }
.snapshot { white-space: nowrap; }
@media (max-width: 600px) {
  .segmented { width: 100%; }
  .segmented button { flex: 1; padding: 7px 9px; }
  .module-panel { padding: 6px 10px 18px; }
  .module-row, .implementation-row { grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 14px 12px; }
  .inspector-body { display: block; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><div class="brand"><span class="brand-mark" aria-hidden="true">r</span> Redraft</div><h1>架构</h1></div>
    <div class="snapshot" id="review-date"></div>
  </header>
  <p class="stale" id="stale" hidden><strong>代码或设计已变化，模块状态待复核</strong>下面的模块状态保留上次核对结果，可打开源码查看当前内容。</p>
  <div class="topbar">
    <div class="segmented" aria-label="查看方式"><button type="button" id="definitions-tab" aria-pressed="true">模块定义</button><button type="button" id="graph-tab" aria-pressed="false">依赖关系</button><button type="button" id="implementation-tab" aria-pressed="false">实现状态</button></div>
    <div class="graph-control" id="graph-controls"><label class="sr-only" for="search">搜索模块或符号</label><input class="search" id="search" type="search" placeholder="搜索模块或符号" autocomplete="off"><label class="sr-only" for="status-filter">按实现状态筛选</label><select id="status-filter" hidden><option value="all">所有状态</option><option value="scaffold">应用骨架</option><option value="partial">部分实现</option><option value="interface">接口已定义</option><option value="planned">待实现</option><option value="implemented">已实现</option></select></div>
  </div>
  <main class="layout">
    <div class="workspace">
      <section class="module-panel" id="definitions-panel" aria-label="模块定义"><div id="definition-list"></div><p class="list-empty" id="definitions-empty" hidden>没有匹配的模块</p></section>
      <section class="module-panel" id="implementation-panel" aria-label="实现状态" hidden><div id="implementation-list"></div><p class="list-empty" id="implementation-empty" hidden>没有匹配的模块</p></section>
      <section class="graph-panel" id="graph-panel" aria-label="模块依赖图" hidden>
        <div class="graph-header"><div class="package"><strong id="package-from"></strong><span class="arrow">→</span><strong id="package-to"></strong><small>包依赖</small></div><label class="edge-switch"><input id="show-planned" type="checkbox" checked>显示设计依赖</label></div>
        <div class="graph-scroll"><div class="board" id="board"><div class="group group-app"><span class="group-label">APP · 客户端</span></div><div class="group group-core"><span class="group-label">REDRAFT CORE · 核心</span></div><div class="group group-adapters"><span class="group-label">APP · 适配器</span></div><svg class="links" id="links" aria-hidden="true"></svg><div class="empty-graph" id="empty-graph" hidden>没有匹配的模块</div></div></div>
        <div class="graph-footer"><div class="legend"><span><i class="line-sample" aria-hidden="true"></i>代码引用</span><span><i class="line-sample dashed" aria-hidden="true"></i>设计依赖</span></div><span class="scroll-hint">左右滑动查看完整架构</span><span>箭头指向被依赖模块</span></div>
      </section>
    </div>
    <aside class="inspector" id="inspector" aria-label="模块详情"><div class="inspector-head"><div class="eyebrow" id="detail-layer"></div><h2 id="detail-title"></h2><div id="detail-status"></div><p id="detail-summary"></p></div><div class="inspector-body" id="detail-body"></div></aside>
  </main>
  <footer class="bottom"><details class="maintenance"><summary>更新这份架构快照</summary><p>在仓库根目录运行 <code>python3 scripts/update_architecture.py</code>，然后重新打开本页。源码快照随命令更新，模块状态与设计依赖由 <code>scripts/architecture.json</code> 维护。</p><p id="package-evidence"></p><p id="branch"></p><p id="snapshot-date"></p><p class="fingerprint" id="fingerprint"></p></details></footer>
  <div class="sr-only" id="announcement" aria-live="polite"></div>
</div>

tion: \"图注 · 补上番茄开花的时间和细节。\",\n            beforeBlock: block, afterBlock: caption),\n        ]\n      }\n      if let table = block.table,\n        table.rows == balconyTableRows\n      {\n        var march = block\n        march.table?.rows[1][3] = \"长得很慢\"\n        var april = block\n        april.table?.rows[2][3] = \"每天浇水\"\n        var column = block\n        column.table?.rows = table.rows.map { row in\n          var cells = row\n          cells.remove(at: 2)\n          return cells\n        }\n        column.table?.columnIDs.remove(at: 2)\n        var row = block\n        row.table?.rows.append([\"六月\", \"辣椒\", \"移栽\", \"刚移栽，还没开花\"])\n        row.table?.rowIDs.append(UUID())\n        return [\n          ReviewChange(\n            blockID: block.id, before: table.rows[1][3], after: \"长得很慢\",\n            explanation: \"表格 · 三月 / 备注：删去重复的程度词。\", beforeBlock: block, afterBlock: march),\n          ReviewChange(\n            blockID: block.id, before: table.rows[2][3], after: \"每天浇水\",\n            explanation: \"表格 · 四月 / 备注：直接写下需要做的事。\", beforeBlock: block, afterBlock: april),\n          ReviewChange(\n            blockID: block.id, kind: .tableColumn, before: \"状态：发芽 / 开花 / 收获\", after: \"删除“状态”列\",\n            explanation: \"表格结构 · 去掉与备注重复的状态信息。\", beforeBlock: block, afterBlock: column),\n          ReviewChange(\n            blockID: block.id, kind: .tableRow, before: \"三月至五月的记录\",\n            after: \"六月 · 辣椒 · 移栽 · 刚移栽，还没开花\",\n            explanation: \"表格结构 · 单独确认新增的六月记录。\", beforeBlock: block, afterBlock: row),\n        ]\n      }\n      guard let after = textSuggestions[block.plainText] else { return [] }\n      var result = block\n      result.text = RichTextContent(\n        string: after, defaultStyle: block.text.defaultStyle,\n        paragraphStyle: block.text.paragraphStyle)\n      return [\n        ReviewChange(\n          blockID: block.id, before: block.plainText, after: after,\n          explanation: \"精简重复表达，让动作和画面更清楚。\", beforeBlock: block, afterBlock: result)\n      ]\n    }\n  }\n\n  static func suggestedBlocks(for article: Article) -> [DocumentBlock] {\n    let suggestions = changes(for: article)\n    return article.blocks.map { block in\n      if article.marks[block.id] != nil, block.image?.assetName == \"sample-balcony\" {\n        var after = block\n        after.image?.assetName = \"sample-tomato\"\n        after.image?.caption = \"四月，番茄开了第一朵花\"\n        after.image?.altText = \"番茄的叶子和第一朵花\"\n        return after\n      }\n      if article.marks[block.id] != nil, block.table?.rows == balconyTableRows {\n        var after = block\n        after.table?.rows = [\n          [\"月份\", \"作物\", \"备注\"], [\"三月\", \"薄荷\", \"长得很慢\"], [\"四月\", \"番茄\", \"每天浇水\"], [\"五月\", \"罗勒\", \"摘了一把做青酱\"],\n          [\"六月\", \"辣椒\", \"刚移栽，还没开花\"],\n        ]\n        after.table?.rowIDs.append(UUID())\n        after.table?.columnIDs.remove(at: 2)\n        return after\n      }\n      return suggestions.first(where: { $0.blockID == block.id })?.afterBlock ?? block\n    }\n  }\n\n  private static func date(_ day: Int) -> Date {\n    Calendar(identifier: .gregorian).date(\n      from: DateComponents(year: 2026, month: 11, day: day, hour: 20))!\n  }\n\n  private static let balconyTableRows = [\n    [\"月份\", \"作物\", \"状态\", \"备注\"], [\"三月\", \"薄荷\", \"发芽\", \"我觉得长得非常非常慢\"],\n    [\"四月\", \"番茄\", \"开花\", \"其实每天都要浇水\"], [\"五月\", \"罗勒\", \"收获\", \"摘了一把做青酱\"],\n  ]\n\n  private static func version(\n    for article: Article, title: String, date: Date, blocks: [DocumentBlock]\n  ) -> ArticleVersion {\n    var snapshot = article\n    snapshot.updatedAt = date\n    snapshot.blocks = blocks\n    snapshot.marks = snapshot.marks.filter { id, _ in blocks.contains { $0.id == id } }\n    if snapshot != article { snapshot.revisionID = UUID() }\n    return ArticleVersion(title: title, date: date, document: snapshot)\n  }\n\n  private static func styled(\n    _ block: DocumentBlock, spans: [(String, TextStyle)] = [],\n    paragraph: ((inout ParagraphStyle) -> Void)? = nil\n  ) -> DocumentBlock {\n    var styled = block\n    var content = block.text\n    if let paragraph { paragraph(&content.paragraphStyle) }\n    for (fragment, style) in spans {\n      let range = (content.string as NSString).range(of: fragment)\n      if range.location != NSNotFound {\n        content.runs.append(\n          RichTextRun(range: range, style: style, paragraphStyle: content.paragraphStyle))\n      }\n    }\n    styled.text = content\n    return styled\n  }\n\n  private static func listItem(_ value: String, number: Int? = nil) -> DocumentBlock {\n    styled(text(value)) {\n      $0.list = ListStyle(\n        marker: number == nil ? .bullet : .decimal, startingItemNumber: number ?? 1)\n      $0.headIndent = 24\n      $0.firstLineHeadIndent = 0\n    }\n  }\n\n  private static let textSuggestions: [String: String] = [\n    \"番茄开花之后，我每天早上起来的第一件事情，就是去阳台上面看看它有没有结果。\": \"番茄开花后，我每天起床第一件事，就是去阳台看看它结果了没有。\",\n    \"去年冬天，我发现自己已经记不清上个月都做过一些什么事情了。日子一天一天地过去，好像什么都没有留下来。我想给自己留一点证据，证明这些日子我真的认真活过。\":\n      \"去年冬天，我发现自己记不清上个月做过什么。日子一天天过去，好像什么都没留下。我想给自己留一点证据，证明这些日子我真的认真活过。\",\n    \"我发现我其实是一个非常非常容易被小事打动的人，比如楼下面包店每天早上七点准时飘出来的那种香味，还有地铁上一个陌生人很认真地给我让了座。\":\n      \"我发现自己很容易被小事打动：楼下面包店每天七点准时飘出的香味，地铁上一个陌生人认真地给我让座。\",\n    \"欢迎你加入我们团队！在接下来的几周里，你可能会收到非常多的信息，这是完全正常的事情，不用担心。\": \"欢迎加入我们！接下来几周，信息可能有点多，别担心，慢慢来。\",\n    \"第一周你不需要急着去写代码。我们更希望你先花一些时间去了解我们的产品是怎么被用户使用的，然后再去看代码。\": \"第一周不用急着写代码。先看看用户怎样使用我们的产品，再去读代码。\",\n    \"遇到不懂的问题，请随时在群里提问。在这里没有人会觉得你的问题很笨，我们每个人都是这样过来的。\": \"遇到不懂的，随时在群里问。这里没人会觉得你的问题很笨——我们都是这样过来的。\",\n    \"回家以后我把那张电影票夹回了诗集里面，我觉得它应该是属于那本书的。\": \"回家后，我把电影票夹回诗集。它本来就属于那本书。\",\n    \"后来我又去过几次那家书店，老板还是不太说话，但是有一次他非常主动地给我推荐了一本书，我觉得这件事情让我非常开心。\":\n      \"后来又去了几次。老板话还是不多。有一天，他从柜台后递来一本书：“你可能会喜欢。”\",\n    \"I started keeping a notebook last spring, mostly because I kept forgetting the small things that I really wanted to remember.\":\n      \"I started keeping a notebook last spring because I kept forgetting the small things I wanted to remember.\",\n  ]\n}\n", "App/Preview/DemoImageResolver.swift": "import AppKit\nimport SwiftUI\n\n/// Sample illustrations are demo resources, never a fallback for a missing document image.\n@MainActor\nfinal class DemoImageResolver: DocumentImageResolving {\n  private var images: [String: NSImage] = [:]\n\n  func image(for assetName: String) -> NSImage? {\n    if let image = images[assetName] { return image }\n    guard [\"sample-balcony\", \"sample-basil\", \"sample-tomato\"].contains(assetName) else {\n      return NSImage(named: assetName)\n    }\n    let size =\n      assetName == \"sample-basil\"\n      ? CGSize(width: 1000, height: 750) : CGSize(width: 1200, height: 800)\n    let renderer = ImageRenderer(\n      content: SamplePlantIllustration(asset: assetName).frame(\n        width: size.width, height: size.height))\n    guard let image = renderer.nsImage else { return nil }\n    images[assetName] = image\n    return image\n  }\n}\n\n/// The prototype's own illustrations, drawn with the same neutral paper and leaf palette.\nprivate struct SamplePlantIllustration: View {\n  let asset: String\n\n  var body: some View {\n    Canvas { context, size in\n      let basil = asset == \"sample-basil\"\n      let width: CGFloat = basil ? 1000 : 1200\n      let height: CGFloat = basil ? 750 : 800\n      context.scaleBy(x: size.width / width, y: size.height / height)\n\n      func color(_ rgb: UInt32) -> Color {\n        Color(\n          red: Double((rgb >> 16) & 255) / 255, green: Double((rgb >> 8) & 255) / 255,\n          blue: Double(rgb & 255) / 255)\n      }\n      func rect(_ x: CGFloat, _ y: CGFloat, _ w: CGFloat, _ h: CGFloat, _ rgb: UInt32) {\n        context.fill(Path(CGRect(x: x, y: y, width: w, height: h)), with: .color(color(rgb)))\n      }\n      func leaf(\n        _ x: CGFloat, _ y: CGFloat, _ rx: CGFloat, _ ry: CGFloat, _ rotation: Double, _ rgb: UInt32\n      ) {\n        var leafContext = context\n        leafContext.translateBy(x: x, y: y)\n        leafContext.rotate(by: .degrees(rotation))\n        leafContext.fill(\n          Path(ellipseIn: CGRect(x: -rx, y: -ry, width: rx * 2, height: ry * 2)),\n          with: .color(color(rgb)))\n      }\n      func line(_ points: [CGPoint], _ stroke: CGFloat, _ rgb: UInt32) {\n        var path = Path()\n        if let first = points.first { path.move(to: first) }\n        for point in points.dropFirst() { path.addLine(to: point) }\n        context.stroke(\n          path, with: .color(color(rgb)), style: StrokeStyle(lineWidth: stroke, lineCap: .round))\n      }\n      func pot(\n        _ x: CGFloat, _ bottom: CGFloat, _ w: CGFloat, _ h: CGFloat, _ body: UInt32, _ rim: UInt32\n      ) {\n        var shape = Path()\n        shape.move(to: CGPoint(x: x - w / 2, y: bottom - h))\n        shape.addLine(to: CGPoint(x: x + w / 2, y: bottom - h))\n        shape.addLine(to: CGPoint(x: x + w * 0.38, y: bottom))\n        shape.addLine(to: CGPoint(x: x - w * 0.38, y: bottom))\n        shape.closeSubpath()\n        context.fill(shape, with: .color(color(body)))\n        rect(x - w / 2 - 8, bottom - h - 16, w + 16, 22, rim)\n      }\n\n      if basil {\n        rect(0, 0, 1000, 750, 0xEEE9E0)\n        leaf(500, 700, 300, 60, 0, 0xD9CFC1)\n        line([CGPoint(x: 500, y: 700), CGPoint(x: 504, y: 420)], 12, 0x7C937A)\n        leaf(420, 470, 92, 50, -30, 0x8AA287)\n        leaf(590, 470, 92, 50, 30, 0x7D977B)\n        leaf(440, 360, 74, 40, -46, 0x98AE95)\n        leaf(570, 360, 74, 40, 46, 0x8AA287)\n        leaf(505, 300, 34, 60, 0, 0xA4B8A1)\n      } else if asset == \"sample-tomato\" {\n        rect(0, 0, 1200, 800, 0xE9E3D8)\n        leaf(980, 150, 230, 230, 0, 0xF0EBE1)\n        line(\n          [CGPoint(x: 600, y: 800), CGPoint(x: 610, y: 520), CGPoint(x: 652, y: 340)], 16, 0x7C937A)\n        line([CGPoint(x: 626, y: 470), CGPoint(x: 400, y: 470)], 10, 0x7C937A)\n        line([CGPoint(x: 634, y: 420), CGPoint(x: 860, y: 410)], 10, 0x7C937A)\n        leaf(420, 450, 80, 34, -18, 0x8EA48B)\n        leaf(360, 520, 70, 30, 24, 0x7E977C)\n        leaf(500, 520, 64, 28, -40, 0x9AB098)\n        leaf(840, 390, 84, 34, 16, 0x8EA48B)\n        leaf(900, 470, 70, 30, -26, 0x7E977C)\n        leaf(760, 460, 60, 26, 36, 0x9AB098)\n        leaf(560, 640, 90, 36, -30, 0x87A085)\n        leaf(700, 660, 90, 34, 28, 0x93A891)\n        for angle in stride(from: 0.0, to: 360.0, by: 72) {\n          let radians = angle * .pi / 180\n          leaf(\n            652 + CGFloat(sin(radians)) * 34, 340 - CGFloat(cos(radians)) * 34, 16, 34, angle,\n            0xE4CF8F)\n        }\n        leaf(652, 340, 14, 14, 0, 0xC9AD62)\n        rect(0, 740, 1200, 60, 0xC3A083)\n        rect(0, 728, 1200, 18, 0xB5916F)\n      } else {\n        rect(0, 0, 1200, 800, 0xECE6DC)\n        rect(120, 70, 960, 460, 0xE2E8EA)\n        rect(170, 300, 150, 230, 0xD2D9DC)\n        rect(340, 250, 110, 280, 0xD8DEE0)\n        rect(760, 280, 170, 250, 0xD2D9DC)\n        rect(950, 340, 90, 190, 0xD8DEE0)\n        leaf(880, 160, 46, 46, 0, 0xF1EDE4)\n        context.stroke(\n          Path(CGRect(x: 120, y: 70, width: 960, height: 460)), with: .color(color(0xCBC2B4)),\n          lineWidth: 18)\n        rect(591, 70, 18, 460, 0xCBC2B4)\n        rect(0, 640, 1200, 160, 0xD8CDBD)\n        rect(60, 548, 1080, 12, 0xB5AB9D)\n        for index in 0..\u003c19 { rect(CGFloat(86 + index * 58), 556, 6, 88, 0xBFB6A9) }\n        rect(0, 636, 1200, 8, 0xC6BBAB)\n        pot(300, 720, 150, 120, 0xC39B7E, 0xB58D70)\n        leaf(270, 520, 26, 62, -24, 0x93A891)\n        leaf(330, 515, 24, 58, 22, 0x829A80)\n        leaf(300, 490, 22, 60, 0, 0x9CB09A)\n        pot(600, 724, 170, 128, 0xB98F72, 0xAB8366)\n        rect(597, 440, 6, 150, 0x7F967D)\n        leaf(560, 470, 30, 14, -30, 0x879D84)\n        leaf(640, 500, 32, 14, 28, 0x93A891)\n        leaf(565, 540, 28, 13, -18, 0x7B937A)\n        leaf(636, 440, 26, 12, 24, 0x9CB09A)\n        pot(890, 720, 140, 110, 0xC6A386, 0xB8957A)\n        leaf(860, 560, 20, 40, -40, 0x9CB09A)\n        leaf(920, 560, 20, 40, 40, 0x879D84)\n        leaf(890, 545, 18, 44, 0, 0x93A891)\n        rect(1010, 614, 96, 86, 0xA3A39F)\n        line([CGPoint(x: 1020, y: 640), CGPoint(x: 964, y: 600)], 12, 0xA3A39F)\n      }\n    }\n  }\n}\n", "App/Editor/NativeRichText.swift": "import AppKit\nimport RedraftCore\nimport SwiftUI\n\n/// AppKit owns only the live input session; document content is written back through the binding.\nstruct NativeRichText: NSViewRepresentable {\n  var content: () -> RichTextContent\n  var onCommit: (NSAttributedString, RichTextContent) -> Bool\n  @Binding var measuredHeight: CGFloat\n  var blockID: UUID\n  var session: EditorSession\n  var selection: NSRange? = nil\n  var editable: Bool\n  var onSelection: (NSRange) -> Void\n  var onImageTransfer: (ImageTransferPayload) -> Void = { _ in }\n  var focusOnMount = false\n\n  func makeCoordinator() -> Coordinator { Coordinator(self) }\n\n  func makeNSView(context: Context) -> BlockTextView {\n    let view = BlockTextView(usingTextLayoutManager: true)\n    view.delegate = context.coordinator\n    view.blockID = blockID\n    view.editorSession = session\n    view.drawsBackground = false\n    view.isRichText = true\n    view.isEditable = editable\n    view.isSelectable = true\n    view.allowsUndo = true\n    view.isAutomaticQuoteSubstitutionEnabled = true\n    view.isAutomaticDashSubstitutionEnabled = true\n    view.isContinuousSpellCheckingEnabled = true\n    view.isAutomaticSpellingCorrectionEnabled = false\n    view.isHorizontallyResizable = false\n    view.isVerticallyResizable = true\n    view.textContainerInset = .zero\n    view.textContainer?.lineFragmentPadding = 0\n    view.textContainer?.widthTracksTextView = true\n    view.minSize = NSSize(width: 0, height: 34)\n    view.maxSize = NSSize(\n      width: CGFloat.greatestFiniteMagnitude, height: CGFloat.greatestFiniteMagnitude)\n    view.typingAttributes = EditorTypography.bodyAttributes\n    view.textStorage?.setAttributedString(RichTextBridge.attributedString(from: content()))\n    view.setAccessibilityLabel(\"正文段落\")\n    view.heightChanged = { [weak coordinator = context.coordinator] height in\n      coordinator?.updateHeight(height)\n    }\n    view.selectionChanged = { [weak coordinator = context.coordinator] range in\n      coordinator?.parent.onSelection(range)\n    }\n    view.imageTransferred = { [weak coordinator = context.coordinator] payload in\n      coordinator?.parent.onImageTransfer(payload)\n    }\n    view.compositionCommitted = { [weak coordinator = context.coordinator, weak view] in\n      guard let view else { return }\n      coordinator?.commit(view)\n    }\n    view.shouldFocusOnMount = { [weak coordinator = context.coordinator] in\n      coordinator?.parent.focusOnMount == true\n    }\n    return view\n  }\n\n  func updateNSView(_ view: BlockTextView, context: Context) {\n    context.coordinator.parent = self\n    view.isEditable = editable\n    view.blockID = blockID\n    view.editorSession = session\n    if !view.hasMarkedText() {\n      context.coordinator.baseContent = content()\n      let displayed = RichTextBridge.attributedString(from: context.coordinator.baseContent)\n      context.coordinator.isSynchronizing = true\n      if !view.attributedString().isEqual(to: displayed) {\n        view.textStorage?.setAttributedString(displayed)\n      }\n      if let requested = selection {\n        let location = min(max(0, requested.location), displayed.length)\n        let bounded = NSRange(\n          location: location, length: min(max(0, requested.length), displayed.length - location))\n        if view.selectedRange() != bounded { view.setSelectedRange(bounded) }\n      }\n      context.coordinator.isSynchronizing = false\n      DispatchQueue.main.async { [weak view] in\n        guard let view else { return }\n        view.editorSession?.refresh(from: view)\n      }\n    }\n    view.needsLayout = true\n  }\n\n  @MainActor final class Coordinator: NSObject, NSTextViewDelegate {\n    var parent: NativeRichText\n    var isSynchronizing = false\n    var baseContent: RichTextContent\n\n    init(_ parent: NativeRichText) {\n      self.parent = parent\n      baseContent = parent.content()\n    }\n\n    func textDidChange(_ notification: Notification) {\n      guard !isSynchronizing, let view = notification.object as? BlockTextView else { return }\n      commit(view)\n    }\n\n    func commit(_ view: BlockTextView) {\n      guard !isSynchronizing, !view.hasMarkedText() else { return }\n      let accepted = parent.onCommit(\n        NSAttributedString(attributedString: view.attributedString()), baseContent)\n      // Read the authoritative result immediately: rapid consecutive keystrokes need not wait\n      // for SwiftUI's next render before submitting against the new base.\n      baseContent = parent.content()\n      if !accepted {\n        isSynchronizing = true\n        let displayed = RichTextBridge.attributedString(from: baseContent)\n        let location = min(view.selectedRange().location, displayed.length)\n        view.textStorage?.setAttributedString(displayed)\n        view.setSelectedRange(NSRange(location: location, length: 0))\n        isSynchronizing = false\n      }\n      parent.onSelection(view.selectedRange())\n      parent.session.refresh(from: view)\n      view.needsLayout = true\n    }\n\n    func textViewDidChangeSelection(_ notification: Notification) {\n      guard !isSynchronizing, let view = notification.object as? BlockTextView,\n        view.window?.firstResponder === view\n      else { return }\n      guard !view.hasMarkedText() else { return }\n      parent.onSelection(view.selectedRange())\n      parent.session.refresh(from: view)\n    }\n\n    func updateHeight(_ height: CGFloat) {\n      guard abs(parent.measuredHeight - height) > 0.5 else { return }\n      DispatchQueue.main.async { [weak self] in self?.parent.measuredHeight = height }\n    }\n  }\n}\n\n@MainActor final class BlockTextView: NSTextView {\  model: model,\n                  change: change,\n                  instruction: article.marks[block.id] ?? \"改稿建议\",\n                  index: (article.changes.firstIndex(where: { $0.id == change.id }) ?? 0) + 1\n                )\n                .id(change.id)\n              }\n            }\n          }\n\n          HStack {\n            let undecided = article.changes.filter { $0.decision == nil }.count\n            Text(undecided == 0 ? \"每一处都已取舍\" : \"还有 \\(undecided) 处等待取舍\")\n              .font(.callout)\n              .foregroundStyle(.secondary)\n            Spacer()\n            Button(\"完成审阅\") { model.completeReview() }\n              .buttonStyle(.borderedProminent)\n              .disabled(undecided > 0)\n          }\n          .padding(.top, 12)\n        }\n        .padding(.horizontal, 34)\n        .padding(.vertical, 32)\n        .frame(maxWidth: 780)\n        .frame(maxWidth: .infinity)\n      }\n      .onChange(of: model.state.selectedChangeID) { id in\n        if let id { scroll.scrollTo(id, anchor: .center) }\n      }\n      .onAppear {\n        if let id = model.state.selectedChangeID { scroll.scrollTo(id, anchor: .center) }\n      }\n    }\n  }\n\n  private func navigationButtons(_ article: ArticleViewState) -> some View {\n    let index = article.changes.firstIndex { $0.id == model.state.selectedChangeID } ?? 0\n    return HStack(spacing: 3) {\n      Button {\n        model.selectChange(article.changes[max(0, index - 1)].id)\n      } label: {\n        Image(systemName: \"chevron.up\").frame(width: 26, height: 24)\n      }\n      .disabled(index == 0)\n      .help(\"上一处修改 · K\")\n      .accessibilityLabel(\"上一处修改\")\n      Button {\n        model.selectChange(article.changes[min(article.changes.count - 1, index + 1)].id)\n      } label: {\n        Image(systemName: \"chevron.down\").frame(width: 26, height: 24)\n      }\n      .disabled(index == article.changes.count - 1)\n      .help(\"下一处修改 · J\")\n      .accessibilityLabel(\"下一处修改\")\n    }\n    .buttonStyle(.plain)\n  }\n}\n\nprivate struct ChangeReviewRow: View {\n  @ObservedObject var model: WorkspaceViewModel\n  let change: ReviewChange\n  let instruction: String\n  let index: Int\n\n  private var selected: Bool { model.state.selectedChangeID == change.id }\n\n  var body: some View {\n    VStack(alignment: .leading, spacing: 14) {\n      HStack(spacing: 8) {\n        ReviewTag(title: instruction).lineLimit(1).help(instruction)\n        if change.kind != .text {\n          Text(kindTitle).font(.caption).foregroundStyle(.secondary)\n        }\n        Spacer()\n        if let decision = change.decision {\n          Label(decision.title, systemImage: \"checkmark.circle.fill\")\n            .font(.caption)\n            .foregroundStyle(PaperTheme.accent)\n        }\n        Text(String(format: \"%02d\", index))\n          .font(.system(.caption, design: .monospaced))\n          .foregroundStyle(.secondary)\n      }\n\n      if change.kind == .text {\n        textComparison\n      } else {\n        blockComparison\n      }\n\n      if change.decision == .rewrite, !change.rewrittenText.isEmpty {\n        VStack(alignment: .leading, spacing: 5) {\n          Text(\"你的改写\").font(.caption).foregroundStyle(.secondary)\n          Text(change.rewrittenText).font(.system(size: 16)).lineSpacing(8)\n        }\n      }\n\n      if selected {\n        Text(change.explanation)\n          .font(.callout)\n          .foregroundStyle(.secondary)\n          .fixedSize(horizontal: false, vertical: true)\n        ReviewDecisionButtons(model: model, change: change)\n      }\n    }\n    .padding(16)\n    .frame(maxWidth: .infinity, alignment: .leading)\n    .background(selected ? PaperTheme.fill : Color.clear, in: RoundedRectangle(cornerRadius: 8))\n    .overlay(alignment: .leading) {\n      if selected {\n        RoundedRectangle(cornerRadius: 2).fill(PaperTheme.accent).frame(width: 3).padding(\n          .vertical, 12)\n      }\n    }\n    .contentShape(Rectangle())\n    .onTapGesture { model.selectChange(change.id) }\n    .focusable(selected)\n    .accessibilityElement(children: .contain)\n    .accessibilityLabel(\"第 \\(index) 处修改，\\(change.decision?.title ?? \"待取舍\")\")\n    .accessibilityAddTraits(selected ? .isSelected : [])\n    .accessibilityAction(named: \"选中修改\") { model.selectChange(change.id) }\n    .accessibilityAction(named: \"采用\") { model.decide(.accept, changeID: change.id) }\n    .accessibilityAction(named: \"保留原文\") { model.decide(.keep, changeID: change.id) }\n  }\n\n  private var kindTitle: String {\n    switch change.kind {\n    case .text: \"文字\"\n    case .image: \"图片替换\"\n    case .tableRow: \"表格行\"\n    case .tableColumn: \"表格列\"\n    }\n  }\n\n  @ViewBuilder private var textComparison: some View {\n    if model.state.diffLayout == .sideBySide {\n      ReviewComparisonLayout {\n        labeledText(\"送审稿\", text: change.before, inserted: false)\n        labeledText(\"改稿建议\", text: change.after, inserted: true)\n      }\n    } else {\n      VStack(alignment: .leading, spacing: 7) {\n        ChangedText(text: change.before, inserted: false)\n        ChangedText(text: change.after, inserted: true)\n      }\n    }\n  }\n\n  private func labeledText(_ label: String, text: String, inserted: Bool) -> some View {\n    VStack(alignment: .leading, spacing: 7) {\n      Text(label).font(.caption).foregroundStyle(.secondary)\n      ChangedText(text: text, inserted: inserted)\n    }\n    .frame(maxWidth: .infinity, alignment: .leading)\n    .fixedSize(horizontal: false, vertical: true)\n  }\n\n  private var blockComparison: some View {\n    VStack(alignment: .leading, spacing: 14) {\n      if change.kind == .image {\n        HStack(alignment: .top, spacing: 14) {\n          blockSide(change.beforeBlock, text: change.before, title: \"原图\", inserted: false)\n          blockSide(change.afterBlock, text: change.after, title: \"建议替换\", inserted: true)\n        }\n      } else {\n        blockSide(change.beforeBlock, text: change.before, title: \"送审稿\", inserted: false)\n        blockSide(change.afterBlock, text: change.after, title: \"改稿建议\", inserted: true)\n      }\n    }\n  }\n\n  private func blockSide(_ block: DocumentBlock?, text: String, title: String, inserted: Bool)\n    -> some View\n  {\n    VStack(alignment: .leading, spacing: 8) {\n      Text(title).font(.caption).foregroundStyle(.secondary)\n      if let block {\n        SnapshotBlockView(block: block)\n          .padding(8)\n          .background((inserted ? PaperTheme.insertion : PaperTheme.deletion).opacity(0.06))\n      } else {\n        ChangedText(text: text, inserted: inserted)\n      }\n    }\n    .frame(maxWidth: .infinity, alignment: .leading)\n  }\n}\n\n/// Use the available reading width, not a sentence's unwrapped ideal width, to choose columns.\nprivate struct ReviewComparisonLayout: Layout {\n  private let minimumWidth: CGFloat = 420\n  private let spacing: CGFloat = 16\n\n  func sizeThatFits(proposal: ProposedViewSize, subviews: Subviews, cache: inout ()) -> CGSize {\n    let proposedWidth = proposal.width ?? minimumWidth\n    let width = proposedWidth.isFinite ? max(0, proposedWidth) : minimumWidth\n    let columns = width >= minimumWidth\n    let columnWidth = columns ? max(0, (width - spacing) / 2) : width\n    let sizes = subviews.map { $0.sizeThatFits(ProposedViewSize(width: columnWidth, height: nil)) }\n    let height =\n      columns ? sizes.map(\\.height).max() ?? 0 : sizes.reduce(0) { $0 + $1.height } + spacing\n    return CGSize(width: width, height: height)\n  }\n\n  func placeSubviews(\n    in bounds: CGRect, proposal: ProposedViewSize, subviews: Subviews, cache: inout ()\n  ) {\n    let columns = bounds.width >= minimumWidth\n    let columnWidth = columns ? max(0, (bounds.width - spacing) / 2) : bounds.width\n    let childProposal = ProposedViewSize(width: columnWidth, height: nil)\n    var y = bounds.minY\n    for (index, subview) in subviews.enumerated() {\n      let x = columns ? bounds.minX + CGFloat(index) * (columnWidth + spacing) : bounds.minX\n      subview.place(at: CGPoint(x: x, y: y), anchor: .topLeading, proposal: childProposal)\n      if !columns { y += subview.sizeThatFits(childProposal).height + spacing }\n    }\n  }\n}\n", "App/Review/HistoryView.swift": "import RedraftCore\nimport SwiftUI\n\nstruct HistoryView: View {\n  @ObservedObject var model: WorkspaceViewModel\n\n  var body: some View {\n    VStack(spacing: 0) {\n      if let article = model.currentArticle, !article.versions.isEmpty {\n        comparisonBar(article)\n        Divider()\n        ScrollView {\n          VStack(alignment: .leading, spacing: 24) {\n            Text(article.title.isEmpty ? \"无标题\" : article.title)\n              .font(.system(size: 29, weight: .semibold))\n            Text(\"版本内容对照 · 按段落展示\")\n              .font(.caption)\n              .foregroundStyle(.secondary)\n\n            if let from = model.historyFrom, let to = model.historyTo {\n              snapshots(from: from, to: to)\n            } else {\n              Text(\"选择两份版本，回看文字的变化。\")\n                .foregroundStyle(.secondary)\n            }\n          }\n          .padding(.horizontal, 34)\n          .padding(.vertical, 32)\n          .frame(maxWidth: 780)\n          .frame(maxWidth: .infinity, alignment: .top)\n        }\n      } else {\n        ReviewEmptyState(\n          symbol: \"clock.arrow.circlepath\",\n          title: \"还没有历史版本\",\n          detail: \"留下一份当前稿，之后可以回来看。\",\n          actionTitle: \"留存当前版本\",\n          action: { model.saveVersion() }\n        )\n      }\n    }\n    .background(PaperTheme.paper)\n  }\n\n  private func comparisonBar(_ article: ArticleViewState) -> some View {\n    ViewThatFits(in: .horizontal) {\n      HStack(spacing: 12) {\n        versionPickers(article)\n        Spacer(minLength: 12)\n        Toggle(\"只看改动\", isOn: $model.state.onlyChanges).toggleStyle(.checkbox)\n      }\n      VStack(alignment: .leading, spacing: 10) {\n        versionPickers(article)\n        Toggle(\"只看改动\", isOn: $model.state.onlyChanges).toggleStyle(.checkbox)\n      }\n    }\n    .font(.callout)\n    .padding(.horizontal, 24)\n    .padding(.vertical, 12)\n    .background(NativeMaterial(material: .headerView))\n  }\n\n  private func versionPickers(_ article: ArticleViewState) -> some View {\n    HStack(spacing: 10) {\n      Picker(\"从\", selection: $model.state.historyFromID) {\n        ForEach(article.versions) { version in\n          Text(version.title).tag(Optional(version.id))\n        }\n      }\n      .frame(maxWidth: 220)\n      Button {\n        model.swapHistoryVersions()\n      } label: {\n        Image(systemName: \"arrow.left.arrow.right\")\n      }\n      .buttonStyle(.plain)\n      .help(\"交换两个版本\")\n      .accessibilityLabel(\"交换两个版本\")\n      Picker(\"到\", selection: $model.state.historyToID) {\n        ForEach(article.versions) { version in\n          Text(version.title).tag(Optional(version.id))\n        }\n      }\n      .frame(maxWidth: 220)\n    }\n  }\n\n  private func snapshots(from: ArticleVersion, to: ArticleVersion) -> some View {\n    let rows = snapshotRows(from: from, to: to)\n    let changed = rows.filter { $0.before != $0.after }\n    let shown = model.state.onlyChanges ? changed : rows\n    return VStack(alignment: .leading, spacing: 22) {\n      if from.id == to.id {\n        Text(\"同一稿，没有差异。\")\n          .font(.callout).foregroundStyle(.secondary)\n      } else if changed.isEmpty {\n        Text(\"这两稿的内容相同。\")\n          .font(.callout).foregroundStyle(.secondary)\n      }\n      if model.state.onlyChanges, rows.count > changed.count {\n        Button {\n          model.state.onlyChanges = false\n        } label: {\n          Label(\"展开 \\(rows.count - changed.count) 个未改动的段落\", systemImage: \"ellipsis\")\n            .font(.caption)\n        }\n        .buttonStyle(.plain)\n        .foregroundStyle(.secondary)\n      }\n      ForEach(shown) { row in\n        HistoryBlockRow(row: row)\n      }\n    }\n  }\n\n  // This is a snapshot presentation, not the future word-level TextDiffing implementation.\n  private func snapshotRows(from: ArticleVersion, to: ArticleVersion) -> [SnapshotRow] {\n    var blockIDs = to.blocks.map(\\.id)\n    let remainingIDs = Set(blockIDs)\n    // Keep new blocks in their reading position. Deleted blocks precede their next surviving neighbor.\n    for (index, block) in from.blocks.enumerated() where !remainingIDs.contains(block.id) {\n      let successor = from.blocks.dropFirst(index + 1).first { remainingIDs.contains($0.id) }\n      let insertion = successor.flatMap { blockIDs.firstIndex(of: $0.id) } ?? blockIDs.endIndex\n      blockIDs.insert(block.id, at: insertion)\n    }\n    return blockIDs.map { id in\n      SnapshotRow(\n        id: id,\n        before: from.blocks.first(where: { $0.id == id }),\n        after: to.blocks.first(where: { $0.id == id })\n      )\n    }\n  }\n}\n\nprivate struct SnapshotRow: Identifiable {\n  let id: UUID\n  let before: DocumentBlock?\n  let after: DocumentBlock?\n}\n\nprivate struct HistoryBlockRow: View {\n  let row: SnapshotRow\n\n  var body: some View {\n    VStack(alignment: .leading, spacing: 12) {\n      if row.before == row.after, let block = row.after {\n        SnapshotBlockView(block: block).opacity(0.65)\n      } else if let before = row.before, let after = row.after {\n        if before.kind == .text, after.kind == .text {\n          if before.plainText == after.plainText {\n            ReviewTag(title: \"格式\")\n            SnapshotBlockView(block: after)\n          } else {\n            ChangedText(text: before.plainText, inserted: false)\n            ChangedText(text: after.plainText, inserted: true)\n          }\n        } else {\n          HStack {\n            ReviewTag(title: before.kind == .image ? \"图片\" : \"表格\")\n            Text(\"内容变化\").font(.caption).foregroundStyle(.secondary)\n          }\n          snapshot(before, inserted: false)\n          snapshot(after, inserted: true)\n        }\n      } else if let block = row.after {\n        ReviewTag(title: \"新增\", color: PaperTheme.insertion)\n        snapshot(block, inserted: true)\n      } else if let block = row.before {\n        ReviewTag(title: \"删去\", color: PaperTheme.deletion)\n        snapshot(block, inserted: false)\n      }\n    }\n    .padding(.vertical, 8)\n  }\n\n  private func snapshot(_ block: DocumentBlock, inserted: Bool) -> some View {\n    VStack(alignment: .leading, spacing: 8) {\n      Text(inserted ? \"改后\" : \"改前\").font(.caption).foregroundStyle(.secondary)\n      SnapshotBlockView(block: block)\n    }\n    .padding(12)\n    .frame(maxWidth: .infinity, alignment: .leading)\n    .background((inserted ? PaperTheme.insertion : PaperTheme.deletion).opacity(0.06))\n  }\n}\n", "App/Review/InspectorView.swift": "import RedraftCore\nimport SwiftUI\n\nstruct InspectorView: View {\n  @ObservedObject var model: WorkspaceViewModel\n\n  var body: some View {\n    VStack(spacing: 0) {\n      header\n      Divider()\n      if model.currentArticle == nil {\n        ReviewEmptyState(symbol: \"doc.text\", title: \"选择一篇文章\", detail: \"\")\n      } else {\n        switch model.state.mode {\n        case .writing:\n          if model.state.inspectorTab == .marks {\n            marksInspector\n          } else {\n            provenanceInspector\n          }\n        case .review:\n          reviewInspector\n        case .history:\n          historyInspector\n        }\n      }\n    }\n    .background(NativeMaterial(material: .sidebar))\n    .accessibilityElement(children: .contain)\n    .accessibilityLabel(\"检查器\")\n  }\n\n  private var header: some View {\n    HStack(spacing: 12) {\n      if model.state.mode == .writing {\n        Picker(\"检查器内容\", selection: $model.state.inspectorTab) {\n          Text(\"改稿\").tag(InspectorTab.marks)\n          Text(\"来历\").tag(InspectorTab.provenance)\n        }\n        .pickerStyle(.segmented)\n        .labelsHidden()\n        .frame(maxWidth: 180)\n      } else {\n        Text(model.state.mode == .review ? \"当前修改\" : \"版本时间线\")\n          .font(.system(size: 13, weight: .semibold))\n      }\n      Spacer(minLength: 0)\n      Button {\n        model.state.inspectorVisible = false\n      } label: {\n        Image(systemName: \"xmark\").font(.system(size: 11, weight: .medium))\n      }\n      .buttonStyle(.plain)\n      .foregroundStyle(.secondary)\n      .help(\"隐藏检查器\")\n      .accessibilityLabel(\"隐藏检查器\")\n    }\n    .padding(.horizontal, 18)\n    .frame(height: 49)\n  }\n\n  private var marksInspector: some View {\n    VStack(spacing: 0) {\n      ScrollView {\n        VStack(alignment: .leading, spacing: 18) {\n          if let article = model.currentArticle {\n            if article.phase == .running {\n              HStack(spacing: 10) {\n                ProgressView().controlSize(.small)\n                Text(\"正在演示改稿流程\").font(.callout)\n              }\n            } else if article.phase == .ready {\n              Label(\"\\(article.changes.count) 处建议等待审阅\", systemImage: \"checkmark.circle\")\n                .font(.callout)\n                .foregroundStyle(.secondary)\n            }\n            if article.marks.isEmpty {\n              Text(\"没有标记的段落\")\n                .font(.callout).foregroundStyle(.secondary)\n              Text(\"在正文中选中一段文字，再点工具栏的“标记”。\")\n                .font(.caption).foregroundStyle(.secondary).lineSpacing(5)\n            } else {\n              ForEach(article.blocks.filter { article.marks[$0.id] != nil }) { block in\n                markRow(block, instruction: article.marks[block.id] ?? \"更简洁\")\n              }\n            }\n          }\n        }\n        .padding(18)\n        .frame(maxWidth: .infinity, alignment: .leading)\n      }\n      if model.markedCount > 0 || model.currentArticle?.phase != .idle {\n        Divider()\n        Group {\n          if model.currentArticle?.phase == .running {\n            Button(\"取消改稿\") { model.cancelReview() }\n              .buttonStyle(.bordered)\n          } else if model.currentArticle?.phase == .ready {\n            Button(\"开始审阅\") { model.enterReview() }\n              .buttonStyle(.borderedProminent)\n          } else {\n            Button {\n              model.beginReview()\n            } label: {\n              Label(\"改稿 \\(model.markedCount)\", systemImage: \"sparkles\")\n            }\n            .buttonStyle(.borderedProminent)\n          }\n        }\n        .frame(maxWidth: .infinity)\n        .padding(18)\n      }\n    }\n  }\n\n  private func markRow(_ block: DocumentBlock, instruction: String) -> some View {\n    VStack(alignment: .leading, spacing: 10) {\n      Button {\n        model.selectBlock(block.id)\n      } label: {\n        HStack(alignment: .top, spacing: 8) {\n          RoundedRectangle(cornerRadius: 1).fill(PaperTheme.accent).frame(width: 2)\n          Text(block.plainText.isEmpty ? blockName(block) : block.plainText)\n            .font(.system(size: 13)).lineSpacing(5).lineLimit(3)\n            .multilineTextAlignment(.leading)\n            .frame(maxWidth: .infinity, alignment: .leading)\n        }\n        .fixedSize(horizontal: false, vertical: true)\n      }\n      .buttonStyle(.plain)\n      HStack {\n        Menu {\n          ForEach([\"更简洁\", \"更具体\", \"更顺口\", \"语气更自然\"], id: \\.self) { option in\n            Button(option) { model.markBlock(block.id, instruction: option) }\n          }\n          Divider()\n          Button(\"自定义要求…\") {\n            model.selectBlock(block.id)\n            model.state.customInstruction = instruction\n            model.state.sheet = .customMark\n          }\n        } label: {\n          Text(instruction).font(.caption).lineLimit(1)\n        }\n        .menuStyle(.borderlessButton)\n        .fixedSize(horizontal: false, vertical: true)\n        Spacer(minLength: 4)\n        Button {\n          model.unmarkBlock(block.id)\n        } label: {\n          Image(systemName: \"xmark.circle\").foregroundStyle(.secondary)\n        }\n        .buttonStyle(.plain)\n        .help(\"取消标记\")\n        .accessibilityLabel(\"取消标记\\(blockName(block))\")\n      }\n      .disabled(model.isEditorLocked)\n    }\n    .padding(11)\n    .background(\n      model.state.selectedBlockID == block.id ? PaperTheme.fill : Color.clear,\n      in: RoundedRectangle(cornerRadius: 6))\n  }\n\n  private var reviewInspector: some View {\n    Group {\n      if let change = model.currentChange {\n        ScrollView {\n          VStack(alignment: .leading, spacing: 20) {\n            inspectorSection(\"原来\") { ChangedText(text: change.before, inserted: false) }\n            inspectorSection(\"改稿建议\") { ChangedText(text: change.after, inserted: true) }\n            if !change.explanation.isEmpty {\n              Text(change.explanation).font(.callout).foregroundStyle(.secondary).lineSpacing(6)\n            }\n            Divider()\n            ReviewDecisionButtons(model: model, change: change, compact: true)\n            if let decision = change.decision {\n              Label(decision.title, systemImage: \"checkmark.circle.fill\")\n                .font(.caption).foregroundStyle(PaperTheme.accent)\n            }\n            if change.decision == .rewrite, !change.rewrittenText.isEmpty {\n              inspectorSection(\"你的改写\") {\n                Text(change.rewrittenText).font(.callout).lineSpacing(7)\n              }\n            }\n            TextField(\n              \"给这次取舍留一句说明\",\n              text: Binding(\n                get: { model.currentChange?.reason ?? \"\" },\n                set: { model.updateChangeReason($0, changeID: change.id) }\n              ), axis: .vertical\n            )\n            .textFieldStyle(.roundedBorder)\n            .lineLimit(3...6)\n          }\n          .padding(18)\n          .frame(maxWidth: .infinity, alignment: .leading)\n        }\n      } else {\n        ReviewEmptyState(\n          symbol: \"text.magnifyingglass\", title: \"选择一处修改\", detail: \"点正文中的修改，查看原句和建议。\")\n      }\n    }\n  }\n\n  private var historyInspector: some View {\n    ScrollView {\n      VStack(alignment: .leading, spacing: 2) {\n        Text(\"选择版本作为对比终点\")\n          .font(.caption).foregroundStyle(.secondary).padding(.bottom, 20)\n        if let article = model.currentArticle {\n          ForEach(Array(article.versions.reversed())) { version in\n            Button {\n              model.state.historyToID = version.id\n            } label: {\n              timelineEntry(version: version, selected: model.state.historyToID == version.id)\n            }\n            .buttonStyle(.plain)\n          }\n          if article.versions.isEmpty {\n            Text(\"还没有历史版本\").font(.callout).foregroundStyle(.secondary)\n          }\n        }\n      }\n      .padding(18)\n      .frame(maxWidth: .infinity, alignment: .leading)\n    }\n  }\n\n  private var provenanceInspector: some View {\n    ScrollView {\n      VStack(alignment: .leading, spacing: 20) {\n        if let article = model.currentArticle,\n          let blockID = model.state.selectedBlockID,\n          let block = article.blocks.first(where: { $0.id == blockID })\n        {\n          Text(block.plainText.isEmpty ? blockName(block) : block.plainText)\n            .font(.callout).lineSpacing(6)\n            .padding(12)\n            .frame(maxWidth: .infinity, alignment: .leading)\n            .background(PaperTheme.fill, in: RoundedRectangle(cornerRadius: 6))\n          Text(\"各版本中的同一段落\")\n            .font(.caption).foregroundStyle(.secondary)\n          let versions = article.versions.filter { version in\n            version.blocks.contains(where: { $0.id == blockID })\n          }\n          if versions.isEmpty {\n            Text(\"这段内容还没有留存在历史版本里。\")\n              .font(.callout).foregroundStyle(.secondary).lineSpacing(5)\n          } else {\n            ForEach(versions) { version in\n              VStack(alignment: .leading, spacing: 8) {\n                Label(version.title, systemImage: \"circle.fill\")\n                  .font(.caption).foregroundStyle(.secondary)\n                if let original = version.blocks.first(where: { $0.id == blockID }) {\n                  Text(original.plainText.isEmpty ? blockName(original) : original.plainText)\n                    .font(.callout).lineSpacing(6)\n                    .textSelection(.enabled)\n                }\n                Text(\n                  version.date,\n                  format: .dateTime.year().month().day().locale(Locale(identifier: \"zh_CN\"))\n                )\n                .font(.caption2).foregroundStyle(.tertiary)\n              }\n              .padding(.leading, 12)\n              .overlay(alignment: .leading) {\n                Rectangle().fill(PaperTheme.separator).frame(width: 1)\n              }\n            }\n          }\n        } else {\n          Text(\"把光标放在一段文字上\")\n            .font(.callout).foregroundStyle(.secondary)\n          Text(\"在这里回看它在各份版本中的样子。\")\n            .font(.caption).foregroundStyle(.secondary)\n        }\n      }\n      .padding(18)\n      .frame(maxWidth: .infinity, alignment: .leading)\n    }\n  }\n\n  private func timelineEntry(version: ArticleVersion, selected: Bool) -> some View {\n    HStack(alignment: .top, spacing: 12) {\n      VStack(spacing: 4) {\n        Circle().fill(selected ? PaperTheme.accent : Color.secondary.opacity(0.4))\n          .frame(width: 7, height: 7)\n        Rectangle().fill(PaperTheme.separator).frame(width: 1, height: 42)\n      }\n      .padding(.top, 5)\n      VStack(alignment: .leading, spacing: 6) {\n        Text(version.title).font(.system(size: 13, weight: selected ? .semibold : .regular))\n        Text(\n          version.date,\n          format: .dateTime.month().day().hour().minute().locale(Locale(identifier: \"zh_CN\"))\n        )\n        .font(.caption).foregroundStyle(.secondary)\n      }\n      Spacer(minLength: 0)\n      if selected {\n        Image(systemName: \"checkmark\").font(.caption).foregroundStyle(PaperTheme.accent)\n      }\n    }\n    .padding(9)\n    .background(selected ? PaperTheme.fill : Color.clear, in: RoundedRectangle(cornerRadius: 6))\n    .contentShape(Rectangle())\n  }\n\n  private func inspectorSection\u003cContent: View>(\n    _ title: String, @ViewBuilder content: () -> Content\n  ) -> some View {\n    VStack(alignment: .leading, spacing: 8) {\n      Text(title).font(.caption).foregroundStyle(.secondary)\n      content()\n    }\n  }\n\n  private func blockName(_ block: DocumentBlock) -> String {\n    switch block.kind {\n    case .text: \"空白段落\"\n    case .image: \"图片\"\n    case .table: \"表格\"\n    }\n  }\n}\n", "App/Shared/PaperTheme.swift": "import AppKit\nimport SwiftUI\n\nenum PaperTheme {\n  static let paper = Color(adaptive(\"paper\", light: 0xFBFAF6, dark: 0x1E1E1D))\n  static let secondaryPaper = Color(adaptive(\"secondaryPaper\", light: 0xF3F1EB, dark: 0x262625))\n  static let fill = Color.primary.opacity(0.055)\n  static let separator = Color.primary.opacity(0.10)\n  static let secondaryText = Color(nsColor: .secondaryLabelColor)\n  static let accent = Color(adaptive(\"accent\", light: 0x1667D9, dark: 0x2F86F6))\n  static let insertion = Color(adaptive(\"insertion\", light: 0x1B6B42, dark: 0x6CC995))\n  static let deletion = Color(adaptive(\"deletion\", light: 0xA8322A, dark: 0xFF8A7F))\n  static let textColor = adaptive(\"text\", light: 0x1D1C1A, dark: 0xEDEBE7)\n\n  private static func adaptive(_ name: String, light: UInt32, dark: UInt32) -> NSColor {\n    NSColor(name: NSColor.Name(\"redraft.\\(name)\")) { appearance in\n      let value = appearance.bestMatch(from: [.aqua, .darkAqua]) == .darkAqua ? dark : light\n      return NSColor(\n        srgbRed: Double((value >> 16) & 0xFF) / 255,\n        green: Double((value >> 8) & 0xFF) / 255,\n        blue: Double(value & 0xFF) / 255, alpha: 1)\n    }\n  }\n}\n\nstruct NativeMaterial: View {\n  let material: NSVisualEffectView.Material\n  var blendingMode: NSVisualEffectView.BlendingMode = .behindWindow\n  @Environment(\\.accessibilityReduceTransparency) private var reduceTransparency\n  @Environment(\\.colorSchemeContrast) private var contrast\n\n  var body: some View {\n    Group {\n      if reduceTransparency || contrast == .increased {\n        Color(nsColor: .windowBackgroundColor)\n      } else {\n        MaterialBridge(material: material, blendingMode: blendingMode)\n      }\n    }\n    .accessibilityHidden(true)\n  }\n}\n\nprivate struct MaterialBridge: NSViewRepresentable {\n  let material: NSVisualEffectView.Material\n  let blendingMode: NSVisualEffectView.BlendingMode\n\n  func makeNSView(context: Context) -> NSVisualEffectView {\n    let view = NSVisualEffectView()\n    view.state = .followsWindowActiveState\n    return view\n  }\n\n  func updateNSView(_ view: NSVisualEffectView, context: Context) {\n    view.material = material\n    view.blendingMode = blendingMode\n  }\n}\n\nstruct WindowAppearance: NSViewRepresentable {\n  func makeNSView(context: Context) -> WindowAppearanceView { WindowAppearanceView() }\n  func updateNSView(_ nsView: WindowAppearanceView, context: Context) {}\n}\n\nfinal class WindowAppearanceView: NSView {\n  override var acceptsFirstResponder: Bool { true }\n\n  override func viewDidMoveToWindow() {\n    super.viewDidMoveToWindow()\n    guard let window else { return }\n    window.titlebarAppearsTransparent = true\n    window.titleVisibility = .hidden\n    window.backgroundColor = .clear\n    window.isOpaque = false\n    window.isMovableByWindowBackground = false\n    window.minSize = NSSize(width: 780, height: 560)\n    window.initialFirstResponder = self\n  }\n}\n\nstruct ToolbarIcon: View {\n  let title: String\n  let symbol: String\n  var selected = false\n  let action: () -> Void\n\n  var body: some View {\n    Button(action: action) {\n      Image(systemName: symbol)\n        .font(.system(size: 15, weight: .regular))\n        .frame(width: 30, height: 28)\n        .background(selected ? PaperTheme.fill : .clear, in: RoundedRectangle(cornerRadius: 5))\n    }\n    .buttonStyle(.plain)\n    .help(title)\n    .accessibilityLabel(title)\n    .accessibilityAddTraits(selected ? .isSelected : [])\n  }\n}\n\nstruct EmptyWorkspaceView: View {\n  let symbol: String\n  let title: String\n  let detail: String\n\n  var body: some View {\n    VStack(spacing: 12) {\n      Image(systemName: symbol).font(.system(size: 32, weight: .light)).foregroundStyle(.secondary)\n      Text(title).font(.title3.weight(.medium))\n      Text(detail).foregroundStyle(.secondary).multilineTextAlignment(.center)\n    }\n    .padding(36)\n    .frame(maxWidth: .infinity, maxHeight: .infinity)\n  }\n}\n", "App/Editor/ImageImport.swift": "import AppKit\nimport RedraftCore\nimport UniformTypeIdentifiers\n\nstruct ImageImportTarget: Sendable {\n  let articleID: UUID\n  let afterBlockID: UUID?\n  let replacingBlockID: UUID?\n}\n\nenum ImageTransferPayload: Sendable {\n  case data(Data)\n  case file(URL)\n}\n\n@MainActor\nenum ImageTransfer {\n  static let maximumBytes = 20 * 1024 * 1024\n\n  static func imageOnlyPayload(from pasteboard: NSPasteboard) -> ImageTransferPayload? {\n    guard pasteboard.data(forType: .rtf) == nil, pasteboard.data(forType: .rtfd) == nil,\n      pasteboard.data(forType: .html) == nil\n    else { return nil }\n    if let urls = pasteboard.readObjects(\n      forClasses: [NSURL.self], options: [.urlReadingFileURLsOnly: true]) as? [URL],\n      urls.count == 1, let url = urls.first,\n      UTType(filenameExtension: url.pathExtension)?.conforms(to: .image) == true\n    {\n      return .file(url)\n    }\n    guard pasteboard.string(forType: .string)?.isEmpty != false else { return nil }\n    if let data = pasteboard.data(forType: .png) ?? pasteboard.data(forType: .tiff) {\n      return .data(data)\n    }\n    return nil\n  }\n}\n\n/// Native file picking and decoding stay outside document actions and Core models.\n@MainActor\nenum NativeImageImport {\n  enum Failure: Error {\n    case unsupportedType, tooLarge, invalidImage, unreadableFile\n    var message: String {\n      switch self {\n      case .unsupportedType: \"只能插入图片文件\"\n      case .tooLarge: \"图片不能超过 20 MB\"\n      case .invalidImage: \"无法读取这张图片\"\n      case .unreadableFile: \"无法打开这张图片\"\n      }\n    }\n  }\n\n  static func chooseFile(replacing: Bool) -> URL? {\n    let panel = NSOpenPanel()\n    panel.title = replacing ? \"替换图片\" : \"插入图片\"\n    panel.allowedContentTypes = [.image]\n    panel.allowsMultipleSelection = false\n    panel.canChooseDirectories = false\n    return panel.runModal() == .OK ? panel.url : nil\n  }\n\n  static func load(_ payload: ImageTransferPayload, altText: String = \"\") throws -> ImageContent {\n    switch payload {\n    case .data(let data): return try decode(data, altText: altText)\n    case .file(let url):\n      guard url.isFileURL else { throw Failure.unsupportedType }\n      let scoped = url.startAccessingSecurityScopedResource()\n      defer { if scoped { url.stopAccessingSecurityScopedResource() } }\n      do {\n        let resources = try url.resourceValues(forKeys: [.fileSizeKey, .contentTypeKey])\n        guard\n          resources.contentType?.conforms(to: .image) == true\n            || UTType(filenameExtension: url.pathExtension)?.conforms(to: .image) == true\n        else { throw Failure.unsupportedType }\n        guard (resources.fileSize ?? 0) \u003c= ImageTransfer.maximumBytes else {\n          throw Failure.tooLarge\n        }\n        return try decode(\n          try Data(contentsOf: url), altText: url.deletingPathExtension().lastPathComponent)\n      } catch let failure as Failure {\n        throw failure\n      } catch {\n        throw Failure.unreadableFile\n      }\n    }\n  }\n\n  private static func decode(_ data: Data, altText: String) throws -> ImageContent {\n    guard data.count \u003c= ImageTransfer.maximumBytes else { throw Failure.tooLarge }\n    guard let image = NSImage(data: data), image.size.width > 0, image.size.height > 0 else {\n      throw Failure.invalidImage\n    }\n    return ImageContent(data: data, altText: altText)\n  }\n}\n\nextension WorkspaceViewModel {\n  func chooseImage(replacing blockID: UUID? = nil) {\n    guard let target = imageImportTarget(after: state.selectedBlockID, replacing: blockID),\n      let url = NativeImageImport.chooseFile(replacing: blockID != nil)\n    else { return }\n    receiveImage(.file(url), target: target)\n  }\n\n  func imageImportTarget(after blockID: UUID?, replacing replacementID: UUID? = nil)\n    -> ImageImportTarget?\n  {\n    guard !isEditorLocked, let article = currentArticle,\n      blockID == nil || article.blocks.contains(where: { $0.id == blockID }),\n      replacementID == nil\n        || article.blocks.contains(where: { $0.id == replacementID && $0.kind == .image })\n    else { return nil }\n    return ImageImportTarget(\n      articleID: article.id, afterBlockID: blockID, replacingBlockID: replacementID)\n  }\n\n  func receiveImage(_ payload: ImageTransferPayload, target: ImageImportTarget) {\n    guard imageTargetIsCurrent(target) else { return }\n    do {\n      commitImportedImage(try NativeImageImport.load(payload), target: target)\n    } catch let failure as NativeImageImport.Failure {\n      showNotice(failure.message)\n    } catch {\n      showNotice(\"无法读取这张图片\")\n    }\n  }\n\n  func importImageData(_ data: Data, target: ImageImportTarget, altText: String = \"\") {\n    guard imageTargetIsCurrent(target) else { return }\n    do {\n      commitImportedImage(try NativeImageImport.load(.data(data), altText: altText), target: target)\n    } catch let failure as NativeImageImport.Failure {\n      showNotice(failure.message)\n    } catch {\n      showNotice(\"无法读取这张图片\")\n    }\n  }\n\n  private func commitImportedImage(_ image: ImageContent, target: ImageImportTarget) {\n    guard imageTargetIsCurrent(target) else { return }\n    if let id = target.replacingBlockID {\n      editImage(id) { content in\n        content.data = image.data\n        content.assetName = nil\n      }\n      return\n    }\n    let block = DocumentBlock(image: image)\n    mutateSelectedArticle { article in\n      let position =\n        article.blocks.firstIndex { $0.id == target.afterBlockID }.map { $0 + 1 }\n        ?? article.blocks.endIndex\n      article.blocks.insert(block, at: position)\n    }\n    selectBlock(block.id)\n  }\n\n  func receiveImageDrop(_ providers: [NSItemProvider], after blockID: UUID?) -> Bool {\n    guard let target = imageImportTarget(after: blockID),\n      let provider = providers.first(where: {\n        $0.hasItemConformingToTypeIdentifier(UTType.fileURL.identifier)\n          || $0.hasItemConformingToTypeIdentifier(UTType.image.identifier)\n      })\n    else { return false }\n    if provider.hasItemConformingToTypeIdentifier(UTType.fileURL.identifier) {\n      provider.loadDataRepresentation(forTypeIdentifier: UTType.fileURL.identifier) {\n        [weak self] data, _ in\n        guard let data, let url = URL(dataRepresentation: data, relativeTo: nil) else {\n          Task { @MainActor [weak self] in self?.imageImportFailed(target: target) }\n          return\n        }\n        Task { @MainActor [weak self] in self?.receiveImage(.file(url), target: target) }\n      }\n    } else if let type = provider.registeredTypeIdentifiers.first(where: {\n      UTType($0)?.conforms(to: .image) == true\n    }) {\n      provider.loadDataRepresentation(forTypeIdentifier: type) { [weak self] data, _ in\n        guard let data else {\n          Task { @MainActor [weak self] in self?.imageImportFailed(target: target) }\n          return\n        }\n        Task { @MainActor [weak self] in self?.receiveImage(.data(data), target: target) }\n      }\n    }\n    return true\n  }\n\n  private func imageImportFailed(target: ImageImportTarget) {\n    guard imageTargetIsCurrent(target) else { return }\n    showNotice(\"无法读取这张图片\")\n  }\n\n  private func imageTargetIsCurrent(_ target: ImageImportTarget) -> Bool {\n    guard !isEditorLocked, let article = currentArticle, article.id == target.articleID else {\n      return false\n    }\n    if let id = target.afterBlockID, !article.blocks.contains(where: { $0.id == id }) {\n      return false\n    }\n    if let id = target.replacingBlockID,\n      !article.blocks.contains(where: { $0.id == id && $0.kind == .image })\n    {\n      return false\n    }\n    return true\n  }\n}\n", "App/Editor/DocumentImagePreview.swift": "import AppKit\nimport RedraftCore\nimport SwiftUI\n\nprotocol DocumentImageResolving: Sendable {\n  @MainActor func image(for assetName: String) -> NSImage?\n}\n\nstruct BundleImageResolver: DocumentImageResolving {\n  @MainActor func image(for assetName: String) -> NSImage? {\n    NSImage(named: NSImage.Name(assetName))\n  }\n}\n\nprivate struct DocumentImageResolverKey: EnvironmentKey {\n  static let defaultValue: any DocumentImageResolving = BundleImageResolver()\n}\n\nextension EnvironmentValues {\n  var documentImageResolver: any DocumentImageResolving {\n    get { self[DocumentImageResolverKey.self] }\n    set { self[DocumentImageResolverKey.self] = newValue }\n  }\n}\n\nstruct DocumentImagePreview: View {\n  let content: ImageContent\n  @Environment(\\.documentImageResolver) private var imageResolver\n\n  @MainActor static func image(for content: ImageContent, resolver: any DocumentImageResolving)\n    -> NSImage?\n  {\n    // Invalid imported bytes are a missing image, never a request for a sample fallback.\n    if let data = content.data { return NSImage(data: data) }\n    return content.assetName.flatMap { resolver.image(for: $0) }\n  }\n\n  @MainActor static func ratio(for content: ImageContent, resolver: any DocumentImageResolving)\n    -> CGFloat\n  {\n    guard let image = image(for: content, resolver: resolver), image.size.height > 0 else {\n      return 3 / 2\n    }\n    return image.size.width / image.size.height\n  }\n\n  var body: some View {\n    Group {\n      if let image = Self.image(for: content, resolver: imageResolver) {\n        Image(nsImage: image).resizable().aspectRatio(contentMode: .fit)\n      } else {\n        ZStack {\n          PaperTheme.secondaryPaper\n          Label(\"图片无法显示\", systemImage: \"photo.badge.exclamationmark\")\n            .font(.callout).foregroundStyle(.secondary)\n        }\n        .aspectRatio(3 / 2, contentMode: .fit)\n      }\n    }\n    .accessibilityLabel(content.altText.isEmpty ? \"文章插图\" : content.altText)\n  }\n}\n", "Tests/EditorInteractionTests.swift": "import AppKit\nimport RedraftCore\nimport SwiftUI\nimport UniformTypeIdentifiers\n\n@main\nstruct EditorInteractionTests {\n  @MainActor\n  static func main() async throws {\n    _ = NSApplication.shared\n    try semanticBridgePreservesParagraphRoles()\n    try editorSessionsStayIndependent()\n    try nativeCommitRejectsStaleComposition()\n    try mixedFormattingPreservesRuns()\n    try paragraphFormattingPreservesIndependentStyles()\n    try clearingAtCaretDoesNotEraseDocumentFormatting()\n    try tableBoundariesRejectStaleCallbacks()\n    try nativeFormattingUndoAndComposition()\n    try tableKeyboardNavigationRespectsTextBoundaries()\n    try selectedBlockShortcutsRespectTextFocus()\n    try imagePastePreservesRichText()\n    try await imageImportsKeepTheirOriginalTarget()\n    print(\"Editor interactions: 12 scenarios passed\")\n  }\n\n  @MainActor\n  private static func model(text: NSAttributedString) throws -> WorkspaceViewModel {\n    let block = DocumentBlock(text: RichTextBridge.content(from: text))\n    let article = Article(title: \"编辑器测试\", blocks: [block])\n    let model = try TestSupport.model(articles: [article])\n    model.selectArticle(article.id)\n    model.selectBlock(block.id)\n    model.state.selectedRange = NSRange(location: 0, length: text.length)\n    return model\n  }\n\n  @MainActor\n  private static func semanticBridgePreservesParagraphRoles() throws {\n    let largeBody = NSAttributedString(\n      string: \"这是大号正文\", attributes: [.font: NSFont.systemFont(ofSize: 28)])\n    let model = try model(text: largeBody)\n    try expect(\n      model.editorSelectionStyle.paragraphTitle == \"正文\",\n      \"Large body text must not be inferred to be a heading\")\n    model.formatSelection(.heading(2))\n    try expect(\n      model.selectedBlock?.text.paragraphStyle.kind == .heading(level: 2),\n      \"Heading must be explicit document semantics\")\n    model.formatSelection(.size(12))\n    try expect(\n      model.editorSelectionStyle.paragraphTitle == \"标题 2\",\n      \"Changing heading size must preserve its semantic role\")\n    let native = RichTextBridge.attributedString(from: model.selectedBlock!.text)\n    let restored = RichTextBridge.content(from: native)\n    try expect(\n      restored.paragraphStyle.kind == .heading(level: 2),\n      \"Native bridge must preserve semantic heading on round trip\")\n    let paragraph = ParagraphStyle(\n      kind: .heading(level: 1), alignment: .right, headIndent: 24, firstLineHeadIndent: 12,\n      tailIndent: -8, lineSpacing: 3, paragraphSpacing: 11,\n      paragraphSpacingBefore: 4, lineHeightMultiple: 1.6,\n      list: ListStyle(marker: .decimal, startingItemNumber: 3))\n    let rich = RichTextContent(\n      string: \"标题\",\n      defaultStyle: TextStyle(\n        bold: true, italic: true, underline: true, strikethrough: true, foreground: .secondary,\n        background: .rgba(0.4, 0.3, 0.2, 0.25)), paragraphStyle: paragraph)\n    let roundTrip = RichTextBridge.content(from: RichTextBridge.attributedString(from: rich))\n    try expect(\n      roundTrip.paragraphStyle == paragraph,\n      \"Paragraph layout and list start must survive bridge conversion\")\n    try expect(\n      roundTrip.defaultStyle.bold && roundTrip.defaultStyle.italic\n        && roundTrip.defaultStyle.underline && roundTrip.defaultStyle.strikethrough\n        && roundTrip.defaultStyle.foreground == .secondary,\n      \"Character styles and semantic colors must
