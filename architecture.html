lection and sheets in all consumers\")\n\n    let reviewStore = try WorkspaceStore(seed: DemoWorkspaceContentSource().load())\n    let reviewer = WorkspaceViewModel(store: reviewStore, reviewProvider: NoReviewProvider())\n    let peer = WorkspaceViewModel(store: reviewStore, reviewProvider: NoReviewProvider())\n    let ready = reviewer.articles.first { $0.phase == .ready }!\n    reviewer.selectArticle(ready.id)\n    peer.selectArticle(ready.id)\n    reviewer.enterReview()\n    peer.enterReview()\n    peer.startRewrite()\n    for change in ready.changes { reviewer.decide(.keep, changeID: change.id) }\n    reviewer.completeReview()\n    try expect(\n      peer.state.mode == .writing && peer.state.sheet == nil\n        && peer.state.selectedChangeID == nil && peer.state.rewriteText.isEmpty,\n      \"Finishing a shared review must dismiss another window's obsolete rewrite draft\")\n  }\n\n  @MainActor\n  private static func injectedReviewResultsAndFailures() async throws {\n    let block = DocumentBlock(text: RichTextContent(string: \"独立的测试输入\"))\n    let document = Article(title: \"接口测试\", blocks: [block], marks: [block.id: \"修改\"])\n    let source = TestSupport.Source(\n      seed: WorkspaceSeed(articles: [ArticleSeed(document: document)]))\n    let model = try WorkspaceViewModel(source: source, reviewProvider: InjectedReviewProvider())\n    model.beginReview()\n    for _ in 0..\u003c100 where model.currentArticle?.phase == .running {\n      try await Task.sleep(for: .milliseconds(2))\n    }\n    try expect(\n      model.currentChange == nil && model.currentArticle?.changes.first?.after == \"注入接口的结果\",\n      \"Review content must come from the injected provider, including non-demo articles\")\n    let failure = try WorkspaceViewModel(source: source, reviewProvider: FailingReviewProvider())\n    failure.beginReview()\n    for _ in 0..\u003c100 where failure.currentArticle?.phase == .running {\n      try await Task.sleep(for: .milliseconds(2))\n    }\n    try expect(\n      failure.notice?.contains(\"可重试的错误\") == true && !failure.isEditorLocked,\n      \"Provider errors must be projected into visible retryable UI state\")\n    failure.dismissNotice()\n    try expect(failure.notice == nil, \"Dismissing a projected error is local UI state\")\n  }\n\n  private struct InjectedReviewProvider: ReviewProviding {\n    func changes(for request: ReviewRequest) async throws -> [ReviewChange] {\n      let block = request.article.blocks[0]\n      return [\n        ReviewChange(\n          blockID: block.id, before: block.plainText,\n          after: \"注入接口的结果\", explanation: \"测试接口\")\n      ]\n    }\n  }\n\n  private struct FailingReviewProvider: ReviewProviding {\n    struct Failure: LocalizedError {\n      var errorDescription: String? { \"可重试的错误\" }\n    }\n    func changes(for request: ReviewRequest) async throws -> [ReviewChange] { throw Failure() }\n  }\n\n  private static func expect(_ condition: @autoclosure () -> Bool, _ message: String) throws {\n    if !condition() { throw TestFailure(message: message) }\n  }\n\n  private struct TestFailure: Error {\n    let message: String\n  }\n}\n", "App/Models/RewriteExamplePresentation.swift": "import RedraftCore\n\nextension RewriteExample {\n  /// Core classification stays language-neutral; user-authored tags keep their original text.\n  var displayTag: String {\n    guard let kind = ChangeKind(rawValue: tag) else { return tag }\n    return switch kind {\n    case .text: \"表达\"\n    case .image: \"图片\"\n    case .tableRow: \"表格行\"\n    case .tableColumn: \"表格列\"\n    }\n  }\n}\n", "Packages/RedraftCore/Sources/RedraftCore/ArticleSession.swift": "import Foundation\n\n/// One open article's writable owner. Views observe immutable value snapshots from this session.\n/// This in-memory implementation does not provide persistence, AI or review composition.\n@MainActor\npublic final class ArticleSession {\n  public private(set) var document: Article\n  public private(set) var versions: [ArticleVersion]\n  public private(set) var review: ReviewState\n\n  private var observers: [UUID: @MainActor () -> Void] = [:]\n  private var reviewTask: Task\u003cVoid, Never>?\n\n  public init(\n    document: Article, versions: [ArticleVersion] = [], review: ReviewState = .idle\n  ) throws {\n    let document = document.normalized()\n    let review: ReviewState = {\n      if case .ready(let batch) = review { .ready(batch.normalized()) } else { review }\n    }()\n    try document.validate()\n    guard Set(versions.map(\\.id)).count == versions.count else {\n      throw EditingError.invalidDocument\n    }\n    var revisions = [document.revisionID: document]\n    for version in versions {\n      guard version.document.id == document.id else { throw EditingError.invalidDocument }\n      try version.document.validate()\n      // Snapshot labels may differ; a revision identity must always resolve to one document value.\n      if let existing = revisions[version.revisionID], existing != version.document {\n        throw EditingError.invalidDocument\n      }\n      revisions[version.revisionID] = version.document\n    }\n    switch review {\n    case .ready(let batch): try batch.validate(against: document)\n    case .running: throw EditingError.invalidReview\n    case .idle, .failed: break\n    }\n    self.document = document\n    self.versions = versions\n    self.review = review\n  }\n\n  deinit { reviewTask?.cancel() }\n\n  @discardableResult\n  public func observe(_ observer: @escaping @MainActor () -> Void) -> UUID {\n    let token = UUID()\n    observers[token] = observer\n    return token\n  }\n\n  public func removeObserver(_ token: UUID) { observers.removeValue(forKey: token) }\n\n  /// Stage and validate a value before publishing it. Document edits invalidate previous review.\n  public func updateDocument(\n    basedOn revisionID: UUID? = nil, _ mutate: (inout Article) -> Void\n  ) throws {\n    if let revisionID, revisionID != document.revisionID { throw EditingError.staleRevision }\n    var next = document\n    mutate(&next)\n    next = next.normalized()\n    guard next.id == document.id, next.revisionID == document.revisionID,\n      next.updatedAt == document.updatedAt\n    else { throw EditingError.invalidDocument }\n    try next.validate()\n    guard next != document else { return }\n    next.revisionID = UUID()\n    next.updatedAt = Date()\n    reviewTask?.cancel()\n    reviewTask = nil\n    review = .idle\n    document = next\n    notify()\n  }\n\n  @discardableResult\n  public func saveVersion(title: String, date: Date = Date()) -> ArticleVersion {\n    let version = ArticleVersion(title: title, date: date, document: document)\n    versions.append(version)\n    notify()\n    return version\n  }\n\n  public func beginReview(using provider: any ReviewProviding) throws {\n    guard !review.isRunning, !review.isReady, !document.marks.isEmpty else {\n      throw EditingError.invalidReview\n    }\n    let request = ReviewRequest(article: document)\n    review = .running(request)\n    notify()\n    reviewTask = Task { [weak self] in\n      do {\n        let changes = try await provider.changes(for: request)\n        guard !Task.isCancelled, let self, self.isCurrent(request) else { return }\n        let batch = ReviewBatch(\n          articleID: request.article.id, baseRevisionID: request.article.revisionID,\n          changes: changes\n        ).normalized()\n        try batch.validate(against: self.document)\n        guard changes.allSatisfy({ $0.decision == nil && $0.rewrittenText.isEmpty }) else {\n          throw EditingError.invalidReview\n        }\n        self.review = changes.isEmpty ? .idle : .ready(batch)\n        self.reviewTask = nil\n        self.notify()\n      } catch {\n        guard !Task.isCancelled, let self, self.isCurrent(request) else { return }\n        self.review = .failed(error.localizedDescription)\n        self.reviewTask = nil\n        self.notify()\n      }\n    }\n  }\n\n  public func cancelReview() {\n    guard review.isRunning else { return }\n    reviewTask?.cancel()\n    reviewTask = nil\n    review = .idle\n    notify()\n  }\n\n  public func decide(_ decision: ReviewDecision, changeID: UUID) throws {\n    guard decision != .rewrite else { throw EditingError.invalidReview }\n    try updateChange(changeID) {\n      $0.decision = decision\n      $0.rewrittenText = \"\"\n    }\n  }\n\n  public func updateReason(_ reason: String, changeID: UUID) throws {\n    try updateChange(changeID) { $0.reason = reason }\n  }\n\n  public func rewrite(changeID: UUID, text: String, reason: String) throws {\n    guard !text.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty else {\n      throw EditingError.invalidReview\n    }\n    try updateChange(changeID) {\n      $0.decision = .rewrite\n      $0.rewrittenText = text\n      $0.reason = reason\n    }\n  }\n\n  /// Preview completion records choices only; applying/merging suggestions remains unimplemented.\n  public func finishPreviewReview() throws -> [RewriteExample] {\n    guard case .ready(let batch) = review, !batch.changes.isEmpty else {\n      throw EditingError.invalidReview\n    }\n    try batch.validate(against: document)\n    guard batch.changes.allSatisfy({ $0.decision != nil }) else {\n      throw EditingError.unresolvedChanges\n    }\n    let examples = batch.changes.compactMap { change -> RewriteExample? in\n      guard let decision = change.decision else { return nil }\n      let after: String\n      switch decision {\n      case .accept: after = change.after\n      case .keep: after = change.before\n      case .rewrite: after = change.rewrittenText\n      }\n      return RewriteExample(\n        articleID: document.id, blockID: change.blockID, before: change.before, after: after,\n        decision: decision, reason: change.reason.isEmpty ? change.explanation : change.reason,\n        tag: change.kind.rawValue)\n    }\n    review = .idle\n    notify()\n    return examples\n  }\n\n  private func updateCh Range }\n    return indices\n  }\n\n  private func validate(_ style: TextStyle) throws {\n    if let size = style.fontSize, !size.isFinite || size \u003c= 0 {\n      throw EditingError.invalidDocument\n    }\n    for color in [style.foreground, style.background].compactMap({ $0 }) {\n      if case .rgba(let r, let g, let b, let a) = color,\n        ![r, g, b, a].allSatisfy({ $0.isFinite && (0...1).contains($0) })\n      {\n        throw EditingError.invalidDocument\n      }\n    }\n  }\n\n  private func validate(_ style: ParagraphStyle) throws {\n    guard\n      [\n        style.headIndent, style.firstLineHeadIndent, style.tailIndent, style.lineSpacing,\n        style.paragraphSpacing, style.paragraphSpacingBefore, style.lineHeightMultiple,\n      ].allSatisfy(\\.isFinite)\n    else { throw EditingError.invalidDocument }\n    if case .heading(let level) = style.kind, !(1...6).contains(level) {\n      throw EditingError.invalidDocument\n    }\n  }\n}\n", "Packages/RedraftCore/Sources/RedraftCore/Editing.swift": "import Foundation\n\n/// Editing and display share a single structured snapshot contract.\npublic typealias Draft = Article\n\npublic enum EditingError: Error, Equatable, Sendable {\n  case invalidRange, invalidTarget, invalidDocument, staleRevision, invalidReview, unresolvedChanges\n}\n\npublic struct TextEdit: Equatable, Sendable {\n  public let blockID: UUID\n  public let range: NSRange\n  public let replacement: String\n\n  public init(blockID: UUID, range: NSRange, replacement: String) {\n    self.blockID = blockID\n    self.range = range\n    self.replacement = replacement\n  }\n}\n\npublic enum EditSource: Equatable, Sendable { case author, ai }\n\n/// A future persistent document engine exposes the same snapshots as ArticleSession.\npublic protocol ArticleEditing {\n  init(articleID: UUID)\n  init(snapshot: Data) throws\n  var current: Article { get }\n  var revisionIDs: [UUID] { get }\n  func draft(at revisionID: UUID) throws -> Article\n\n  /// Coordinates are block-local UTF-16 in the base revision, never flattened-document offsets.\n  /// Invalid/overlapping ranges or stale revisions fail atomically without changing content/history.\n  mutating func apply(_ edits: [TextEdit], basedOn revisionID: UUID, source: EditSource) throws\n    -> Article\n  func archive() throws -> ArticleArchive\n}\n", "Packages/RedraftCore/Tests/RedraftCoreTests/EditingTests.swift": "import Foundation\nimport RedraftCore\nimport XCTest\n\nfinal class EditingTests: XCTestCase {\n  private let text = RichTextContent(string: \"写👩🏽‍💻稿\")\n\n  func testConvertsBlockLocalUTF16SelectionToCompleteCharacters() throws {\n    let block = DocumentBlock(text: text)\n    let article = Article(title: \"Draft\", blocks: [block])\n    let range = try article.range(\n      forUTF16: NSRange(location: 1, length: \"👩🏽‍💻\".utf16.count), in: block.id)\n    XCTAssertEqual(text.string[range], \"👩🏽‍💻\")\n    let end = text.string.endIndex\n    XCTAssertEqual(\n      try text.range(forUTF16: NSRange(location: text.string.utf16.count, length: 0)), end..\u003cend)\n    XCTAssertThrowsError(try article.range(forUTF16: NSRange(location: 0, length: 1), in: UUID())) {\n      XCTAssertEqual($0 as? EditingError, .invalidTarget)\n    }\n  }\n\n  func testRejectsEditingInsideCombinedCharacters() {\n    for string in [\"e\\u{301}\", \"\\r\\n\"] {\n      let content = RichTextContent(string: string)\n      for selection in [NSRange(location: 0, length: 1), NSRange(location: 1, length: 1)] {\n        XCTAssertThrowsError(try content.range(forUTF16: selection)) { error in\n          XCTAssertEqual(error as? EditingError, .invalidRange)\n        }\n      }\n    }\n  }\n\n  func testRejectsPartialCharactersAndInvalidOffsets() {\n    let selections = [\n      NSRange(location: 2, length: 0), NSRange(location: 1, length: 2),\n      NSRange(location: -1, length: 0), NSRange(location: 0, length: -1),\n      NSRange(location: text.string.utf16.count, length: 1),\n      NSRange(location: NSNotFound, length: 0), NSRange(location: 1, length: Int.max),\n    ]\n    for selection in selections {\n      XCTAssertThrowsError(try text.range(forUTF16: selection)) {\n        XCTAssertEqual($0 as? EditingError, .invalidRange)\n      }\n    }\n  }\n\n  func testFormattingCanSplitGraphemesButNotSurrogatePairs() throws {\n    let combining = RichTextContent(\n      string: \"e\\u{301}\",\n      runs: [RichTextRun(range: NSRange(location: 0, length: 1), style: .init(bold: true))])\n    try combining.validate()\n    let surrogate = RichTextContent(\n      string: \"😀\",\n      runs: [RichTextRun(range: NSRange(location: 0, length: 1), style: .init(bold: true))])\n    XCTAssertThrowsError(try surrogate.validate())\n  }\n\n  func testRejectsInvalidStructuredDocuments() {\n    let block = DocumentBlock(text: RichTextContent(string: \"text\"))\n    XCTAssertThrowsError(try Article(title: \"duplicate\", blocks: [block, block]).validate())\n    XCTAssertThrowsError(\n      try Article(title: \"mark\", blocks: [block], marks: [UUID(): \"shorten\"]).validate())\n    XCTAssertThrowsError(try TableContent(rows: [[\"one\", \"two\"], [\"ragged\"]]).validate())\n    var table = TableContent(rows: [[\"a\"], [\"b\"]])\n    table.rowIDs[1] = table.rowIDs[0]\n    XCTAssertThrowsError(try table.validate())\n    var overlap = RichTextContent(string: \"abcd\")\n    overlap.runs = [\n      RichTextRun(range: NSRange(location: 0, length: 3), style: TextStyle()),\n      RichTextRun(range: NSRange(location: 2, length: 2), style: TextStyle(bold: true)),\n    ]\n    XCTAssertThrowsError(try overlap.validate())\n  }\n\n  func testCanonicalFormattingPreservesSemanticsWithoutDuplicateRuns() throws {\n    let body = ParagraphStyle(lineSpacing: 8)\n    let bold = TextStyle(bold: true)\n    let partial = RichTextContent(\n      string: \"abcd\",\n      runs: [\n        RichTextRun(range: NSRange(location: 0, length: 2), style: bold, paragraphStyle: body)\n      ],\n      paragraphStyle: body)\n    let explicit = RichTextContent(\n      string: \"abcd\",\n      runs: [\n        RichTextRun(range: NSRange(location: 0, length: 1), style: bold, paragraphStyle: body),\n        RichTextRun(range: NSRange(location: 1, length: 1), style: bold, paragraphStyle: body),\n        RichTextRun(\n          range: NSRange(location: 2, length: 2), style: TextStyle(), paragraphStyle: body),\n      ], paragraphStyle: body)\n    XCTAssertEqual(partial.normalized(), explicit.normalized())\n    XCTAssertEqual(partial.normalized().normalized(), partial.normalized())\n    XCTAssertEqual(partial.normalized().defaultStyle, bold)\n    XCTAssertEqual(partial.normalized().runs.count, 1)\n    try partial.normalized().validate()\n  }\n}\n", "Packages/RedraftCore/Sources/RedraftCore/TextDiff.swift": "public enum DiffSegment: Equatable, Sendable {\n  case unchanged(String)\n  case inserted(String)\n  case removed(String)\n  case replaced(before: String, after: String)\n}\n\npublic protocol TextDiffing: Sendable {\n  /// 片段按阅读顺序排列，拼接两侧应分别还原各稿的原始 UTF-8。\n  func compare(_ before: String, to after: String) -> [DiffSegment]\n}\n", "Packages/RedraftCore/Sources/RedraftCore/ParagraphRewriting.swift": "public protocol ParagraphRewriting: Sendable {\n  /// 返回完整的改写段落。\n  func rewrite(_ paragraph: String, instruction: String) async throws -> String\n}\n", "Packages/RedraftCore/Sources/RedraftCore/ArticleStorage.swift": "import Foundation\n\n/// 快照与 Markdown 对应同一文章版本。\npublic struct ArticleArchive: Sendable {\n  public let articleID: UUID\n  public let revisionID: UUID\n  public let snapshot: Data\n  public let markdown: String\n\n  public init(articleID: UUID, revisionID: UUID, snapshot: Data, markdown: String) {\n    self.articleID = articleID\n    self.revisionID = revisionID\n    self.snapshot = snapshot\n    self.markdown = markdown\n  }\n}\n\npublic protocol ArticleStorage: Sendable {\n  func articleIDs() async throws -> [UUID]\n\n  /// 文章不存在时返回 nil，读取失败时抛错。\n  func loadSnapshot(for articleID: UUID) async throws -> Data?\n\n  /// 保存失败时保留上次成功保存的完整归档。\n  func save(_ archive: ArticleArchive) async throws\n}\n", "design.md": "# Redraft 技术设计\n\n## 原生 UI、数据模型与状态归属（2026-11-15）\n\n依据 design 分支的 prototype 实现原生 macOS 界面：文章库、窗口工具栏、排版工具栏、图文表编辑区、标记检查器、逐处审阅、历史对比、句子来历及改写范例。沿用 XcodeGen + SwiftUI/AppKit + RedraftCore 分层与 Swift 6、macOS 13 基线。\n\n本轮将原先 App 展示模型与 Core 纯文本草稿两套契约收拢为结构化文档。Core 的 `Article` 包含文章 ID、当前版本 ID、标题、内容块与标记；`DocumentBlock` 使用带关联值的内容枚举，分别承载语义富文本、图片或表格。标题层级、列表和文字样式有显式类型，AppKit 字体与颜色不进入 Core。`ArticleVersion` 保存特定版本的文档快照；审阅批次记录文章和基准版本，选区明确使用内容块内的 UTF-16 坐标。\n\n状态按所有者分开，而不是统一塞入全局 ViewModel：\n\n| 状态 | 唯一所有者 | 界面访问方式 |\n| --- | --- | --- |\n| 一篇文章的当前正文、标题、格式与标记 | Core `ArticleSession.document` | 经 ViewModel 读取只读投影；修改动作由会话校验后提交 |\n| 历史快照、改稿请求、审阅批次和取舍 | 同一篇文章的 `ArticleSession` | 会话发布变化，ViewModel 派生审阅与历史显示 |\n| 文章会话集合、改写范例 | App `WorkspaceStore` | ViewModel 观察 Store；多个窗口可共享 Store 与会话 |\n| 当前文章 ID、选区、搜索、模式、侧栏、弹窗草稿 | 每个窗口自己的 `WorkspaceState` | ViewModel 动作或界面绑定 |\n| 原生焦点、输入格式、组字缓冲、布局测量 | 窗口级 `EditorSession` 与原生控件 | 明确的桥接回调；不作为第二份文档存储 |\n\n`WorkspaceViewModel` 不再持有文章内容副本。它从 Store 中的会话计算 `ArticleViewState`、文章列表、字数、未处理建议数量和操作可用性。UI 读取这些投影并发出动作，文档修改统一经过会话；历史快照是特定版本的只读值，不作为另一个可编辑当前稿。核心状态更新会通知所有订阅者，使共享文章的多个 ViewModel 读取同一事实来源。Store 在变更提交后发出通知，窗口再校正本地引用：其他窗口删除文章或内容块时清理对应选择与弹窗，正文缩短时收拢越界选区，审阅批次结束时关闭已失效的重写弹窗；这些校正不改变其他窗口的文档内容。\n\n原生编辑器通过 `RichTextBridge` 将 Core 语义富文本转换为 `NSAttributedString`，并将原生编辑结果转换回 Core 后提交。标题不再通过字号猜测。窗口级 `EditorSession` 取代进程级静态焦点，工具栏读取它发布的输入会话状态。输入法 marked text 期间只维护原生组字缓冲，不向文档提交中间结果，也不让外部正文覆盖组字。提交时同时携带文章身份与本次原生编辑的基准内容；若该内容已被另一处编辑更新，则拒绝旧缓冲覆盖并恢复当前权威正文，不尝试自动合并冲突。成功提交后立即刷新基准，避免快速连续输入依赖下一次界面重绘。当前按内容块编辑，跨块连续选区与统一文档级撤销仍未实现。\n\n应用入口显式注入 `WorkspaceContentSource`、`ReviewProviding` 与 `DocumentImageResolving`。默认演示装配放在 `App/Preview`：固定文章与历史、改稿样例、演示延迟、插画资源都属于适配器。通用 ViewModel、编辑器和图片渲染器不认识示例稿件或样例图片名；空数据源保持为空，无法读取的图片显示缺失占位。Core 与业务边界通过同一套真实类型和协议定义，业务服务的实现仍可替换。\n\n模块映射为 `App/Workspace`（窗口、文章库、弹层与菜单）、`App/Editor`（正文、排版、图片与表格）、`App/Review`（审阅、历史、来历与范例）、`App/Models` / `App/ViewModels`（文章会话集合、窗口状态、只读投影及动作协调）、`App/Platform`（原生输入和富文本转换）、`App/Preview`（演示注入实现）、`App/Shared`（配色和系统材质）。Core 不依赖 AppKit 或 SwiftUI。\n\n当前会话只提供 UI 所需的内存编辑、版本快照、请求取消、过期结果隔离与审阅状态管理。审阅完成记录本次取舍，正文保持原样；没有真实 AI 调用、Loro 引擎、磁盘保存、Markdown 导出、词级 Diff、逐句定位或跨版本定稿合成。后续接入 Loro 时，由会话封装其权威文档，UI 继续读取派生快照，不能同时维护两份可独立修改的正文。\n\n视觉沿用纸面配色，正文为不透明暖白 / 炭灰；侧栏、工具栏、检查器用 NSVisualEffectView 原生材质，跟随窗口活跃状态和系统外观，并支持“降低透明度”。默认收起检查器，窄窗口让出阅读空间。使用系统菜单、弹层、键盘快捷键及辅助功能标签。\n\n验证覆盖原生构建、Core 文档不变量与会话测试、共享状态和注入边界测试、编辑器富文本及输入保护、Swift 格式检查，以及真实原生视图的深浅色与窄窗快照。以下技术选型中的 Loro、真实 AI 和磁盘存储描述后续目标，不代表已接入。\n\nRedraft 是本地优先的 macOS 文本编辑器，以版本对比（Diff）为核心。编辑器让作者流畅地写下自己的表达，AI 按需改稿，Diff 让作者看清一段文字怎样从初稿演变到定稿。[产品理念](idea.md)\n\n## 写作与改稿体验\n\n作者先专注写作。写完一轮后，标记希望修改的段落，请 AI 改稿。AI 完成修改后生成新版本，作者可以对照原稿，决定下一稿采用哪种表达。\n\nDiff 界面按文章的阅读顺序呈现改动，保留原句的上下文。一处措辞被替换时，作者可以对照着读旧句和新句。即使只改了一个标点，也能看清语气的变化。回看多轮修改时，作者可以沿着同一段落读到初稿、AI 改稿和自己的定稿。这样，日后再遇到类似的表达问题，就能回到这篇文章，看看自己当时怎样取舍。\n\n## 技术选型\n\n| 用途 | 选择 | 理由与取舍 |\n| --- | --- | --- |\n| macOS 客户端 | Swift、SwiftUI、AppKit，部署目标为 macOS 13 及以上 | SwiftUI 负责文章列表、版本对比和历史视图。正文通过 NSViewRepresentable 嵌入 NSTextView，使用系统的输入法、选区、拼写检查和辅助功能。macOS 13 可作为富文本编辑使用 TextKit 2 的基线。[Apple 的 TextKit 说明](https://developer.apple.com/videos/play/wwdc2022/10090/) |\n| 文本编辑与显示 | TextKit 2，显式使用 `NSTextView(usingTextLayoutManager: true)` | 编辑视图能接收原生文本输入，并在版本对比时绘制差异高亮。代价是应用需要维护视图和文档之间的增量同步。 |\n| 正文、富文本与历史 | 每篇文章一个 LoroDoc，Swift 绑定固定为 1.17.1 | LoroText 表示正文与富文本标记，Cursor 定位段落边界，forkAt 读取历史版本。Swift 绑定仍标为实验性，相关类型封装在文档模块内。采用完整快照以保留早期草稿。[Swift 绑定](https://github.com/loro-dev/loro-swift) · [快照格式](https://loro.dev/docs/tutorial/encoding) |\n| 文本对比 | NaturalLanguage 的 NLTokenizer、Swift 标准库的 difference(from:) | 段落对齐后按句、词和原始标点比较。中英文都能保留可读的修改范围，核心包无需引入第三方 diff 库。[Apple 分词接口](https://developer.apple.com/documentation/naturallanguage/nltokenizer) |\n| 本地保存与导出 | Foundation 文件 API、Loro 完整快照、UTF-8 Markdown | 文章可作为一个目录独立保存和备份。快照保存继续编辑所需的全部状态，Markdown 供阅读和交换。 |\n| AI 服务 | Swift 异步协议、Codable、URLSession、系统钥匙串 | 模型适配器接收作者标记的段落，返回对应的改写文本。Mock 使用相同接口，便于用固定稿件复现版本差异。服务商可以替换，API 密钥由 Keychain 保存。[Keychain Services](https://developer.apple.com/documentation/security/keychain-services) |\n| 工程组织 | XcodeGen 管理 macOS 工程，Swift Package Manager 管理本地核心包与 Loro 依赖 | 用 project.yml 描述应用配置，锁定依赖版本。核心逻辑可用 XCTest 独立测试，编辑器交互在 macOS 应用中验证。[XcodeGen](https://github.com/yonaskolb/XcodeGen) |\n\n## 模块与依赖\n\nmacOS 应用负责界面和外部服务，依赖本地 Swift 包 RedraftCore。核心包负责编辑、改稿和版本对比所需的文档逻辑，并定义改稿与存储接口。\n\n| 归属 | 模块 | 主要职责 | 直接依赖 |\n| --- | --- | --- | --- |\n| macOS 应用 | 编辑界面 | 提供流畅的正文编辑与段落标记体验，在原文上下文中呈现各轮改动。 | SwiftUI、AppKit、文章会话 |\n| RedraftCore | 文章会话 | 协调一篇文章的编辑、改稿、对比与保存。每轮 AI 改稿完成后，保留送审稿并生成新版本。 | 文档与版本、文本对比、改稿服务接口、文章存储接口 |\n| RedraftCore | 文档与版本 | 管理正文、格式和版本历史，保留修改来源及同一段落在各稿中的对应关系，供作者追溯。 | Foundation、loro-swift |\n| RedraftCore | 文本对比（Diff） | 比较任意两稿，识别文字的新增、删除和替换，为界面提供改前、改后的文字及上下文。 | NaturalLanguage、Swift 标准库 |\n| macOS 应用 | AI 改稿服务 | 按作者的请求改写标记段落，将改稿结果交给文章会话。 | 核心包的改稿服务接口、URLSession、Keychain |\n| macOS 应用 | 本地文章库 | 保存和恢复文章及其完整版本历史，提供文章列表与 Markdown 导出。 | 核心包的文章存储接口、Foundation |\n\n## 现有验证与适用边界\n\nmacOS 临时小样已用 loro-swift 1.17.1 验证中文与 emoji 混排的下标换算、富文本标记、前文插字后的锚点位置、历史版本读取和快照重载。系统拼音的确认与取消、AppKit 撤销与正文历史的一致性、生成改稿版本后重开文章并回看段落差异，仍是应用级行为，尚未经过端到端验证。\n"}}</script>
<script>
(() => {
  'use strict';
  const data = JSON.parse(document.getElementById('architecture-data').textContent);
  const $ = id => document.getElementById(id);
  const state = { selected: data.nodes[0]?.id, view: 'definitions', query: '', status: 'all', planned: true };
  const statusNames = { scaffold: '应用骨架', partial: '部分实现', interface: '接口已定义', planned: '待实现', implemented: '已实现' };
  const layerNames = { app: 'App / 客户端', core: 'RedraftCore / 核心', adapters: 'App / 外部适配器' };
  const nodeByID = new Map(data.nodes.map(node => [node.id, node]));
  const positions = { app: [3.7, 13], editor: [3.7, 41], session: [28, 13], document: [28, 41], diff: [28, 73], rewrite: [52, 41], storage: [52, 73], ai: [78, 41], library: [78, 73] };
  const nodeElements = new Map();
  const svgNS = 'http://www.w3.org/2000/svg';

  function element(tag, className, text) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined) el.textContent = text;
    return el;
  }
  function statusBadge(status) { return element('span', `status ${status}`, statusNames[status] || status); }
  function isVisible(node) {
    const searchable = [node.title, node.subtitle, node.definition, node.summary, ...(node.symbols || []), ...(node.files || [])].join(' ').toLowerCase();
    return (state.status === 'all' || node.status === state.status) && searchable.includes(state.query);
  }
  function visibleEdges() {
    return data.edges.filter(edge => (state.planned || edge.kind === 'actual') && nodeByID.has(edge.from) && nodeByID.has(edge.to) && isVisible(nodeByID.get(edge.from)) && isVisible(nodeByID.get(edge.to)));
  }
  function relatedIDs() {
    const ids = new Set([state.selected]);
    for (const edge of visibleEdges()) {
      if (edge.from === state.selected) ids.add(edge.to);
      if (edge.to === state.selected) ids.add(edge.from);
    }
    return ids;
  }
  function buildNodes() {
    data.nodes.forEach((node, index) => {
      const button = element('button', 'node');
      button.type = 'button';
      button.dataset.node = node.id;
      const position = positions[node.id] || [3.7 + (index % 4) * 24, 13 + Math.floor(index / 4) * 28];
      button.style.left = position[0] + '%';
      button.style.top = position[1] + '%';
      button.setAttribute('aria-label', `${node.title}，${statusNames[node.status] || node.status}`);
      button.append(element('span', 'node-title', node.title), element('span', 'node-subtitle', node.subtitle || ''));
      button.addEventListener('click', () => selectNode(node.id));
      $('board').append(button);
      nodeElements.set(node.id, button);
    });
  }
  function anchor(nodeID, side) {
    const el = nodeElements.get(nodeID);
    const x = el.offsetLeft, y = el.offsetTop, w = el.offsetWidth, h = el.offsetHeight;
    return { x: side === 'left' ? x : side === 'right' ? x + w : x + w / 2, y: side === 'top' ? y : side === 'bottom' ? y + h : y + h / 2 };
  }
  function edgePath(edge) {
    const source = nodeElements.get(edge.from), target = nodeElements.get(edge.to);
    const dx = target.offsetLeft - source.offsetLeft;
    const dy = target.offsetTop - source.offsetTop;
    if (edge.from === 'document' && edge.to === 'storage') {
      const a = anchor(edge.from, 'bottom'), b = anchor(edge.to, 'left');
      const routeY = a.y + Math.max(24, (b.y - a.y) * .49);
      return `M ${a.x} ${a.y} V ${routeY} Q ${a.x} ${routeY + 10} ${a.x + 10} ${routeY + 10} H ${b.x - 22} Q ${b.x - 12} ${routeY + 10} ${b.x - 12} ${routeY + 20} V ${b.y - 10} Q ${b.x - 12} ${b.y} ${b.x - 2} ${b.y}`;
    }
    if (Math.abs(dx) < 20) {
      const a = anchor(edge.from, dy >= 0 ? 'bottom' : 'top'), b = anchor(edge.to, dy >= 0 ? 'top' : 'bottom');
      if (edge.from === 'session' && edge.to === 'diff') {
        const outsideX = source.offsetLeft - 10;
        return `M ${a.x} ${a.y} V ${a.y + 15} H ${outsideX} V ${b.y - 14} H ${b.x} V ${b.y - 2}`;
      }
      return `M ${a.x} ${a.y} L ${b.x} ${b.y + (dy >= 0 ? -2 : 2)}`;
    }
    const a = anchor(edge.from, dx > 0 ? 'right' : 'left'), b = anchor(edge.to, dx > 0 ? 'left' : 'right');
    if (edge.from === 'session') {
      const lane = source.offsetLeft + source.offsetWidth + (edge.to === 'storage' ? 13 : 25);
      return `M ${a.x} ${a.y} H ${lane} V ${b.y} H ${b.x - 2}`;
    }
    if (Math.abs(dy) < 30) return `M ${a.x} ${a.y} L ${b.x + (dx > 0 ? -2 : 2)} ${b.y}`;
    const midpoint = (a.x + b.x) / 2;
    return `M ${a.x} ${a.y} C ${midpoint} ${a.y}, ${midpoint} ${b.y}, ${b.x} ${b.y}`;
  }
  function drawEdges() {
    const svg = $('links');
    svg.replaceChildren();
    svg.setAttribute('viewBox', `0 0 ${$('board').clientWidth} ${$('board').clientHeight}`);
    const defs = document.createElementNS(svgNS, 'defs');
    for (const [id, color] of [['arrow-normal', 'var(--graph-line)'], ['arrow-selected', 'var(--blue)']]) {
      const marker = document.createElementNS(svgNS, 'marker');
      marker.setAttribute('id', id); marker.setAttribute('viewBox', '0 0 8 8'); marker.setAttribute('refX', '7'); marker.setAttribute('refY', '4'); marker.setAttribute('markerWidth', '5'); marker.setAttribute('markerHeight', '5'); marker.setAttribute('orient', 'auto');
      const arrow = document.createElementNS(svgNS, 'path'); arrow.setAttribute('d', 'M 1 1 L 7 4 L 1 7'); arrow.setAttribute('fill', 'none'); arrow.setAttribute('stroke', color); arrow.setAttribute('stroke-width', '1.3'); marker.append(arrow); defs.append(marker);
    }
    svg.append(defs);
    for (const edge of visibleEdges()) {
      const selected = edge.from === state.selected || edge.to === state.selected;
      const path = document.createElementNS(svgNS, 'path');
      path.setAttribute('d', edgePath(edge));
      path.setAttribute('class', `link ${edge.kind === 'planned' ? 'planned' : ''} ${selected ? 'related' : 'muted'}`);
      path.setAttribute('marker-end', `url(#${selected ? 'arrow-selected' : 'arrow-normal'})`);
      svg.append(path);
    }
  }
  function renderGraph() {
    const related = relatedIDs();
    let visible = 0;
    for (const node of data.nodes) {
      const button = nodeElements.get(node.id);
      button.hidden = !isVisible(node);
      button.setAttribute('aria-pressed', String(node.id === state.selected));
      button.classList.toggle('muted', !related.has(node.id));
      if (!button.hidden) visible++;
    }
    $('empty-graph').hidden = visible > 0;
    $('inspector').hidden = visible === 0;
    document.querySelector('.layout').classList.toggle('no-selection', $('inspector').hidden);
    if (state.view === 'graph') requestAnimationFrame(drawEdges);
  }
  function section(title) {
    const div = element('section', 'detail-section'); div.append(element('h3', '', title)); return div;
  }
  function addList(parent, title, items) {
    if (!items?.length) return;
    const block = section(title), list = element('ul', 'detail-list');
    items.forEach(item => list.append(element('li', '', item))); block.append(list); parent.append(block);
  }
  function showSource(file, line = 1) {
    const source = data.sources[file];
    if (typeof source !== 'string') return;
    $('source-title').textContent = file;
    $('source-lines').replaceChildren();
    source.split('\n').forEach((text, index) => {
      const item = element('li', index + 1 === line ? 'highlight' : '', text || ' ');
      $('source-lines').append(item);
    });
    $('source-dialog').showModal();
    requestAnimationFrame(() => $('source-lines').children[Math.max(0, line - 1)]?.scrollIntoView({ block: 'center' }));
  }
  function renderInspector() {
    const node = nodeByID.get(state.selected);
    if (!node) return;
    $('detail-layer').textContent = layerNames[node.layer] || node.layer;
    $('detail-title').textContent = node.title;
    $('detail-status').replaceChildren(statusBadge(node.status));
    $('detail-status').hidden = state.view !== 'implementation';
    $('detail-summary').textContent = state.view === 'implementation' ? node.summary : node.definition;
    const body = $('detail-body'); body.replaceChildren();
    if (state.view === 'implementation') {
      addList(body, '已具备', node.done);
      addList(body, '待实现', node.next);
    }
    if (state.view === 'definitions' && node.symbols?.length) {
      const block = section('接口与数据类型'), tags = element('div', 'symbols');
      node.symbols.forEach(symbol => tags.append(element('code', '', symbol))); block.append(tags); body.append(block);
    }
    const relationships = data.edges.filter(edge => (state.planned || edge.kind === 'actual') && (edge.from === node.id || edge.to === node.id));
    if (state.view === 'graph' && relationships.length) {
      const block = section('依赖关系');
      relationships.forEach(edge => {
        const outgoing = edge.from === node.id, other = nodeByID.get(outgoing ? edge.to : edge.from);
        if (!other) return;
        const button = element('button', 'relation'); button.type = 'button';
        button.append(element('span', '', `${outgoing ? '→' : '←'} ${other.title}`), element('small', '', `${edge.kind === 'actual' ? '代码引用' : '设计依赖'} · ${edge.label}`));
        button.addEventListener('click', () => selectNode(other.id)); block.append(button);
      });
      body.append(block);
    }
    const sources = element('details', 'source-disclosure');
    sources.append(element('summary', '', '查看设计与源码'));
    if (node.evidence?.length) {
      const block = section('依据');
      node.evidence.forEach(evidence => {
        const button = element('button', 'source-evidence'); button.type = 'button'; button.disabled = typeof data.sources[evidence.file] !== 'string';
        button.append(element('b', '', `${evidence.file.split('/').pop()} · ${evidence.line || 1}`), element('span', '', evidence.text));
        button.addEventListener('click', () => showSource(evidence.file, evidence.line || 1)); block.append(button);
      });
      sources.append(block);
    }
    if (node.files?.length) {
      const block = section('相关文件');
      node.files.forEach(file => {
        const button = element('button', 'file-button', file); button.type = 'button'; button.disabled = typeof data.sources[file] !== 'string';
        button.addEventListener('click', () => showSource(file)); block.append(button);
      });
      sources.append(block);
    }
    body.append(sources);
  }
  function selectNode(id) {
    if (!nodeByID.has(id)) return;
    if (!isVisible(nodeByID.get(id))) {
      state.query = ''; state.status = 'all';
      $('search').value = ''; $('status-filter').value = 'all';
    }
    state.selected = id;
    renderGraph(); renderLists(); renderInspector();
    $('announcement').textContent = `已选中${nodeByID.get(id).title}，${statusNames[nodeByID.get(id).status]}`;
  }
  function buildModuleLists() {
    for (const [layer, label] of Object.entries(layerNames)) {
      for (const view of ['definition', 'implementation']) {
        const group = element('section', 'module-group');
        group.dataset.layer = layer;
        group.append(element('h2', '', label));
        for (const node of data.nodes.filter(item => item.layer === layer)) {
          const button = element('button', view === 'definition' ? 'module-row' : 'implementation-row');
          button.type = 'button';
          button.dataset.module = node.id;
          const name = element('span');
          name.append(element('span', 'module-name', node.title));
          if (view === 'definition') name.append(element('span', 'module-symbol', node.subtitle));
          else name.append(statusBadge(node.status));
          button.append(name, element('span', view === 'definition' ? 'module-definition' : 'implementation-note', view === 'definition' ? node.definition : node.summary));
          button.addEventListener('click', () => selectNode(node.id));
          group.append(button);
        }
        $(view + '-list').append(group);
      }
    }
  }
  function renderLists() {
    for (const button of document.querySelectorAll('[data-module]')) {
      button.hidden = !isVisible(nodeByID.get(button.dataset.module));
      button.setAttribute('aria-pressed', String(button.dataset.module === state.selected));
    }
    for (const group of document.querySelectorAll('.module-group')) {
      group.hidden = !Array.from(group.querySelectorAll('[data-module]')).some(button => !button.hidden);
    }
    const empty = !data.nodes.some(isVisible);
    $('definitions-empty').hidden = !empty;
    $('implementation-empty').hidden = !empty;
  }
  function setView(view) {
    state.view = view;
    if (view !== 'implementation') {
      state.status = 'all';
      $('status-filter').value = 'all';
    }
    for (const name of ['definitions', 'graph', 'implementation']) {
      $(name + '-panel').hidden = view !== name;
      $(name + '-tab').setAttribute('aria-pressed', String(view === name));
    }
    $('status-filter').hidden = view !== 'implementation';
    renderGraph(); renderLists(); renderInspector();
  }
  $('branch').textContent = `${data.meta.branch} · ${data.meta.commit}${data.meta.dirty ? ' · 含未提交修改' : ''}`;
  $('review-date').textContent = `状态核对 ${data.meta.reviewedAt || '未记录'}`;
  $('snapshot-date').textContent = `快照生成 ${new Date(data.meta.generatedAt).toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai', dateStyle: 'short', timeStyle: 'short' })}`;
  $('stale').hidden = !data.meta.reviewStale;
  $('package-from').textContent = data.packageDependency.from;
  $('package-to').textContent = data.packageDependency.to;
  $('package-evidence').textContent = `包依赖依据 · ${data.packageDependency.evidence}`;
  $('fingerprint').textContent = `源码指纹 ${String(data.meta.sourceHash || '').slice(0, 12)}`;
  $('graph-tab').addEventListener('click', () => setView('graph'));
  $('definitions-tab').addEventListener('click', () => setView('definitions'));
  $('implementation-tab').addEventListener('click', () => setView('implementation'));
  $('show-planned').addEventListener('change', event => { state.planned = event.target.checked; renderGraph(); renderInspector(); });
  function applyFilter() {
    state.query = $('search').value.trim().toLowerCase(); state.status = $('status-filter').value;
    const visible = data.nodes.filter(isVisible);
    if (visible.length && !visible.some(node => node.id === state.selected)) state.selected = visible[0].id;
    renderGraph(); renderLists(); renderInspector();
    $('announcement').textContent = visible.length ? '已更新筛选结果' : '没有匹配的模块';
  }
  $('search').addEventListener('input', applyFilter);
  $('status-filter').addEventListener('change', applyFilter);
  $('close-source').addEventListener('click', () => $('source-dialog').close());
  $('source-dialog').addEventListener('click', event => { if (event.target === $('source-dialog')) { const rect = $('source-dialog').getBoundingClientRect(); if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) $('source-dialog').close(); } });
  buildNodes(); buildModuleLists(); renderGraph(); renderLists(); renderInspector();
  new ResizeObserver(() => { if (state.view === 'graph') requestAnimationFrame(drawEdges); }).observe($('board'));
})();
</script>
</body>
</html>
