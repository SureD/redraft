<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>需求运行看板 · Redraft</title>
<style>
:root {
  color-scheme: light dark;
  --page: #f5f5f7; --surface: #fff; --subtle: #f7f8fa; --ink: #1d1d1f;
  --muted: #63636b; --line: #e1e2e6; --blue: #0065c9; --green: #217343;
  --amber: #8a5706; --red: #b93832; --purple: #7351a6; --warn-bg: #fff9ed;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #161617; --surface: #212123; --subtle: #28282b; --ink: #f5f5f7;
    --muted: #b0b0b8; --line: #3a3a3e; --blue: #70b2ff; --green: #77cc98;
    --amber: #e6b667; --red: #ff9d94; --purple: #c6a6f6; --warn-bg: #302a20;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
main { margin: auto; max-width: 1360px; padding: 34px clamp(16px, 3.4vw, 48px) 48px; }
h1, h2, h3, p, ol { margin: 0; }
h1 { font-size: 30px; line-height: 1.2; font-weight: 660; letter-spacing: -.7px; }
h2 { font-size: 18px; line-height: 1.45; font-weight: 650; }
h3 { font-size: 14px; font-weight: 620; }
button, select { font: inherit; color: inherit; }
button, summary, select { cursor: pointer; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
header, .brand, .controls, .section-head, .task-heading, .meta, .field { display: flex; align-items: center; gap: 9px; }
header, .section-head { justify-content: space-between; }
header { align-items: flex-end; flex-wrap: wrap; gap: 14px; margin-bottom: 24px; }
.brand { color: var(--muted); font-weight: 600; font-size: 13px; margin-bottom: 8px; }
.brand-mark { width: 21px; height: 21px; display: inline-grid; place-items: center; background: var(--ink); color: var(--surface); border-radius: 6px; font: italic 17px Georgia, serif; }
.brand a { color: inherit; font-weight: 450; }
.divider { color: var(--line); }
.controls, .meta, .field { flex-wrap: wrap; }
.controls { color: var(--muted); font-size: 12px; gap: 12px; }
button.control, select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
button.control { padding: 5px 12px; }
button.control:hover { border-color: var(--muted); }
select { padding: 6px 9px; width: min(320px, 100%); font-size: 13px; }
.dot, .status { display: inline-flex; align-items: center; gap: 7px; }
.dot::before, .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.dot[data-level="ok"]::before { color: var(--green); }
.dot[data-level="error"]::before { color: var(--red); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.blank { padding: 40px 28px; }
.blank p, .caption, .muted { color: var(--muted); }
.blank p { margin-top: 6px; }
code, time { font-variant-numeric: tabular-nums; }
code { font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; }
.blank code { display: inline-block; background: var(--subtle); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; margin-top: 10px; }
.notice { background: var(--warn-bg); border: 1px solid color-mix(in srgb, var(--amber) 30%, var(--line)); border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; }
.scope { margin-bottom: 12px; font-size: 13px; color: var(--muted); }
.summary { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
.summary > div { padding: 20px 24px; }
.summary > div + div { border-left: 1px solid var(--line); }
.label, .detail-label { font-size: 12px; color: var(--muted); font-weight: 550; }
#run-title { margin: 5px 0; font-size: clamp(20px, 2.5vw, 26px); letter-spacing: -.3px; line-height: 1.4; }
#goal, #acceptance { margin-top: 5px; }
.meta { font-size: 12px; color: var(--muted); margin-top: 12px; gap: 4px 16px; }
.status { font-weight: 550; font-size: 12px; white-space: nowrap; color: var(--muted); }
.status[data-type="working"] { color: var(--blue); }
.status[data-type="verifying"] { color: var(--purple); }
.status[data-type="done"], .status[data-type="accepted"] { color: var(--green); }
.status[data-type="waiting"], .status[data-type="decision"], .status[data-type="unknown"] { color: var(--amber); }
.status[data-type="failed"] { color: var(--red); }
#acceptance-state { margin-left: 7px; }
#run-result { margin-top: 7px; font-size: 13px; color: var(--muted); }
section + section, #decision-panel { margin-top: 16px; }
.section-head { gap: 12px; padding: 16px 22px; }
.section-head small { color: var(--muted); font-size: 12px; }
#decision-panel { background: var(--warn-bg); border-color: color-mix(in srgb, var(--amber) 28%, var(--line)); }
.decision-list { padding: 0 22px 16px; }
.decision + .decision { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
.decision .field { margin: 6px 0 3px; font-size: 12px; }
.decision .muted { font-size: 13px; }
.body-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.rows { padding: 0 12px 8px; }
.table-head, .row-grid { display: grid; grid-template-columns: minmax(135px, 1.15fr) minmax(100px, .73fr) minmax(150px, 2.2fr) minmax(106px, .78fr) 12px; align-items: start; gap: 16px; }
.table-head { border-bottom: 1px solid var(--line); padding: 8px 10px; color: var(--muted); font-size: 12px; }
.task + .task { border-top: 1px solid var(--line); }
.task > summary { list-style: none; border-radius: 7px; padding: 14px 10px; }
.task > summary::-webkit-details-marker { display: none; }
.task > summary:hover { background: var(--subtle); }
.task[open] > summary { background: var(--subtle); }
.arrow { display: inline-block; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; padding: 3px; margin-top: 5px; justify-self: end; transform: rotate(45deg); }
.task[open] .arrow { transform: rotate(225deg); margin-top: 9px; }
.module { font-weight: 600; font-size: 14px; }
.sub { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
.row-summary { font-size: 13px; }
.updated { font-size: 12px; font-variant-numeric: tabular-nums; }
.warn { color: var(--amber); }
.details { display: grid; grid-template-columns: 85px minmax(0, 1fr); gap: 6px 12px; padding: 12px 10px 18px 23px; }
.details dd, .details dt { margin: 0; }
.details dd { overflow-wrap: anywhere; font-size: 13px; }
.details dt { font-size: 12px; color: var(--muted); }
dl.details { margin: 0; }
.empty-line { color: var(--muted); padding: 0 22px 20px; font-size: 13px; }
.log > summary { padding: 15px 22px; font-size: 14px; font-weight: 600; }
.log ol { padding: 0 22px 15px; list-style: none; }
.log li { border-top: 1px solid var(--line); padding: 10px 0; }
.log .caption { font-size: 12px; }
.log time { margin-right: 10px; }
.log .body-text { margin-top: 2px; font-size: 13px; }
#run-evidence { margin-top: 8px; font-size: 12px; }
#run-evidence summary { color: var(--blue); width: fit-content; }
#run-evidence p { margin-top: 4px; }
@media (max-width: 720px) {
  main { padding: 22px 14px 32px; }
  h1 { font-size: 27px; }
  .summary { grid-template-columns: minmax(0, 1fr); }
  .summary > div { padding: 15px 17px; }
  .summary > div + div { border-left: 0; border-top: 1px solid var(--line); }
  .table-head { display: none; }
  .row-grid { grid-template-columns: minmax(0, 1fr) auto 9px; gap: 5px 12px; align-items: center; }
  .task > summary { border-top: 1px solid var(--line); }
  .task + .task { border-top: 0; }
  .task-name { grid-area: 1 / 1; }
  .task-state { grid-area: 1 / 2; }
  .arrow { grid-area: 1 / 3; align-self: start; }
  .row-summary { grid-area: 2 / 1 / 3 / 4; }
  .updated { grid-area: 3 / 1 / 4 / 4; color: var(--muted); }
  .updated time::before { content: "最近上报 "; }
  .section-head { padding: 15px 17px; }
  .field select { flex: 1; min-width: 0; }
  .details { grid-template-columns: 65px minmax(0, 1fr); padding-left: 10px; }
}
</style>
</head>
<body>
<main>
<header>
  <div><nav class="brand" aria-label="开发工具"><span class="brand-mark" aria-hidden="true">r</span> Redraft <span class="divider" aria-hidden="true">/</span> <a href="/architecture.html?monitor">架构</a></nav><h1>需求运行看板</h1></div>
  <div class="controls"><span class="dot" id="sync-state">正在连接</span><button class="control" id="refresh" type="button">刷新</button></div>
</header>
<p class="notice" id="notice" role="status" hidden></p>
<div class="panel blank" id="empty" hidden><h2>还没有需求记录</h2><p>主 Agent 登记需求后，这里会显示分工、进展和验收结果。</p><code id="first-command"></code></div>
<div id="board" hidden>
  <label class="field scope" id="run-switcher" hidden>切换需求 <select id="runs"></select></label>
  <section class="panel summary" aria-labelledby="run-title">
    <div><span class="label">当前需求</span><h2 id="run-title" class="body-text"></h2><p id="goal" class="body-text"></p><div class="meta"><span id="lead"></span><span>最近上报 <time id="run-time"></time></span></div></div>
    <div><span class="label">整体验收</span><span id="acceptance-state"></span><p id="acceptance" class="body-text"></p><p id="run-result" class="body-text"></p><details id="run-evidence" hidden><summary>验收证据</summary><p class="body-text"></p></details></div>
  </section>
  <section class="panel" id="decision-panel" aria-labelledby="decision-title" hidden><div class="section-head"><h2 id="decision-title">待我决定</h2><small id="decision-count"></small></div><div class="decision-list" id="decisions"></div></section>
  <section class="panel" aria-labelledby="tasks-title"><div class="section-head"><h2 id="tasks-title">模块任务</h2><small id="task-count"></small></div>
    <div class="rows" id="rows"><div class="table-head" aria-hidden="true"><span>模块 / 负责人</span><span>任务状态</span><span>当前工作</span><span>最近上报</span><span></span></div><div id="tasks"></div></div>
    <p class="empty-line" id="no-tasks" hidden>主 Agent 还没有登记模块任务。</p>
  </section>
  <section class="panel" aria-label="运行记录"><details class="log" id="log"><summary>运行记录</summary><ol id="events"></ol></details></section>
</div>
<noscript><p class="notice">请启用 JavaScript 查看运行看板。</p></noscript>
</main>
<script>
'use strict';
const byId = id => document.getElementById(id);
const taskLabels = {queued: '待开始', working: '进行中', waiting: '等待依赖', decision: '等待决策', verifying: '验证中', done: '已完成', failed: '失败', unknown: '状态待确认'};
const acceptanceLabels = {active: '待验收', verifying: '验收中', accepted: '已通过', failed: '未通过'};
const leadLabels = {active: '主 Agent · 已登记需求', verifying: '主 Agent · 已开始验收', accepted: '主 Agent · 验收通过', failed: '主 Agent · 已记录验收失败'};
const sources = {coordinator: '主 Agent 上报', agent: '模块 Agent 上报', process: '进程记录', codex: 'Codex 插件'};
const codexLabels = {bound: '已关联，等待运行事件', started: '已收到启动事件', stopped: '本轮执行已结束'};
let snapshot;
let selected = '';
let modules = new Map();
let choiceKey = '';
let renderKey = '';
let lastSync;
let pending = false;
let pollTimer;
const quietAfter = 10 * 60 * 1000;

function el(tag, value, className) {
  const node = document.createElement(tag);
  if (value) node.textContent = value;
  if (className) node.className = className;
  return node;
}
function setText(id, value) {
  const node = byId(id);
  node.textContent = value || '';
  node.hidden = !value;
}
function badge(value, label) {
  const node = el('span', label || '状态待确认', 'status');
  node.dataset.type = value;
  return node;
}
const sameDay = (a, b) => a.toDateString() === b.toDateString();
function stamp(value) {
  const d = new Date(value);
  if (!value || !Number.isFinite(d.getTime())) return '时间未知';
  return new Intl.DateTimeFormat('zh-CN', {
    ...(sameDay(d, new Date()) ? {} : {year: 'numeric', month: '2-digit', day: '2-digit'}),
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
  }).format(d);
}
function clock(value) {
  const node = el('time', stamp(value));
  node.dateTime = value;
  node.title = value ? new Date(value).toLocaleString('zh-CN') : '时间未知';
  return node;
}
function quiet(task) {
  return ['working', 'verifying'].includes(task.status) &&
    Number.isFinite(Date.parse(task.updatedAt)) && Date.now() - Date.parse(task.updatedAt) > quietAfter;
}
function moduleTitle(task) {
  return modules.get(task.module) || task.module || '工程工具';
}
function moduleLink(task) {
  if (!modules.has(task.module)) return el('span', moduleTitle(task));
  const node = el('a', moduleTitle(task));
  node.href = '/architecture.html?monitor#module=' + encodeURIComponent(task.module);
  return node;
}
function taskLine(task) {
  if (task.status === 'decision') return task.decision || task.summary;
  if (task.status === 'waiting') return task.waitingFor || task.summary;
  return task.summary;
}
function processLabel(process) {
  if (process.status === 'running') return '运行中，上次心跳 ' + stamp(process.lastSeen);
  if (process.status === 'unknown') return '状态待确认，上次心跳 ' + stamp(process.lastSeen);
  if (process.status === 'exited') return '已结束（退出码 ' + process.exitCode + '）';
  if (process.status === 'failed') return '异常结束' + (process.exitCode == null ? '' : '（退出码 ' + process.exitCode + '）');
  return '状态待确认';
}
function pair(list, label, value) {
  if (!value) return;
  const detail = el('dd', '', 'body-text');
  if (typeof value === 'string') detail.textContent = value;
  else detail.append(value);
  list.append(el('dt', label), detail);
}
function taskRow(task, runId, expanded) {
  const item = el('details', '', 'task');
  item.dataset.run = runId;
  item.open = expanded;
  const head = el('summary', '', 'row-grid');
  head.dataset.task = task.id;
  const who = el('span', '', 'task-name');
  who.append(el('span', moduleTitle(task), 'module'), el('span', task.agent, 'sub'));
  const state = el('span', '', 'task-state');
  state.append(badge(task.status, taskLabels[task.status]));
  if (task.codex) state.append(el('span', codexLabels[task.codex.status], 'sub'));
  const updated = el('span', '', 'updated');
  updated.append(clock(task.updatedAt));
  if (quiet(task)) {
    const subtitle = task.process?.status === 'running' ? '10 分钟未报新进展' : '10 分钟未报，待确认';
    updated.append(el('span', subtitle, 'sub warn'));
  }
  const arrow = el('span', '', 'arrow');
  arrow.setAttribute('aria-hidden', 'true');
  head.append(who, state, el('span', taskLine(task) || '尚无工作说明', 'row-summary body-text'), updated, arrow);
  const detail = el('dl', '', 'details');
  pair(detail, '任务', task.id);
  pair(detail, '分工', task.assignment);
  if (task.module) pair(detail, '架构定义', moduleLink(task));
  pair(detail, '状态来源', sources[task.source] || task.source);
  if (task.codex) {
    pair(detail, 'Codex 事件', codexLabels[task.codex.status]);
    if (task.codex.updatedAt) pair(detail, '事件时间', clock(task.codex.updatedAt));
    pair(detail, '子 Agent ID', task.codex.agentId);
  }
  if (task.process) pair(detail, '执行进程', processLabel(task.process));
  if (task.summary && task.summary !== taskLine(task)) pair(detail, '工作说明', task.summary);
  pair(detail, '等待条件', task.waitingFor);
  pair(detail, '待决问题', task.decision);
  pair(detail, '建议', task.recommendation);
  pair(detail, '验证证据', task.evidence);
  item.append(head, detail);
  return item;
}
function decisionCard(task) {
  const card = el('article', '', 'decision');
  const who = el('div', '', 'field');
  who.append(moduleLink(task), el('span', task.agent, 'muted'));
  card.append(el('h3', task.decision || task.summary || '需要工程师决定', 'body-text'), who);
  if (task.recommendation) card.append(el('p', '建议 · ' + task.recommendation, 'muted body-text'));
  if (task.waitingFor) card.append(el('p', '等待条件 · ' + task.waitingFor, 'muted body-text'));
  return card;
}
function eventItem(event, tasksById) {
  const item = el('li');
  const line = el('div', '', 'caption');
  const task = tasksById.get(event.task);
  const entity = task ? moduleTitle(task) + ' / ' + task.agent : '整条需求';
  const status = event.source === 'codex' ? codexLabels[event.status] :
    (event.task ? taskLabels[event.status] : acceptanceLabels[event.status]);
  line.append(clock(event.at), document.createTextNode([entity, sources[event.source], status].filter(Boolean).join(' · ')));
  item.append(line);
  if (event.summary) item.append(el('p', event.summary, 'body-text'));
  for (const [label, value] of [['等待条件', event.waitingFor], ['待决问题', event.decision],
    ['建议', event.recommendation], ['证据', event.evidence]]) {
    if (value) item.append(el('p', label + ' · ' + value, 'body-text muted'));
  }
  return item;
}
function render() {
  const runs = snapshot.runs;
  byId('board').hidden = !runs.length;
  byId('empty').hidden = !!runs.length;
  if (!runs.length) {
    selected = '';
    renderKey = '';
    return;
  }
  const idFromUrl = new URLSearchParams(location.hash.slice(1)).get('run');
  const run = runs.find(item => item.id === (idFromUrl || selected)) || runs[0];
  if (run.id !== idFromUrl) history.replaceState(null, '', '#' + new URLSearchParams({run: run.id}));
  if (selected !== run.id) {
    byId('log').open = false;
    byId('run-evidence').open = false;
    selected = run.id;
  }
  const choices = JSON.stringify(runs.map(item => [item.id, item.title]));
  if (choices !== choiceKey) {
    byId('runs').replaceChildren(...runs.map(item => new Option(item.title, item.id)));
    choiceKey = choices;
  }
  byId('runs').value = run.id;
  byId('run-switcher').hidden = runs.length < 2;
  const key = JSON.stringify([run, snapshot.modules, run.tasks.map(quiet), new Date().toDateString()]);
  if (key === renderKey) return;
  const focused = document.activeElement?.dataset.task;
  const focusModule = document.activeElement?.closest('.task')?.querySelector('summary')?.dataset.task;
  modules = new Map(snapshot.modules.map(module => [module.id, module.title]));
  setText('run-title', run.title);
  setText('goal', run.goal);
  setText('lead', leadLabels[run.status] || '主 Agent');
  byId('run-time').textContent = stamp(run.updatedAt);
  byId('run-time').dateTime = run.updatedAt;
  byId('acceptance-state').replaceChildren(badge(run.status, acceptanceLabels[run.status]));
  setText('acceptance', run.acceptance || '尚未登记验收条件。');
  setText('run-result', run.summary);
  byId('run-evidence').hidden = !run.evidence;
  byId('run-evidence').querySelector('p').textContent = run.evidence || '';
  const decisions = run.tasks.filter(task => task.status === 'decision');
  byId('decisions').replaceChildren(...decisions.map(decisionCard));
  byId('decision-panel').hidden = !decisions.length;
  setText('decision-count', decisions.length + ' 项');
  setText('task-count', run.tasks.filter(task => task.status === 'done').length + ' / ' + run.tasks.length + ' 已完成');
  const tasks = byId('tasks');
  const expanded = new Set(Array.from(tasks.children)
    .filter(row => row.open && row.dataset.run === run.id)
    .map(row => row.querySelector('summary').dataset.task));
  const taskNodes = run.tasks.map(task => taskRow(task, run.id, expanded.has(task.id)));
  tasks.replaceChildren(...taskNodes);
  byId('rows').hidden = !run.tasks.length;
  byId('no-tasks').hidden = !!run.tasks.length;
  if (focusModule) {
    const row = taskNodes.find(item => item.querySelector('summary').dataset.task === focusModule);
    const target = row?.querySelector(focused ? 'summary' : 'a');
    target?.focus({preventScroll: true});
  }
  const tasksById = new Map(run.tasks.map(task => [task.id, task]));
  byId('events').replaceChildren(...run.events.map(event => eventItem(event, tasksById)));
  renderKey = key;
}
async function refresh() {
  if (pending) return;
  pending = true;
  clearTimeout(pollTimer);
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 8000);
  try {
    const response = await fetch('/api/state', {cache: 'no-store', signal: controller.signal});
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    if (!Array.isArray(data.runs) || !Array.isArray(data.modules)) throw new Error('无效的运行记录');
    snapshot = data;
    render();
    lastSync = new Date();
    const sync = byId('sync-state');
    sync.textContent = '已同步 ' + stamp(lastSync);
    sync.dataset.level = 'ok';
    byId('notice').hidden = true;
  } catch {
    const sync = byId('sync-state');
    sync.textContent = '同步中断';
    sync.dataset.level = 'error';
    const message = lastSync ? '显示 ' + stamp(lastSync) + ' 最后同步的记录，将自动重试。' : '请确认本地看板服务正在运行，稍后将自动重试。';
    setText('notice', message);
  } finally {
    clearTimeout(timeout);
    pending = false;
    pollTimer = setTimeout(refresh, 4000);
  }
}
byId('runs').addEventListener('change', event => {
  location.hash = new URLSearchParams({run: event.target.value}).toString();
});
