  <div class="desktop">
    <div class="window" id="app" data-mode="write">
      <aside class="sidebar" id="sidebar" aria-label="文章库">
        <div class="sidebar-head">
          <div class="brand" aria-label="Redraft">
            <span class="brand-mark" aria-hidden="true">R</span>
            <span class="brand-name">Redraft</span>
          </div>
          <button class="icon-btn only-drawer" id="sidebar-close" type="button" aria-label="收起文章库">
            <svg class="icon"><use href="#i-sidebar"/></svg>
          </button>
        </div>
        <label class="search-field">
          <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="article-search" type="search" placeholder="搜索文章" autocomplete="off" aria-label="搜索文章">
        </label>
        <nav class="sidebar-scroll" aria-label="导航">
          <h2 class="section-title" id="articles-heading">文章</h2>
          <ul class="article-list" id="article-list" aria-labelledby="articles-heading"></ul>
          <h2 class="section-title">资料库</h2>
          <ul class="article-list">
            <li><button type="button" class="nav-row" id="nav-examples">
              <svg class="icon" aria-hidden="true"><use href="#i-quote"/></svg>
              <span class="nav-label">改写范例</span>
              <span class="nav-count" id="examples-count"></span>
            </button></li>
          </ul>
        </nav>
        <div class="sidebar-foot">
          <button type="button" class="foot-btn" id="new-article">
            <svg class="icon" aria-hidden="true"><use href="#i-compose"/></svg>新建文章
          </button>
        </div>
      </aside>
      <div class="scrim" id="scrim" hidden></div>

      <main class="main" id="main">
        <header class="toolbar" id="toolbar"></header>
        <div class="formatbar" id="formatbar" role="toolbar" aria-label="排版" aria-controls="content" hidden></div>
        <div class="content" id="content" tabindex="-1"></div>
      </main>

      <aside class="inspector" id="inspector" aria-label="检查器"></aside>
    </div>
  </div>

  <div class="toast-region" id="toasts" aria-live="polite"></div>
  <div class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></div>
  <div id="layer"></div>

  <script src="diff.js"></script>
  <script src="rich.js"></script>
  <script src="mock-ai.js"></script>
  <script src="session.js"></script>
  <script src="samples.js"></script>
  <script src="app.js"></script>
</body>
</html>
